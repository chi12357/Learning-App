<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>歷史年表</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Inter:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 28.8px; -webkit-text-size-adjust: 100%; transition: font-size 0.15s ease; scroll-padding-top: 120px; }
        body { background-color: #121315; color: #fcfbfa; font-family: 'Noto Serif TC', 'Inter', 'Cormorant Garamond', serif; padding: 16px 12px 40px; min-height: 100vh; line-height: 1.6; }
        .app { max-width: 820px; margin: 0 auto; }
        .app-header { text-align: center; padding: 8px 0 16px; border-bottom: 2px solid rgba(189, 139, 42, 0.25); margin-bottom: 12px; }
        .app-header h1 { font-size: 1.9rem; font-weight: 700; letter-spacing: 4px; color: #fcfbfa; text-shadow: 0 0 12px rgba(189, 139, 42, 0.15); }
        .app-header h1 small { display: block; font-size: 0.65rem; font-weight: 400; letter-spacing: 6px; color: rgba(252, 251, 250, 0.5); margin-top: 2px; font-family: 'Inter', sans-serif; }
        .sticky-toolbar { position: sticky; top: 0; z-index: 100; background-color: rgba(18, 19, 21, 0.92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 10px 0 6px; margin-bottom: 14px; border-bottom: 1px solid rgba(252, 251, 250, 0.06); }
        .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .search-wrap { flex: 1; position: relative; min-width: 150px; }
        .search-wrap input { width: 100%; padding: 10px 14px 10px 44px; font-size: 0.95rem; font-family: 'Noto Serif TC', serif; background: rgba(252, 251, 250, 0.07); border: 1.5px solid rgba(252, 251, 250, 0.15); border-radius: 60px; color: #fcfbfa; outline: none; transition: border-color 0.3s, box-shadow 0.3s; -webkit-appearance: none; }
        .search-wrap input::placeholder { color: rgba(252, 251, 250, 0.35); font-weight: 400; }
        .search-wrap input:focus { border-color: #bd8b2a; box-shadow: 0 0 0 3px rgba(189, 139, 42, 0.2); }
        .search-wrap .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 1.1rem; color: rgba(252, 251, 250, 0.3); pointer-events: none; line-height: 1; }
        .search-wrap .clear-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: rgba(252, 251, 250, 0.3); font-size: 1.1rem; cursor: pointer; padding: 4px 8px; display: none; line-height: 1; border-radius: 50%; transition: background 0.2s; }
        .search-wrap .clear-btn:hover { background: rgba(252, 251, 250, 0.08); }
        .search-wrap .clear-btn.visible { display: block; }
        .controls-group { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
        .controls-group .toggle-all-btn { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid rgba(252, 251, 250, 0.15); background: rgba(252, 251, 250, 0.04); color: rgba(252, 251, 250, 0.4); font-size: 1.6rem; cursor: pointer; transition: background 0.2s, border-color 0.2s, transform 0.35s ease; display: flex; align-items: center; justify-content: center; line-height: 1; user-select: none; -webkit-tap-highlight-color: transparent; padding: 0; }
        .controls-group .toggle-all-btn:hover { background: rgba(252, 251, 250, 0.08); }
        .controls-group .toggle-all-btn:active { background: rgba(189, 139, 42, 0.15); border-color: rgba(189, 139, 42, 0.3); }
        .controls-group .toggle-all-btn.all-open { transform: rotate(180deg); color: rgba(252, 251, 250, 0.6); }
        .controls-group .divider { width: 1px; height: 28px; background: rgba(252, 251, 250, 0.08); flex-shrink: 0; }
        .font-controls { display: flex; gap: 4px; flex-shrink: 0; align-items: center; }
        .font-controls button { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid rgba(252, 251, 250, 0.15); background: rgba(252, 251, 250, 0.04); color: #fcfbfa; font-size: 1.2rem; font-weight: 300; cursor: pointer; transition: background 0.2s, border-color 0.2s; display: flex; align-items: center; justify-content: center; line-height: 1; user-select: none; -webkit-tap-highlight-color: transparent; }
        .font-controls button:hover { background: rgba(252, 251, 250, 0.08); }
        .font-controls button:active { background: rgba(189, 139, 42, 0.15); border-color: rgba(189, 139, 42, 0.3); }
        .font-controls .font-size-label { font-size: 0.65rem; color: rgba(252, 251, 250, 0.3); font-family: 'Inter', sans-serif; display: flex; align-items: center; padding: 0 4px; min-width: 28px; justify-content: center; }
        .stats { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: rgba(252, 251, 250, 0.4); padding: 0 4px 10px; font-family: 'Inter', sans-serif; letter-spacing: 0.3px; border-bottom: 1px solid rgba(252, 251, 250, 0.05); margin-bottom: 14px; flex-wrap: wrap; gap: 4px; }
        .stats .count { font-weight: 500; }
        .stats .hint { font-size: 0.7rem; opacity: 0.5; }
        .dynasty { margin-bottom: 12px; border-radius: 12px; background: rgba(252, 251, 250, 0.03); border: 1px solid rgba(252, 251, 250, 0.06); overflow: hidden; transition: border-color 0.3s; }
        .dynasty.highlight { border-color: rgba(189, 139, 42, 0.35); }
        .dynasty-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; transition: background 0.2s; gap: 12px; min-height: 64px; }
        .dynasty-header:hover { background: rgba(252, 251, 250, 0.04); }
        .dynasty-header:active { background: rgba(252, 251, 250, 0.07); }
        .dynasty-name { font-size: 2.6rem; font-weight: 700; color: #fcfbfa; letter-spacing: 2px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
        .dynasty-name .years { font-size: 1.6rem; font-weight: 400; color: rgba(252, 251, 250, 0.4); font-family: 'Inter', sans-serif; letter-spacing: 0.5px; }
        .dynasty-name .badge { font-size: 1.2rem; font-weight: 400; color: rgba(252, 251, 250, 0.3); background: rgba(252, 251, 250, 0.06); padding: 0 10px; border-radius: 20px; font-family: 'Inter', sans-serif; letter-spacing: 0.5px; }
        .dynasty-toggle { flex-shrink: 0; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: rgba(252, 251, 250, 0.35); transition: transform 0.35s ease, color 0.2s; border-radius: 50%; background: rgba(252, 251, 250, 0.04); }
        .dynasty-toggle.open { transform: rotate(180deg); color: rgba(252, 251, 250, 0.6); }
        .dynasty-body { overflow: hidden; transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease; max-height: 0; opacity: 0; padding: 0 4px; }
        .dynasty-body.open { max-height: 9999px; opacity: 1; padding: 0 4px 8px; }
        .emperor-grid { display: flex; flex-direction: column; gap: 2px; }
        .emperor-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px 10px; padding: 10px 14px; border-radius: 8px; background: rgba(252, 251, 250, 0.02); transition: background 0.2s, border-color 0.2s; border-left: 2px solid transparent; align-items: start; min-height: 52px; }
        .emperor-row:hover { background: rgba(252, 251, 250, 0.04); }
        .emperor-row.match { background: rgba(189, 139, 42, 0.08); border-left-color: #bd8b2a; }
        .emperor-row.cross-year { border-left-color: #942525; background: rgba(148, 37, 37, 0.06); }
        .emperor-row.editing { background: rgba(189, 139, 42, 0.06); border-left-color: #bd8b2a; border-left-width: 4px; }

        /* 皇帝欄位：增加「改」按鈕 */
        .col-emperor { font-weight: 600; font-size: 1.425rem; color: #fcfbfa; letter-spacing: 0.5px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding-top: 4px; line-height: 1.3; width: 100%; }
        .col-emperor .emp-era { font-weight: 700; display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 6px; width: 100%; }
        .col-emperor .emp-name { font-weight: 700; }
        .col-emperor .era-name { font-weight: 700; }
        .col-emperor .year-range { font-weight: 400; color: rgba(252, 251, 250, 0.45); font-family: 'Inter', sans-serif; letter-spacing: 0.3px; font-size: 0.85rem; display: inline; margin-right: 8px; }
        .col-emperor .edit-row-btn { font-size: 0.6rem; background: none; border: 1px solid rgba(189, 139, 42, 0.3); color: #bd8b2a; border-radius: 12px; padding: 0 8px; cursor: pointer; font-family: 'Inter', sans-serif; transition: background 0.2s; line-height: 1.6; display: inline-block; vertical-align: middle; }
        .col-emperor .edit-row-btn:hover { background: rgba(189, 139, 42, 0.15); }
        .col-emperor .edit-row-btn.active { background: #bd8b2a; color: #121315; border-color: #bd8b2a; }
        .col-emperor .edit-row-btn.active:hover { background: #d4a83a; }

        .col-china { font-size: 0.9rem; color: #fcfbfa; line-height: 1.6; }
        .col-world { font-size: 0.85rem; color: rgba(252, 251, 250, 0.7); line-height: 1.6; }
        .col-china .event-item, .col-world .event-item { display: block; padding: 2px 0; cursor: pointer; border-radius: 4px; transition: background 0.15s ease; -webkit-tap-highlight-color: transparent; user-select: none; }
        .col-china .event-item:hover, .col-world .event-item:hover { background: rgba(252, 251, 250, 0.06); }
        .col-china .event-item:active, .col-world .event-item:active { background: rgba(189, 139, 42, 0.2); }
        .col-china .event-item.flash, .col-world .event-item.flash { animation: flashClick 0.4s ease; }
        @keyframes flashClick { 0% { background: rgba(189, 139, 42, 0); } 30% { background: rgba(189, 139, 42, 0.4); } 100% { background: rgba(189, 139, 42, 0); } }
        .col-china .bullet { display: inline-block; margin-right: 6px; color: #942525; font-weight: 700; font-size: 1.2em; }
        .col-china .cross-tag { font-size: 0.6rem; color: #942525; background: rgba(148, 37, 37, 0.15); padding: 0 8px; border-radius: 12px; margin-right: 4px; font-weight: 600; letter-spacing: 0.5px; display: inline-block; vertical-align: middle; }
        .col-world .bullet { display: inline-block; margin-right: 6px; color: #bd8b2a; font-weight: 700; font-size: 1.2em; }
        .search-match { background: rgba(189, 139, 42, 0.25); border-radius: 2px; padding: 0 2px; color: #fcfbfa; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px); background: rgba(18, 19, 21, 0.92); backdrop-filter: blur(8px); color: #fcfbfa; padding: 10px 24px; border-radius: 20px; font-size: 0.85rem; font-family: 'Inter', sans-serif; border: 1px solid rgba(189, 139, 42, 0.2); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); opacity: 0; transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 999; pointer-events: none; max-width: 88vw; text-align: center; white-space: normal; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast .icon { margin-right: 8px; }
        .empty-state { text-align: center; padding: 40px 20px; color: rgba(252, 251, 250, 0.3); font-size: 1rem; letter-spacing: 1px; }
        .empty-state .icon { font-size: 2.4rem; margin-bottom: 12px; opacity: 0.4; }
        .col-china .no-event, .col-world .no-event { color: rgba(252, 251, 250, 0.2); cursor: default; }
        .loading { text-align: center; padding: 60px 20px; color: rgba(252, 251, 250, 0.5); font-size: 1.2rem; }
        .loading .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid rgba(189, 139, 42, 0.15); border-top-color: #bd8b2a; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-state { text-align: center; padding: 60px 20px; color: rgba(252, 251, 250, 0.5); }
        .error-state .icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.5; }
        .error-state .retry-btn { margin-top: 16px; padding: 10px 28px; border-radius: 40px; border: 1px solid rgba(189, 139, 42, 0.3); background: rgba(189, 139, 42, 0.1); color: #fcfbfa; font-size: 0.9rem; cursor: pointer; transition: background 0.2s; }
        .error-state .retry-btn:hover { background: rgba(189, 139, 42, 0.2); }

        /* 編輯模式專用樣式（僅在該行內生效） */
        .event-edit { display: flex; align-items: center; gap: 4px; margin: 2px 0; flex-wrap: wrap; }
        .event-edit input[type="text"] { flex: 1; min-width: 100px; background: rgba(252, 251, 250, 0.08); border: 1px solid rgba(252, 251, 250, 0.2); border-radius: 6px; color: #fcfbfa; padding: 2px 6px; font-size: 0.85rem; font-family: 'Noto Serif TC', serif; outline: none; transition: border-color 0.2s; }
        .event-edit input[type="text"]:focus { border-color: #bd8b2a; }
        .event-edit .btn-sm { background: rgba(252, 251, 250, 0.08); border: 1px solid rgba(252, 251, 250, 0.15); border-radius: 4px; color: #fcfbfa; padding: 0 6px; font-size: 0.55rem; cursor: pointer; transition: background 0.2s; font-family: 'Inter', sans-serif; line-height: 1.8; white-space: nowrap; }
        .event-edit .btn-sm:hover { background: rgba(252, 251, 250, 0.16); }
        .event-edit .btn-sm.danger:hover { background: rgba(148, 37, 37, 0.3); border-color: #942525; }
        .event-edit .btn-sm.insert:hover { background: rgba(189, 139, 42, 0.2); border-color: #bd8b2a; }
        .add-event-btn { margin: 4px 0; padding: 2px 10px; border-radius: 20px; border: 1px dashed rgba(252, 251, 250, 0.2); background: transparent; color: rgba(252, 251, 250, 0.4); font-size: 0.65rem; cursor: pointer; transition: background 0.2s, color 0.2s; font-family: 'Inter', sans-serif; display: inline-block; }
        .add-event-btn:hover { background: rgba(189, 139, 42, 0.1); color: #fcfbfa; border-color: rgba(189, 139, 42, 0.3); }
        .row-edit-actions { display: flex; gap: 8px; margin: 4px 0 8px 0; flex-wrap: wrap; }
        .row-edit-actions .btn-primary { background: rgba(189, 139, 42, 0.2); border: 1px solid #bd8b2a; color: #fcfbfa; padding: 2px 14px; border-radius: 16px; font-size: 0.7rem; cursor: pointer; transition: background 0.2s; font-family: 'Inter', sans-serif; }
        .row-edit-actions .btn-primary:hover { background: rgba(189, 139, 42, 0.4); }
        .row-edit-actions .btn-secondary { background: rgba(252, 251, 250, 0.05); border: 1px solid rgba(252, 251, 250, 0.15); color: rgba(252, 251, 250, 0.6); padding: 2px 14px; border-radius: 16px; font-size: 0.7rem; cursor: pointer; transition: background 0.2s; font-family: 'Inter', sans-serif; }
        .row-edit-actions .btn-secondary:hover { background: rgba(252, 251, 250, 0.1); }

        /* 工具列圖示按鈕（排序 / 匯出 / 匯入） */
        .controls-group .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid rgba(252, 251, 250, 0.15); background: rgba(252, 251, 250, 0.04); color: rgba(252, 251, 250, 0.4); font-size: 1.3rem; cursor: pointer; transition: background 0.2s, border-color 0.2s; display: flex; align-items: center; justify-content: center; line-height: 1; user-select: none; -webkit-tap-highlight-color: transparent; padding: 0; }
        .controls-group .icon-btn:hover { background: rgba(252, 251, 250, 0.08); }
        .controls-group .icon-btn:active { background: rgba(189, 139, 42, 0.15); border-color: rgba(189, 139, 42, 0.3); }
        .controls-group .icon-btn.active { background: #bd8b2a; color: #121315; border-color: #bd8b2a; }

        /* 拖曳排序模式 */
        .dynasty-drag-handle, .row-drag-handle { display: none; align-items: center; justify-content: center; cursor: grab; color: rgba(252, 251, 250, 0.35); font-size: 1.2rem; touch-action: none; flex-shrink: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        .dynasty-drag-handle:active, .row-drag-handle:active { cursor: grabbing; color: #bd8b2a; }
        .app.reorder-mode .dynasty-drag-handle { display: flex; width: 30px; }
        .app.reorder-mode .emperor-row { position: relative; padding-left: 38px; }
        .app.reorder-mode .row-drag-handle { display: flex; position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; }
        .app.reorder-mode .dynasty-header { cursor: default; }
        .app.reorder-mode .search-wrap { opacity: 0.4; pointer-events: none; }
        .dynasty.dragging, .emperor-row.dragging { opacity: 0.5; box-shadow: 0 8px 24px rgba(0,0,0,0.4); background: rgba(189, 139, 42, 0.1) !important; z-index: 50; }
        .reorder-hint { display: none; font-size: 0.7rem; color: #bd8b2a; text-align: center; padding: 4px 0 10px; letter-spacing: 0.5px; }
        .app.reorder-mode .reorder-hint { display: block; }

        /* 朝代標題編輯 */
        .dynasty-edit-fields { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .dynasty-edit-fields input[type="text"] { background: rgba(252, 251, 250, 0.08); border: 1px solid rgba(252, 251, 250, 0.2); border-radius: 6px; color: #fcfbfa; padding: 4px 8px; font-size: 1.4rem; font-family: 'Noto Serif TC', serif; outline: none; width: 120px; }
        .dynasty-edit-fields input[type="number"] { background: rgba(252, 251, 250, 0.08); border: 1px solid rgba(252, 251, 250, 0.2); border-radius: 6px; color: #fcfbfa; padding: 4px 6px; font-size: 1rem; font-family: 'Inter', sans-serif; outline: none; width: 72px; }
        .dynasty-header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

        /* 新增/刪除按鈕 */
        .add-dynasty-btn { display: block; width: 100%; margin: 14px 0 30px; padding: 12px; border-radius: 12px; border: 1px dashed rgba(252, 251, 250, 0.2); background: transparent; color: rgba(252, 251, 250, 0.4); font-size: 0.9rem; cursor: pointer; transition: background 0.2s, color 0.2s; font-family: 'Inter', sans-serif; }
        .add-dynasty-btn:hover { background: rgba(189, 139, 42, 0.1); color: #fcfbfa; border-color: rgba(189, 139, 42, 0.3); }
        .add-emperor-btn { margin: 6px 0 2px; padding: 4px 12px; border-radius: 20px; border: 1px dashed rgba(252, 251, 250, 0.2); background: transparent; color: rgba(252, 251, 250, 0.4); font-size: 0.7rem; cursor: pointer; transition: background 0.2s, color 0.2s; font-family: 'Inter', sans-serif; display: inline-block; }
        .add-emperor-btn:hover { background: rgba(189, 139, 42, 0.1); color: #fcfbfa; border-color: rgba(189, 139, 42, 0.3); }
        .delete-row-btn { background: none; border: 1px solid rgba(148, 37, 37, 0.4); color: #d97070; border-radius: 12px; padding: 0 8px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.6rem; line-height: 1.6; }
        .delete-row-btn:hover { background: rgba(148, 37, 37, 0.25); }
        .delete-dynasty-btn { background: none; border: 1px solid rgba(148, 37, 37, 0.4); color: #d97070; border-radius: 12px; padding: 2px 10px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.65rem; }
        .delete-dynasty-btn:hover { background: rgba(148, 37, 37, 0.25); }

        /* 自動還原提示橫幅 */
        .autosave-banner { display: flex; flex-direction: column; gap: 8px; background: rgba(189, 139, 42, 0.12); border: 1px solid rgba(189, 139, 42, 0.35); border-radius: 12px; padding: 10px 14px; margin: -6px 0 16px; font-size: 0.8rem; color: rgba(252, 251, 250, 0.85); }
        .autosave-banner .autosave-ts { opacity: 0.6; font-size: 0.7rem; }
        .autosave-banner-actions { display: flex; gap: 8px; }
        .autosave-banner-actions button { flex: 1; padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(252, 251, 250, 0.2); background: rgba(252, 251, 250, 0.06); color: #fcfbfa; font-size: 0.75rem; cursor: pointer; font-family: 'Inter', sans-serif; }
        .autosave-banner-actions button:last-child { border-color: rgba(148, 37, 37, 0.4); color: #d97070; }
        .autosave-banner-actions button:hover { background: rgba(252, 251, 250, 0.12); }

<body>

    <div class="app" id="app">
        <header class="app-header">
            <h1>華夏·萬國<br /><small>CHINA &amp; THE WORLD · 歷史年表</small></h1>
        </header>

        <div class="sticky-toolbar">
            <div class="toolbar">
                <div class="search-wrap">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="搜尋朝代、皇帝、年號、事件…" autocomplete="off" />
                    <button class="clear-btn" id="clearBtn" aria-label="清除搜尋">✕</button>
                </div>
                <div class="controls-group">
                    <button class="toggle-all-btn" id="toggleAllBtn" aria-label="全部展開或收回">▾</button>
                    <span class="divider"></span>
                    <div class="font-controls">
                        <button id="fontDecBtn" aria-label="縮小字級">A−</button>
                        <span class="font-size-label" id="fontSizeLabel">160%</span>
                        <button id="fontIncBtn" aria-label="放大字級">A+</button>
                    </div>
                    <span class="divider"></span>
                    <button class="icon-btn" id="reorderBtn" aria-label="拖曳排序模式" title="拖曳排序">⇅</button>
                    <button class="icon-btn" id="exportBtn" aria-label="匯出JSON" title="匯出 JSON">
                        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h4l1.5 2h5L16 14h4"/><path d="M4 14v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/><path d="M12 11V3"/><path d="M8.5 6.5 12 3l3.5 3.5"/></svg>
                    </button>
                    <button class="icon-btn" id="importBtn" aria-label="匯入JSON" title="匯入 JSON">
                        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h4l1.5 2h5L16 14h4"/><path d="M4 14v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/><path d="M12 3v8"/><path d="M8.5 8.5 12 12l3.5-3.5"/></svg>
                    </button>
                    <input type="file" id="importFileInput" accept="application/json,.json" style="display:none" />
                </div>
            </div>
            <div class="reorder-hint">↕️ 拖曳左側 ⠿ 把手，調整順序後放開即自動儲存</div>
        </div>

        <div class="stats">
            <span class="count" id="statsCount">載入中…</span>
            <span class="hint" id="modeHint">點擊事件自動複製並 Google 搜尋</span>
        </div>

        <div class="autosave-banner" id="autosaveBanner" style="display:none;">
            <span>💾 已自動還原您上次未存檔的編輯 <span class="autosave-ts"></span></span>
            <div class="autosave-banner-actions">
                <button onclick="hideAutosaveBanner()">知道了</button>
                <button onclick="discardAutoSave()">捨棄，改用原始資料</button>
            </div>
        </div>

        <div id="timelineContainer">
            <div class="loading">
                <div class="spinner"></div>
                <div>載入歷史資料中…</div>
            </div>
        </div>

        <button class="add-dynasty-btn" id="addDynastyBtn">➕ 新增時代分期</button>
    </div>

    <div class="toast" id="toast"><span class="icon">📋</span><span id="toastMsg">已複製，開啟搜尋…</span></div>

    <script>
        // ============================================================
        //  全域狀態
        // ============================================================
        let DATA = [];
        let editStates = {}; // key: 'dynastyIdx-emperorIdx' => true/false
        let backupData = null; // 用於取消編輯時還原
        let dynastyEditStates = {}; // key: dynastyIdx => true/false（朝代標題編輯）
        let reorderMode = false; // 拖曳排序模式

        // ============================================================
        //  自動儲存（localStorage）— 防止手機返回手勢跳出時遺失編輯
        // ============================================================
        const AUTOSAVE_KEY = 'historyTimelineAutosave_v1';
        const AUTOSAVE_TS_KEY = 'historyTimelineAutosave_v1_ts';
        let autoSaveTimer = null;
        let suppressAutoSave = false; // 剛從自動儲存還原時，避免立刻又覆蓋一次

        function persistNow() {
            if (suppressAutoSave || !DATA || DATA.length === 0) return;
            try {
                localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(DATA));
                localStorage.setItem(AUTOSAVE_TS_KEY, Date.now().toString());
            } catch (e) {
                console.warn('自動儲存失敗（可能是儲存空間已滿）', e);
            }
        }

        function scheduleAutoSave() {
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(persistNow, 300);
        }

        function clearAutoSave() {
            try {
                localStorage.removeItem(AUTOSAVE_KEY);
                localStorage.removeItem(AUTOSAVE_TS_KEY);
            } catch (e) {}
        }

        function hasAutoSave() {
            try {
                return !!localStorage.getItem(AUTOSAVE_KEY);
            } catch (e) {
                return false;
            }
        }

        function showAutosaveBanner() {
            const banner = document.getElementById('autosaveBanner');
            if (!banner) return;
            let ts = '';
            try {
                const raw = localStorage.getItem(AUTOSAVE_TS_KEY);
                if (raw) ts = new Date(parseInt(raw)).toLocaleString('zh-TW', { hour12: false });
            } catch (e) {}
            banner.querySelector('.autosave-ts').textContent = ts ? `（${ts}）` : '';
            banner.style.display = 'flex';
        }

        function hideAutosaveBanner() {
            const banner = document.getElementById('autosaveBanner');
            if (banner) banner.style.display = 'none';
        }

        function restoreAutoSave() {
            try {
                const raw = localStorage.getItem(AUTOSAVE_KEY);
                if (!raw) return false;
                suppressAutoSave = true;
                DATA = JSON.parse(raw);
                editStates = {};
                dynastyEditStates = {};
                backupData = null;
                render('');
                const total = DATA.reduce((sum, d) => sum + d.emperors.length, 0);
                statsCount.textContent = `共 ${total} 位皇帝 · ${DATA.length} 個朝代（已還原未存檔的編輯）`;
                hideAutosaveBanner();
                suppressAutoSave = false;
                showToast('↩️ 已還原上次未存檔的編輯');
                return true;
            } catch (e) {
                console.warn('還原自動儲存失敗', e);
                return false;
            }
        }

        function discardAutoSave() {
            clearAutoSave();
            hideAutosaveBanner();
            loadData(true);
        }

        // ============================================================
        //  工具函數
        // ============================================================
        function isCrossYear(text) {
            if (!text) return false;
            return /\(\d{3,4}~\d{3,4}\)/.test(text) || /\(\d{3,4}\)/.test(text);
        }

        function escapeAttr(text) {
            if (!text) return '';
            return text.replace(/"/g, '&quot;').replace(/&/g, '&amp;');
        }

        function getKey(dIdx, eIdx) { return `${dIdx}-${eIdx}`; }

        function isEditing(dIdx, eIdx) { return editStates[getKey(dIdx, eIdx)] === true; }

        function isDynastyEditing(dIdx) { return dynastyEditStates[dIdx] === true; }

        // ============================================================
        //  Toast 訊息
        // ============================================================
        let toastTimer = null;

        function showToast(msg, duration) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMsg');
            msgEl.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, duration || 2000);
        }

        // ============================================================
        //  點擊事件 → 複製 + Google 搜尋（僅在非編輯模式）
        // ============================================================
        function searchEvent(el) {
            const row = el.closest('.emperor-row');
            if (row && row.classList.contains('editing')) return;
            const text = el.getAttribute('data-event-text');
            if (!text || text.trim() === '' || text === '—') return;
            el.classList.remove('flash');
            void el.offsetWidth;
            el.classList.add('flash');
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(() => {});
            }
            showToast('📋 已複製，開啟搜尋…');
            const url = 'https://www.google.com/search?q=' + encodeURIComponent(text);
            window.open(url, '_blank');
        }

        // ============================================================
        //  字級控制
        // ============================================================
        const MIN_FONT_SIZE = 12,
            MAX_FONT_SIZE = 38,
            STEP = 1,
            DEFAULT_FONT_SIZE = 28.8;

        function getCurrentFontSize() {
            const html = document.documentElement;
            const computed = window.getComputedStyle(html);
            const size = parseFloat(computed.fontSize);
            return isNaN(size) ? DEFAULT_FONT_SIZE : size;
        }

        function setFontSize(size) {
            const clamped = Math.min(Math.max(size, MIN_FONT_SIZE), MAX_FONT_SIZE);
            document.documentElement.style.fontSize = clamped + 'px';
            updateFontLabel(clamped);
        }

        function updateFontLabel(size) {
            const label = document.getElementById('fontSizeLabel');
            if (label) {
                const percent = Math.round((size / 18) * 100);
                label.textContent = percent + '%';
            }
        }

        function changeFontSize(delta) {
            const current = getCurrentFontSize();
            setFontSize(current + delta);
        }

        // ============================================================
        //  全部展開 / 全部收回
        // ============================================================
        let allExpanded = false;

        function toggleAll() {
            allExpanded = !allExpanded;
            const bodies = document.querySelectorAll('.dynasty-body');
            const toggles = document.querySelectorAll('.dynasty-toggle');
            const btn = document.getElementById('toggleAllBtn');
            if (allExpanded) {
                bodies.forEach(b => b.classList.add('open'));
                toggles.forEach(t => t.classList.add('open'));
                btn.classList.add('all-open');
            } else {
                bodies.forEach(b => b.classList.remove('open'));
                toggles.forEach(t => t.classList.remove('open'));
                btn.classList.remove('all-open');
            }
        }

        // ============================================================
        //  編輯模式：開啟 / 關閉 / 儲存 / 取消
        // ============================================================
        function toggleRowEdit(dIdx, eIdx) {
            const key = getKey(dIdx, eIdx);
            if (editStates[key]) {
                // 如果已在編輯，關閉（等同於取消編輯）
                cancelRowEdit(dIdx, eIdx);
            } else {
                // 備份目前 DATA（用於取消時還原）
                backupData = JSON.parse(JSON.stringify(DATA));
                editStates[key] = true;
                render(searchInput.value);
                // 滾動到該行
                setTimeout(() => {
                    const rows = document.querySelectorAll('.emperor-row');
                    const targetRow = rows.find(r => {
                        const d = parseInt(r.dataset.dynastyIdx);
                        const e = parseInt(r.dataset.emperorIdx);
                        return d === dIdx && e === eIdx;
                    });
                    if (targetRow) targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 50);
            }
        }

        function cancelRowEdit(dIdx, eIdx) {
            const key = getKey(dIdx, eIdx);
            if (backupData) {
                DATA = backupData;
                backupData = null;
            }
            editStates[key] = false;
            render(searchInput.value);
            showToast('↩️ 已取消編輯');
        }

        function saveRowEdit(dIdx, eIdx) {
            const key = getKey(dIdx, eIdx);
            // 資料已透過 updateEventValue / deleteEvent / insertEvent 即時更新
            backupData = null; // 清除備份，接受變更
            editStates[key] = false;
            render(searchInput.value);
            downloadJSON();
            showToast('✅ 已儲存並下載 JSON');
        }

        // ============================================================
        //  下載 JSON
        // ============================================================
        function downloadJSON() {
            const jsonStr = JSON.stringify(DATA, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'timeline_data.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ============================================================
        //  朝代標題編輯（名稱 / 起訖年）
        // ============================================================
        function toggleDynastyEdit(dIdx) {
            if (isDynastyEditing(dIdx)) {
                cancelDynastyEdit(dIdx);
            } else {
                backupData = JSON.parse(JSON.stringify(DATA));
                dynastyEditStates[dIdx] = true;
                render(searchInput.value);
            }
        }

        function cancelDynastyEdit(dIdx) {
            if (backupData) {
                DATA = backupData;
                backupData = null;
            }
            dynastyEditStates[dIdx] = false;
            render(searchInput.value);
            showToast('↩️ 已取消編輯');
        }

        function saveDynastyEdit(dIdx) {
            backupData = null;
            dynastyEditStates[dIdx] = false;
            render(searchInput.value);
            downloadJSON();
            showToast('✅ 已儲存並下載 JSON');
        }

        function updateDynastyField(dIdx, field, value) {
            if (!DATA[dIdx]) return;
            if (field === 'start' || field === 'end') {
                const num = parseInt(value);
                DATA[dIdx][field] = isNaN(num) ? value : num;
            } else {
                DATA[dIdx][field] = value;
            }
        }

        function deleteDynasty(dIdx) {
            const dynasty = DATA[dIdx];
            if (!dynasty) return;
            if (!confirm(`確定要刪除整個時代「${dynasty.name}」嗎？此動作無法復原。`)) return;
            DATA.splice(dIdx, 1);
            render(searchInput.value);
            downloadJSON();
            showToast('🗑 已刪除時代並下載 JSON');
        }

        function addNewDynasty() {
            const newDynasty = {
                id: 'new-period-' + Date.now(),
                name: '新時代分期',
                start: 2027,
                end: 2027,
                emperors: [{
                    name: '新條目',
                    era: '請編輯',
                    yearStart: 2027,
                    yearEnd: 2027,
                    chinaEvents: [],
                    worldEvents: []
                }]
            };
            DATA.push(newDynasty);
            const newIdx = DATA.length - 1;
            dynastyEditStates[newIdx] = true;
            backupData = null;
            render(searchInput.value);
            setTimeout(() => {
                const header = document.querySelectorAll('.dynasty')[newIdx];
                if (header) header.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 50);
            showToast('➕ 已新增時代，請編輯內容');
        }

        function addNewEmperorRow(dIdx) {
            if (!DATA[dIdx]) return;
            DATA[dIdx].emperors.push({
                name: '新條目',
                era: '請編輯',
                yearStart: DATA[dIdx].start,
                yearEnd: DATA[dIdx].end,
                chinaEvents: [],
                worldEvents: []
            });
            const newEmpIdx = DATA[dIdx].emperors.length - 1;
            editStates[getKey(dIdx, newEmpIdx)] = true;
            render(searchInput.value);
            showToast('➕ 已新增一列，請編輯內容');
        }

        function deleteEmperorRow(dIdx, eIdx) {
            if (!DATA[dIdx] || !DATA[dIdx].emperors[eIdx]) return;
            if (!confirm('確定要刪除這一列嗎？')) return;
            DATA[dIdx].emperors.splice(eIdx, 1);
            render(searchInput.value);
            downloadJSON();
            showToast('🗑 已刪除並下載 JSON');
        }

        // ============================================================
        //  匯出 / 匯入（File System Access API：情境A開檔覆寫、情境B另存新檔）
        // ============================================================
        let openedFileHandle = null;  // 情境A：透過「開啟檔案」匯入時取得的 handle，匯出時可直接無聲覆寫
        let exportFileHandle = null;  // 情境B：透過「另存新檔」選過的位置，之後匯出可直接覆寫同一份
        let hasExportedOnce = false;  // 純下載備援路徑用：是否已經下載過一次

        async function exportData() {
            const jsonStr = JSON.stringify(DATA, null, 2);

            // 情境 A：資料是從「開啟檔案」匯入的，直接無聲覆寫回原檔（像 Ctrl+S）
            if (openedFileHandle) {
                try {
                    const writable = await openedFileHandle.createWritable();
                    await writable.write(jsonStr);
                    await writable.close();
                    showToast(`✅ 已直接覆寫原始檔案「${openedFileHandle.name}」`);
                    return;
                } catch (err) {
                    console.warn('直接覆寫原檔失敗，改走另存新檔', err);
                    openedFileHandle = null;
                }
            }

            // 情境 B：讓使用者選擇儲存位置；已經選過的話直接覆寫同一份（覆蓋前先確認）
            if (window.showSaveFilePicker) {
                try {
                    if (exportFileHandle) {
                        const proceed = confirm('您先前已經匯出過一次，要再匯出一次並覆蓋原本的檔案嗎？');
                        if (!proceed) return;
                    } else {
                        exportFileHandle = await window.showSaveFilePicker({
                            suggestedName: 'timeline_data.json',
                            types: [{ description: 'JSON 檔案', accept: { 'application/json': ['.json'] } }]
                        });
                    }
                    const writable = await exportFileHandle.createWritable();
                    await writable.write(jsonStr);
                    await writable.close();
                    showToast(`⬇ 已匯出至「${exportFileHandle.name}」`);
                    return;
                } catch (err) {
                    if (err && err.name === 'AbortError') return; // 使用者取消了選擇視窗
                    console.warn('無法使用選擇資料夾儲存，改用一般下載', err);
                    exportFileHandle = null;
                }
            }

            // 情境 C（通用備援）：一般瀏覽器下載，無法得知或指定確切資料夾
            if (hasExportedOnce) {
                const proceed = confirm('您先前已經匯出過一次，要再匯出一次並覆蓋原本的檔案嗎？');
                if (!proceed) return;
            }
            downloadJSON();
            hasExportedOnce = true;
            showToast('⬇ 已下載 timeline_data.json（存放於瀏覽器預設的「下載」資料夾，實際位置依裝置與瀏覽器設定而異）', 4500);
        }

        async function triggerImport() {
            if (window.showOpenFilePicker) {
                try {
                    const [handle] = await window.showOpenFilePicker({
                        types: [{ description: 'JSON 檔案', accept: { 'application/json': ['.json'] } }],
                        excludeAcceptAllOption: false,
                        multiple: false
                    });
                    const file = await handle.getFile();
                    const text = await file.text();
                    applyImportedText(text, file.name, handle);
                } catch (err) {
                    if (err && err.name === 'AbortError') return; // 使用者取消選擇，不做任何事
                    console.warn('開啟檔案失敗，改用一般檔案選擇', err);
                    document.getElementById('importFileInput').click();
                }
                return;
            }
            document.getElementById('importFileInput').click();
        }

        function applyImportedText(text, filename, handle) {
            let parsed;
            try {
                parsed = JSON.parse(text);
            } catch (err) {
                showToast('⚠️ JSON 格式錯誤，匯入失敗');
                return;
            }
            if (!Array.isArray(parsed)) {
                showToast('⚠️ 格式不符（需為陣列），匯入失敗');
                return;
            }
            if (!confirm(`確定要匯入「${filename}」嗎？這將取代目前畫面上的所有資料（共 ${parsed.length} 個時期）。`)) {
                return;
            }
            DATA = parsed;
            editStates = {};
            dynastyEditStates = {};
            backupData = null;
            openedFileHandle = handle || null; // 有 handle 的話，之後按「匯出」會直接覆寫回這個檔案
            exportFileHandle = null; // 重置另一條匯出路徑的記憶，避免兩邊搞混
            hasExportedOnce = false;
            render('');
            if (handle) {
                showToast(`✅ 已匯入「${filename}」（之後按匯出會直接覆寫回這個檔案）`);
            } else {
                showToast('✅ 已匯入 JSON 資料');
            }
        }

        function handleImportFile(fileInput) {
            const file = fileInput.files && fileInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                applyImportedText(e.target.result, file.name, null);
                fileInput.value = '';
            };
            reader.onerror = () => {
                showToast('⚠️ 讀取檔案失敗');
                fileInput.value = '';
            };
            reader.readAsText(file, 'utf-8');
        }

        // ============================================================
        //  拖曳排序（時代 / 皇帝列）— Pointer Events，支援觸控與滑鼠
        // ============================================================
        function toggleReorderMode() {
            reorderMode = !reorderMode;
            const app = document.getElementById('app');
            const btn = document.getElementById('reorderBtn');
            if (reorderMode) {
                // 排序時清除搜尋，避免索引錯亂
                searchInput.value = '';
                clearBtn.classList.remove('visible');
                render('');
                app.classList.add('reorder-mode');
                btn.classList.add('active');
                if (!allExpanded) toggleAll();
            } else {
                app.classList.remove('reorder-mode');
                btn.classList.remove('active');
            }
        }

        function initDragAndDrop() {
            container.addEventListener('pointerdown', onDragPointerDown);
        }

        let dragCtx = null;

        function onDragPointerDown(e) {
            if (!reorderMode) return;
            const dynHandle = e.target.closest('.dynasty-drag-handle');
            const rowHandle = e.target.closest('.row-drag-handle');
            if (!dynHandle && !rowHandle) return;
            e.preventDefault();

            let item, listEl, mode, dynIdx = null;
            if (dynHandle) {
                item = dynHandle.closest('.dynasty');
                listEl = container;
                mode = 'dynasty';
            } else {
                item = rowHandle.closest('.emperor-row');
                listEl = item.closest('.emperor-grid');
                mode = 'row';
                dynIdx = parseInt(item.dataset.dynastyIdx);
            }
            if (!item || !listEl) return;

            dragCtx = { item, listEl, mode, dynIdx, startY: e.clientY, pointerId: e.pointerId };
            item.classList.add('dragging');
            try { item.setPointerCapture(e.pointerId); } catch (err) {}

            const move = (ev) => onDragPointerMove(ev);
            const up = (ev) => {
                onDragPointerUp(ev);
                listEl.removeEventListener('pointermove', move);
                window.removeEventListener('pointerup', up);
            };
            listEl.addEventListener('pointermove', move);
            window.addEventListener('pointerup', up);
        }

        function onDragPointerMove(e) {
            if (!dragCtx) return;
            const { item, listEl, mode } = dragCtx;
            const itemSelector = mode === 'dynasty' ? ':scope > .dynasty' : '.emperor-row';
            const siblings = Array.from(listEl.querySelectorAll(itemSelector)).filter(el => el !== item);
            const itemRect = item.getBoundingClientRect();
            const itemCenter = e.clientY;

            for (const sib of siblings) {
                const sibRect = sib.getBoundingClientRect();
                const sibCenter = sibRect.top + sibRect.height / 2;
                const pos = item.compareDocumentPosition(sib);
                const itemIsBeforeSib = !!(pos & Node.DOCUMENT_POSITION_FOLLOWING);
                if (itemIsBeforeSib && itemCenter > sibCenter) {
                    listEl.insertBefore(item, sib.nextSibling);
                    break;
                } else if (!itemIsBeforeSib && itemCenter < sibCenter) {
                    listEl.insertBefore(item, sib);
                    break;
                }
            }
        }

        function onDragPointerUp(e) {
            if (!dragCtx) return;
            const { item, mode, dynIdx } = dragCtx;
            item.classList.remove('dragging');
            try { item.releasePointerCapture(e.pointerId); } catch (err) {}

            if (mode === 'dynasty') {
                const ids = Array.from(container.querySelectorAll(':scope > .dynasty')).map(el => el.dataset.dynastyId);
                const newData = ids.map(id => DATA.find(d => d.id === id)).filter(Boolean);
                if (newData.length === DATA.length) {
                    DATA = newData;
                    downloadJSON();
                    showToast('↕️ 已調整時代順序並下載 JSON');
                }
            } else {
                const rows = Array.from(document.querySelectorAll(`.emperor-row[data-dynasty-idx="${dynIdx}"]`));
                const order = rows.map(r => parseInt(r.dataset.emperorIdx)).filter(n => !isNaN(n));
                const emp = DATA[dynIdx].emperors;
                if (order.length === emp.length) {
                    DATA[dynIdx].emperors = order.map(i => emp[i]);
                    downloadJSON();
                    showToast('↕️ 已調整順序並下載 JSON');
                }
            }
            dragCtx = null;
            render('');
        }

        // ============================================================
        //  事件增刪改（編輯模式專用）
        // ============================================================
        function getIndices(el) {
            const row = el.closest('.emperor-row');
            if (!row) return null;
            const dynIdx = parseInt(row.dataset.dynastyIdx);
            const empIdx = parseInt(row.dataset.emperorIdx);
            if (isNaN(dynIdx) || isNaN(empIdx)) return null;
            return { dynIdx, empIdx };
        }

        function deleteEvent(el, type) {
            if (!confirm('確定刪除這個事件嗎？')) return;
            const idx = getIndices(el);
            if (!idx) return;
            const { dynIdx, empIdx } = idx;
            const emp = DATA[dynIdx].emperors[empIdx];
            const events = (type === 'china') ? emp.chinaEvents : emp.worldEvents;
            const eventIdx = parseInt(el.dataset.eventIdx);
            if (isNaN(eventIdx)) return;
            events.splice(eventIdx, 1);
            render(searchInput.value);
            // 保持編輯狀態
        }

        function insertEvent(el, type, position) {
            const idx = getIndices(el);
            if (!idx) return;
            const { dynIdx, empIdx } = idx;
            const emp = DATA[dynIdx].emperors[empIdx];
            const events = (type === 'china') ? emp.chinaEvents : emp.worldEvents;
            const eventIdx = parseInt(el.dataset.eventIdx);
            if (isNaN(eventIdx)) return;
            const insertIdx = (position === 'before') ? eventIdx : eventIdx + 1;
            events.splice(insertIdx, 0, '新事件（請編輯）');
            render(searchInput.value);
            setTimeout(() => {
                const inputs = document.querySelectorAll(`.event-edit[data-dynasty="${dynIdx}"][data-emperor="${empIdx}"][data-type="${type}"] input[type="text"]`);
                if (inputs[insertIdx]) inputs[insertIdx].focus();
            }, 50);
        }

        function updateEventValue(input, type) {
            const row = input.closest('.emperor-row');
            if (!row) return;
            const dynIdx = parseInt(row.dataset.dynastyIdx);
            const empIdx = parseInt(row.dataset.emperorIdx);
            const eventIdx = parseInt(input.dataset.eventIdx);
            if (isNaN(dynIdx) || isNaN(empIdx) || isNaN(eventIdx)) return;
            const emp = DATA[dynIdx].emperors[empIdx];
            const events = (type === 'china') ? emp.chinaEvents : emp.worldEvents;
            if (eventIdx < events.length) {
                events[eventIdx] = input.value;
            }
        }

        function updateEmperorField(dIdx, eIdx, field, value) {
            const emp = DATA[dIdx] && DATA[dIdx].emperors[eIdx];
            if (!emp) return;
            if (field === 'yearStart' || field === 'yearEnd') {
                const num = parseInt(value);
                emp[field] = isNaN(num) ? value : num;
            } else {
                emp[field] = value;
            }
        }

        function addNewEvent(el, type) {
            const idx = getIndices(el);
            if (!idx) return;
            const { dynIdx, empIdx } = idx;
            const emp = DATA[dynIdx].emperors[empIdx];
            const events = (type === 'china') ? emp.chinaEvents : emp.worldEvents;
            events.push('新事件（請編輯）');
            render(searchInput.value);
            setTimeout(() => {
                const inputs = document.querySelectorAll(`.event-edit[data-dynasty="${dynIdx}"][data-emperor="${empIdx}"][data-type="${type}"] input[type="text"]`);
                if (inputs.length > 0) inputs[inputs.length - 1].focus();
            }, 50);
        }

        // ============================================================
        //  渲染引擎（支援行內編輯）
        // ============================================================
        const container = document.getElementById('timelineContainer');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const statsCount = document.getElementById('statsCount');

        function render(term) {
            const search = (term || '').trim().toLowerCase();
            let totalMatch = 0,
                totalEmperor = 0;

            if (!DATA || DATA.length === 0) {
                container.innerHTML =
                    '<div class="loading"><div class="spinner"></div><div>載入歷史資料中…</div></div>';
                return;
            }

            const filteredDynasties = DATA.map((dynasty, dIdx) => {
                const dynastyNameMatch = dynasty.name.includes(search);
                const matchedEmperors = dynasty.emperors.map((emp, eIdx) => {
                    const texts = [
                        dynasty.name, emp.name, emp.era,
                        String(emp.yearStart), String(emp.yearEnd)
                    ];
                    if (emp.chinaEvents) emp.chinaEvents.forEach(e => texts.push(e));
                    if (emp.worldEvents) emp.worldEvents.forEach(e => texts.push(e));
                    const fullText = texts.join(' ').toLowerCase();
                    const match = !search || fullText.includes(search) || dynastyNameMatch;
                    return { ...emp, match, _dynastyIdx: dIdx, _emperorIdx: eIdx };
                });
                const hasMatch = matchedEmperors.some(e => e.match) || dynastyNameMatch;
                return { ...dynasty, emperors: matchedEmperors, hasMatch, dynastyNameMatch };
            });

            let totalRows = 0,
                matchRows = 0;
            filteredDynasties.forEach(d => d.emperors.forEach(e => { totalRows++;
                    if (e.match) matchRows++; }));
            totalEmperor = totalRows;
            totalMatch = matchRows;

            if (search) statsCount.textContent = `找到 ${totalMatch} 筆 / 共 ${totalEmperor} 位皇帝`;
            else statsCount.textContent = `共 ${totalEmperor} 位皇帝 · ${DATA.length} 個朝代`;

            let html = '';
            if (totalRows === 0 && search) {
                html =
                    `<div class="empty-state"><div class="icon">📜</div><p>沒有找到與「<strong style="color:rgba(252,251,250,0.5);">${term}</strong>」相關的內容</p><p style="font-size:0.8rem;margin-top:6px;opacity:0.5;">試試其他關鍵字</p></div>`;
                container.innerHTML = html;
                return;
            }

            filteredDynasties.forEach((dynasty, di) => {
                const shouldOpen = !search || dynasty.hasMatch;
                const dynastyOpenClass = shouldOpen ? 'open' : '';
                const toggleOpenClass = shouldOpen ? 'open' : '';
                const highlightClass = dynasty.hasMatch && search ? 'highlight' : '';

                const isDynEditing = isDynastyEditing(di);
                const dynEditBtnText = isDynEditing ? '儲存' : '改';
                const dynEditBtnAction = isDynEditing ? `saveDynastyEdit(${di})` : `toggleDynastyEdit(${di})`;

                let dynNameHtml;
                if (isDynEditing) {
                    dynNameHtml = `<span class="dynasty-edit-fields">
                            <input type="text" value="${escapeAttr(dynasty.name)}" oninput="updateDynastyField(${di}, 'name', this.value)" />
                            <input type="number" value="${dynasty.start}" oninput="updateDynastyField(${di}, 'start', this.value)" />〜<input type="number" value="${dynasty.end}" oninput="updateDynastyField(${di}, 'end', this.value)" />
                        </span>`;
                } else {
                    dynNameHtml = `${dynasty.name}
                            <span class="years">${dynasty.start} ~ ${dynasty.end}</span>
                            <span class="badge">${dynasty.emperors.length} 帝</span>`;
                }

                const dynActionsHtml = `<div class="dynasty-header-actions" onclick="event.stopPropagation()">
                        <button class="edit-row-btn ${isDynEditing ? 'active' : ''}" onclick="${dynEditBtnAction}">${dynEditBtnText}</button>
                        ${isDynEditing ? `<button class="edit-row-btn" onclick="cancelDynastyEdit(${di})" style="border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.5);">取消</button><button class="delete-dynasty-btn" onclick="deleteDynasty(${di})">刪除時代</button>` : ''}
                    </div>`;

                html += `<div class="dynasty ${highlightClass}" data-dynasty-id="${dynasty.id}">
                    <div class="dynasty-header" data-toggle>
                        <span style="display:flex;align-items:center;gap:8px;flex:1;min-width:0;">
                            <span class="dynasty-drag-handle" title="拖曳調整順序" onclick="event.stopPropagation()">⠿</span>
                            <span class="dynasty-name">${dynNameHtml}</span>
                        </span>
                        <span style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
                            ${dynActionsHtml}
                            <span class="dynasty-toggle ${toggleOpenClass}" aria-hidden="true">▾</span>
                        </span>
                    </div>
                    <div class="dynasty-body ${dynastyOpenClass}">
                        <div class="emperor-grid">`;

                dynasty.emperors.forEach((emp, ei) => {
                    const realDynIdx = emp._dynastyIdx !== undefined ? emp._dynastyIdx : di;
                    const realEmpIdx = emp._emperorIdx !== undefined ? emp._emperorIdx : ei;
                    const isEditingRow = isEditing(realDynIdx, realEmpIdx);

                    // 檢查是否有事件包含年份區間（跨年）
                    let hasCross = false;
                    const allEvents = (emp.chinaEvents || []).concat(emp.worldEvents || []);
                    allEvents.forEach(e => { if (isCrossYear(e)) hasCross = true; });
                    const crossClass = hasCross ? 'cross-year' : '';
                    const matchClass = emp.match ? 'match' : '';
                    const editingClass = isEditingRow ? 'editing' : '';

                    const highlightText = (text) => {
                        if (!text || !search) return text || '';
                        const escaped = search.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        const regex = new RegExp(`(${escaped})`, 'gi');
                        return text.replace(regex, '<span class="search-match">$1</span>');
                    };

                    // === 中國事件 ===
                    let chinaHtml = '';
                    const chinaEvents = emp.chinaEvents || [];
                    if (chinaEvents.length === 0) {
                        if (isEditingRow) {
                            chinaHtml =
                                `<div class="add-event-btn" onclick="addNewEvent(this, 'china')" data-dynasty="${realDynIdx}" data-emperor="${realEmpIdx}">＋ 新增中國事件</div>`;
                        } else {
                            chinaHtml = '<span class="no-event">—</span>';
                        }
                    } else {
                        chinaEvents.forEach((event, idx) => {
                            if (isEditingRow) {
                                const hasYear = isCrossYear(event);
                                const crossTag = hasYear ? '<span class="cross-tag">跨年</span>' : '';
                                chinaHtml += `
                                    <div class="event-edit" data-dynasty="${realDynIdx}" data-emperor="${realEmpIdx}" data-type="china" data-event-idx="${idx}">
                                        <span class="bullet">•</span>${crossTag}
                                        <input type="text" value="${escapeAttr(event)}" data-event-idx="${idx}" oninput="updateEventValue(this, 'china')" />
                                        <button class="btn-sm insert" onclick="insertEvent(this, 'china', 'before')" data-event-idx="${idx}">前</button>
                                        <button class="btn-sm insert" onclick="insertEvent(this, 'china', 'after')" data-event-idx="${idx}">後</button>
                                        <button class="btn-sm danger" onclick="deleteEvent(this, 'china')" data-event-idx="${idx}">刪</button>
                                    </div>
                                `;
                            } else {
                                const hasYear = isCrossYear(event);
                                const crossTag = hasYear ? '<span class="cross-tag">跨年</span>' : '';
                                const highlighted = highlightText(event);
                                const eventText = escapeAttr(event);
                                chinaHtml +=
                                    `<span class="event-item" data-event-text="${eventText}" onclick="searchEvent(this)"><span class="bullet">•</span>${crossTag}${highlighted}</span>`;
                            }
                        });
                        if (isEditingRow) {
                            chinaHtml +=
                                `<div class="add-event-btn" onclick="addNewEvent(this, 'china')" data-dynasty="${realDynIdx}" data-emperor="${realEmpIdx}">＋ 新增中國事件</div>`;
                        }
                    }

                    // === 西洋事件 ===
                    let worldHtml = '';
                    const worldEvents = emp.worldEvents || [];
                    if (worldEvents.length === 0) {
                        if (isEditingRow) {
                            worldHtml =
                                `<div class="add-event-btn" onclick="addNewEvent(this, 'world')" data-dynasty="${realDynIdx}" data-emperor="${realEmpIdx}">＋ 新增西洋事件</div>`;
                        } else {
                            worldHtml = '<span class="no-event">—</span>';
                        }
                    } else {
                        worldEvents.forEach((event, idx) => {
                            if (isEditingRow) {
                                worldHtml += `
                                    <div class="event-edit" data-dynasty="${realDynIdx}" data-emperor="${realEmpIdx}" data-type="world" data-event-idx="${idx}">
                                        <span class="bullet">•</span>
                                        <input type="text" value="${escapeAttr(event)}" data-event-idx="${idx}" oninput="updateEventValue(this, 'world')" />
                                        <button class="btn-sm insert" onclick="insertEvent(this, 'world', 'before')" data-event-idx="${idx}">前</button>
                                        <button class="btn-sm insert" onclick="insertEvent(this, 'world', 'after')" data-event-idx="${idx}">後</button>
                                        <button class="btn-sm danger" onclick="deleteEvent(this, 'world')" data-event-idx="${idx}">刪</button>
                                    </div>
                                `;
                            } else {
                                const highlighted = highlightText(event);
                                const eventText = escapeAttr(event);
                                worldHtml +=
                                    `<span class="event-item" data-event-text="${eventText}" onclick="searchEvent(this)"><span class="bullet">•</span>${highlighted}</span>`;
                            }
                        });
                        if (isEditingRow) {
                            worldHtml +=
                                `<div class="add-event-btn" onclick="addNewEvent(this, 'world')" data-dynasty="${realDynIdx}" data-emperor="${realEmpIdx}">＋ 新增西洋事件</div>`;
                        }
                    }

                    // 皇帝欄位：加上「改」按鈕
                    const editBtnText = isEditingRow ? '儲存' : '改';
                    const editBtnClass = isEditingRow ? 'edit-row-btn active' : 'edit-row-btn';
                    const editBtnAction = isEditingRow ?
                        `saveRowEdit(${realDynIdx}, ${realEmpIdx})` :
                        `toggleRowEdit(${realDynIdx}, ${realEmpIdx})`;

                    // 如果是編輯模式，加入「取消」按鈕
                    let cancelBtnHtml = '';
                    if (isEditingRow) {
                        cancelBtnHtml =
                            `<button class="edit-row-btn" onclick="cancelRowEdit(${realDynIdx}, ${realEmpIdx})" style="border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.5);">取消</button>`;
                    }

                    const fieldInputStyle = "background: rgba(252, 251, 250, 0.08); border: 1px solid rgba(252, 251, 250, 0.2); border-radius: 6px; color: #fcfbfa; font-family: 'Noto Serif TC', serif; outline: none;";
                    let emperorDisplay;
                    if (isEditingRow) {
                        emperorDisplay = `
                            <span class="emp-era">
                                <input type="text" value="${escapeAttr(emp.name)}" oninput="updateEmperorField(${realDynIdx}, ${realEmpIdx}, 'name', this.value)" style="${fieldInputStyle} width:88px; padding:2px 6px; font-size:0.85rem;" />・
                                <input type="text" value="${escapeAttr(emp.era)}" oninput="updateEmperorField(${realDynIdx}, ${realEmpIdx}, 'era', this.value)" style="${fieldInputStyle} width:88px; padding:2px 6px; font-size:0.85rem;" />
                            </span>
                            <span class="year-range">（<input type="number" value="${emp.yearStart}" oninput="updateEmperorField(${realDynIdx}, ${realEmpIdx}, 'yearStart', this.value)" style="${fieldInputStyle} width:54px; padding:2px 4px; font-size:0.75rem; font-family:'Inter',sans-serif;" />~<input type="number" value="${emp.yearEnd}" oninput="updateEmperorField(${realDynIdx}, ${realEmpIdx}, 'yearEnd', this.value)" style="${fieldInputStyle} width:54px; padding:2px 4px; font-size:0.75rem; font-family:'Inter',sans-serif;" />）</span>
                            <button class="${editBtnClass}" onclick="${editBtnAction}">${editBtnText}</button>
                            ${cancelBtnHtml}
                            <button class="delete-row-btn" onclick="deleteEmperorRow(${realDynIdx}, ${realEmpIdx})">刪除此列</button>
                        `;
                    } else {
                        emperorDisplay = `
                            <span class="emp-era">
                                <span class="emp-name">${emp.name}</span>·
                                <span class="era-name">${emp.era}</span>
                            </span>
                            <span class="year-range">（${emp.yearStart}~${emp.yearEnd}）</span>
                            <button class="${editBtnClass}" onclick="${editBtnAction}">${editBtnText}</button>
                            ${cancelBtnHtml}
                        `;
                    }

                    html += `<div class="emperor-row ${matchClass} ${crossClass} ${editingClass}" data-dynasty-idx="${realDynIdx}" data-emperor-idx="${realEmpIdx}">
                        <span class="row-drag-handle" title="拖曳調整順序">⠿</span>
                        <div class="col-emperor">${emperorDisplay}</div>
                        <div class="col-china">${chinaHtml}</div>
                        <div class="col-world">${worldHtml}</div>
                    </div>`;
                });

                html += `<button class="add-emperor-btn" onclick="addNewEmperorRow(${di})">＋ 新增一列</button>`;
                html += `</div></div></div>`;
            });

            container.innerHTML = html;

            // 處理展開/收回邏輯
            if (search) {
                document.querySelectorAll('.dynasty').forEach(el => {
                    const body = el.querySelector('.dynasty-body');
                    const toggle = el.querySelector('.dynasty-toggle');
                    const hasMatch = el.querySelector('.emperor-row.match') !== null;
                    if (hasMatch) { body.classList.add('open'); if (toggle) toggle.classList.add('open'); } else { body
                            .classList.remove('open'); if (toggle) toggle.classList.remove('open'); }
                });
                allExpanded = false;
                document.getElementById('toggleAllBtn').classList.remove('all-open');
            }

            document.querySelectorAll('.dynasty-header[data-toggle]').forEach(header => {
                header.removeEventListener('click', toggleDynasty);
                header.addEventListener('click', toggleDynasty);
            });

            scheduleAutoSave();
        }

        // ============================================================
        //  展開/收回
        // ============================================================
        function toggleDynasty(e) {
            const header = e.currentTarget;
            const dynasty = header.closest('.dynasty');
            if (!dynasty) return;
            const body = dynasty.querySelector('.dynasty-body');
            const toggle = dynasty.querySelector('.dynasty-toggle');
            if (!body) return;
            const isOpen = body.classList.contains('open');
            if (isOpen) { body.classList.remove('open'); if (toggle) toggle.classList.remove('open'); } else { body.classList
                    .add('open'); if (toggle) toggle.classList.add('open'); }
            updateAllToggleState();
        }

        function updateAllToggleState() {
            const bodies = document.querySelectorAll('.dynasty-body');
            const allOpen = bodies.length > 0 && Array.from(bodies).every(b => b.classList.contains('open'));
            const btn = document.getElementById('toggleAllBtn');
            if (allOpen) { btn.classList.add('all-open');
                allExpanded = true; } else { btn.classList.remove('all-open');
                allExpanded = false; }
        }

        // ============================================================
        //  載入 JSON 資料
        // ============================================================
        function loadData(force) {
    if (!force && hasAutoSave()) {
        if (restoreAutoSave()) {
            showAutosaveBanner();
            return;
        }
    }
    // 加入時間戳，強制跳過瀏覽器快取
    const timestamp = new Date().getTime();
    const jsonPath = '../Data/timeline_data.json?t=' + timestamp;

    fetch(jsonPath)
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP ${response.status} - ${response.statusText}`);
            }
            return response.json();
        })
        .then(data => {
            DATA = data;
            clearAutoSave();
            render('');
            const total = DATA.reduce((sum, d) => sum + d.emperors.length, 0);
            statsCount.textContent = `共 ${total} 位皇帝 · ${DATA.length} 個朝代`;
        })
        .catch(error => {
            console.error('載入資料失敗:', error);
            container.innerHTML = `
                <div class="error-state">
                    <div class="icon">⚠️</div>
                    <p>無法載入歷史資料</p>
                    <p style="font-size:0.7rem;opacity:0.6;margin-top:4px;">${error.message}</p>
                    <p style="font-size:0.7rem;opacity:0.5;margin-top:2px;">請確認 Data/timeline_data.json 存在且格式正確</p>
                    <button class="retry-btn" onclick="loadData(true)">重新載入</button>
                </div>
            `;
        });
}
        // ============================================================
        //  搜尋邏輯
        // ============================================================
        function doSearch() {
            const term = searchInput.value;
            if (term.trim()) clearBtn.classList.add('visible');
            else clearBtn.classList.remove('visible');
            render(term);
        }
        searchInput.addEventListener('input', doSearch);
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearBtn.classList.remove('visible');
            render('');
            searchInput.focus();
        });

        // ============================================================
        //  初始化
        // ============================================================
        document.documentElement.style.fontSize = DEFAULT_FONT_SIZE + 'px';
        updateFontLabel(getCurrentFontSize());

        document.getElementById('fontIncBtn').addEventListener('click', () => changeFontSize(STEP));
        document.getElementById('fontDecBtn').addEventListener('click', () => changeFontSize(-STEP));
        document.getElementById('toggleAllBtn').addEventListener('click', toggleAll);
        document.getElementById('reorderBtn').addEventListener('click', toggleReorderMode);
        document.getElementById('exportBtn').addEventListener('click', exportData);
        document.getElementById('importBtn').addEventListener('click', triggerImport);
        document.getElementById('importFileInput').addEventListener('change', function() { handleImportFile(this); });
        document.getElementById('addDynastyBtn').addEventListener('click', addNewDynasty);
        initDragAndDrop();

        document.addEventListener('touchstart', (e) => {
            if (e.target.tagName !== 'INPUT' && e.target.closest('.search-wrap') === null) {
                searchInput.blur();
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.activeElement === searchInput) {
                clearBtn.click();
            }
        });

        // 手機返回手勢 / 切換分頁 / 關閉App 前，立即（非延遲）寫入自動儲存
        window.addEventListener('pagehide', persistNow);
        window.addEventListener('beforeunload', persistNow);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') persistNow();
        });

        // 開始載入資料
        loadData();
        console.log('📜 歷史年表已載入，每行皇帝都有專屬「改」按鈕。');
    </script>

</body>
</html>
