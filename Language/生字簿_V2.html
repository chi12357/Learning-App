<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>生字簿</title>
    <meta name="theme-color" content="#121315">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #121315;
            --vermilion: #942525;
            --gold: #bd8b2a;
            --jade: #fcfbfa;
            --ink-2: #1c1e21;
            --ink-3: #26282c;
            --gold-dim: rgba(189, 139, 42, 0.35);
            --vermilion-dim: rgba(148, 37, 37, 0.35);
            --green: #4caf6d;
            --green-dim: rgba(76, 175, 109, 0.35);
            --fs-scale: 1;
            --fs-base: 17px;
            --fs-card: 24px;
            --fs-trans: 16px;
            --fs-h1: 22px;
            --fs-btn: 16px;
            --fs-quiz: 34px;
            --fs-word: calc(24px * var(--fs-scale));
            --fs-word-sub: calc(16px * var(--fs-scale));
            --fs-word-quiz: calc(34px * var(--fs-scale));
            --header-scale: 1.25;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--ink);
            color: var(--jade);
            font-family: 'Noto Serif TC', serif;
            font-size: var(--fs-base);
            overscroll-behavior: none;
        }
        body {
            display: flex;
            flex-direction: column;
            height: 100dvh;
        }
        .en {
            font-family: 'Cormorant Garamond', 'Inter', serif;
        }

        /* ----- 顶部栏（第一行放大） ----- */
        header {
            flex: 0 0 auto;
            padding: max(8px, env(safe-area-inset-top)) 10px 8px 10px;
            background: linear-gradient(180deg, var(--ink-2), var(--ink));
            border-bottom: 1px solid var(--gold-dim);
            position: relative;
            z-index: 10;
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            flex-wrap: nowrap;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 1 auto;
            min-width: 0;
        }
        .header-left h1 {
            margin: 0;
            font-size: calc(var(--fs-h1) * var(--header-scale));
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--jade);
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .header-left h1 .dot {
            color: var(--gold);
        }
        .card-count-badge {
            font-size: calc(13px * var(--header-scale));
            font-weight: 600;
            color: var(--gold);
            background: rgba(189, 139, 42, 0.18);
            border: 1px solid var(--gold-dim);
            border-radius: 20px;
            padding: 2px 12px;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .header-right .mode-toggle-inner {
            display: flex;
            background: var(--ink-3);
            border-radius: 10px;
            padding: 2px;
            border: 1px solid var(--gold-dim);
        }
        .header-right .mode-toggle-inner button {
            border: none;
            background: transparent;
            color: var(--jade);
            padding: 6px 16px;
            font-size: calc(var(--fs-btn) * 0.9 * var(--header-scale));
            font-family: 'Noto Serif TC', serif;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }
        .header-right .mode-toggle-inner button.active {
            background: var(--gold);
            color: var(--ink);
        }

        .header-icon-btn {
            background: var(--ink-3);
            border: 1px solid var(--gold-dim);
            color: var(--jade);
            border-radius: 10px;
            width: calc(36px * var(--header-scale));
            height: calc(36px * var(--header-scale));
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(17px * var(--header-scale));
            cursor: pointer;
            transition: background 0.15s;
        }
        .header-icon-btn:active {
            background: var(--gold-dim);
        }
        .header-icon-btn.active {
            background: var(--gold);
            color: var(--ink);
            border-color: var(--gold);
        }

        .jump-dropdown-wrap {
            position: relative;
            display: inline-block;
        }
        .jump-dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: calc(42px * var(--header-scale));
            background: var(--ink-2);
            border: 1px solid var(--gold-dim);
            border-radius: 12px;
            padding: 6px 0;
            min-width: 150px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            z-index: 30;
        }
        .jump-dropdown-menu.open {
            display: block;
        }
        .jump-dropdown-menu button {
            display: block;
            width: 100%;
            background: transparent;
            border: none;
            color: var(--jade);
            padding: 8px 16px;
            font-size: var(--fs-btn);
            font-family: 'Noto Serif TC', serif;
            text-align: left;
            cursor: pointer;
            border-radius: 0;
        }
        .jump-dropdown-menu button:hover {
            background: var(--ink-3);
        }
        .jump-dropdown-menu button:active {
            background: var(--gold-dim);
        }

        /* ----- 设定面板 ----- */
        .settings-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding-top: 40px;
            overflow-y: auto;
        }
        .settings-overlay.open {
            display: flex;
        }
        .settings-sheet {
            background: var(--ink-2);
            width: 100%;
            max-width: 520px;
            border-radius: 20px 20px 0 0;
            padding: 20px 18px calc(18px + env(safe-area-inset-bottom)) 18px;
            border: 1px solid var(--gold-dim);
            max-height: 88vh;
            overflow-y: auto;
            margin: 0 12px 20px 12px;
            border-radius: 20px;
        }
        .settings-sheet h2 {
            margin: 0 0 16px 0;
            font-size: var(--fs-h1);
            color: var(--gold);
            text-align: center;
        }
        .settings-group {
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 14px;
        }
        .settings-group:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .settings-group-label {
            font-size: var(--fs-trans);
            color: var(--gold);
            margin-bottom: 8px;
            display: block;
            font-weight: 600;
        }
        .settings-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .settings-row .icon-btn {
            background: var(--ink-3);
            border: 1px solid var(--gold-dim);
            color: var(--jade);
            border-radius: 10px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            cursor: pointer;
        }
        .settings-row .icon-btn:active {
            background: var(--gold-dim);
        }
        .settings-row .icon-btn.active {
            background: var(--gold);
            color: var(--ink);
            border-color: var(--gold);
        }
        .settings-row .gt-btn {
            background: var(--ink-3);
            border: 1px solid var(--gold-dim);
            color: var(--jade);
            border-radius: 10px;
            padding: 0 12px;
            height: 38px;
            font-size: var(--fs-btn);
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .settings-row .gt-btn:active {
            background: var(--gold-dim);
        }
        .settings-row .pos-btn {
            background: var(--gold);
            color: var(--ink);
            border: 1px solid var(--gold);
            border-radius: 10px;
            padding: 0 14px;
            height: 38px;
            font-size: var(--fs-btn);
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }
        .settings-row .pos-btn:active {
            transform: scale(0.95);
        }
        .settings-row .manage-btn {
            background: var(--ink-3);
            border: 1px solid var(--gold-dim);
            color: var(--jade);
            border-radius: 8px;
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .settings-row .manage-btn:active {
            transform: scale(0.95);
        }
        .settings-row select,
        .settings-row input[type="text"] {
            background: var(--ink-3);
            border: 1px solid var(--gold-dim);
            color: var(--jade);
            border-radius: 10px;
            padding: 6px 10px;
            font-size: var(--fs-btn);
            font-family: inherit;
            outline: none;
            flex: 1 1 0;
            min-width: 0;
        }
        .settings-row select:focus,
        .settings-row input[type="text"]:focus {
            border-color: var(--gold);
        }
        .settings-row select option {
            background: var(--ink-2);
        }
        .settings-row .filter-label {
            font-size: var(--fs-trans);
            color: var(--gold);
            flex: 0 0 auto;
            white-space: nowrap;
        }
        .settings-search-input {
            flex: 1;
            background: var(--ink-3);
            border: 1px solid var(--gold-dim);
            color: var(--jade);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: var(--fs-btn);
            font-family: inherit;
            outline: none;
            width: 100%;
        }
        .settings-search-input:focus {
            border-color: var(--gold);
        }

        .settings-close-btn {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--gold-dim);
            border-radius: 12px;
            background: var(--ink-3);
            color: var(--jade);
            font-size: var(--fs-btn);
            font-family: 'Noto Serif TC', serif;
            cursor: pointer;
            margin-top: 8px;
        }
        .settings-close-btn:active {
            background: var(--gold-dim);
        }

        /* ----- 主内容 ----- */
        main {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 12px 12px 100px 12px;
            -webkit-overflow-scrolling: touch;
        }
        .empty-state {
            text-align: center;
            margin-top: 60px;
            color: var(--gold-dim);
            font-size: var(--fs-card);
            line-height: 1.8;
        }
        .empty-state .en {
            font-size: 0.55em;
            opacity: 0.8;
        }

        .card {
            background: var(--ink-2);
            border: 1px solid var(--gold-dim);
            border-radius: 16px;
            padding: 14px 14px 10px 14px;
            margin-bottom: 12px;
            position: relative;
        }
        .card.marked {
            border-color: var(--gold);
            border-width: 2px;
            padding: 13px 13px 9px 13px;
        }
        .card.jump-highlight {
            animation: jump-flash 1.4s ease-out;
        }
        @keyframes jump-flash {
            0% {
                box-shadow: 0 0 0 3px var(--gold);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(189, 139, 42, 0);
            }
        }
        .card .source-text {
            font-size: var(--fs-word);
            line-height: 1.5;
            word-break: break-word;
            display: inline;
            padding-bottom: 3px;
            cursor: pointer;
        }
        .source-text.type-word {
            border-bottom: 3px solid var(--gold);
        }
        .source-text.type-phrase {
            border-bottom: 3px solid var(--vermilion);
        }
        .source-text.type-sentence {
            border-bottom: none;
        }
        .source-text.hidden-placeholder {
            color: var(--gold-dim);
            font-style: italic;
            border-bottom: 1px dashed var(--gold-dim);
        }

        .card .target-text {
            margin-top: 8px;
            color: var(--gold);
            opacity: 0.92;
            font-size: var(--fs-word-sub);
            line-height: 1.5;
            word-break: break-word;
        }
        .card .meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 8px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .lang-tag {
            font-size: var(--fs-btn);
            color: var(--gold);
            background: rgba(189, 139, 42, 0.22);
            padding: 3px 9px;
            border-radius: 20px;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.03em;
        }
        .chapter-tag {
            font-size: var(--fs-btn);
            background: rgba(148, 37, 37, 0.2);
            color: var(--vermilion);
            padding: 2px 8px;
            border-radius: 20px;
            font-family: 'Inter', sans-serif;
        }

        .card-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .card-actions button {
            background: transparent;
            border: none;
            color: var(--jade);
            opacity: 0.85;
            width: 34px;
            height: 34px;
            border-radius: 9px;
            font-size: 16px;
            cursor: pointer;
        }
        .card-actions button:active {
            background: var(--ink-3);
        }
        .card-actions button.mark-btn {
            opacity: 0.4;
        }
        .card-actions button.mark-btn.active {
            opacity: 1;
            filter: drop-shadow(0 0 2px var(--gold));
        }

        .drag-handle {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 21px;
            font-weight: 700;
            cursor: grab;
            user-select: none;
            background: rgba(189, 139, 42, 0.18);
            border: 1px solid var(--gold-dim);
            touch-action: none;
            flex-shrink: 0;
        }
        .drag-handle:active {
            background: var(--gold-dim);
            color: var(--ink);
        }

        .fab {
            position: fixed;
            right: 20px;
            bottom: calc(24px + env(safe-area-inset-bottom));
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: var(--gold);
            color: var(--ink);
            border: none;
            font-size: 28px;
            font-weight: 700;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
        }
        .fab:active {
            transform: scale(0.94);
        }

        .card.dragging-source {
            opacity: 0.3;
        }
        .card-drag-clone {
            position: fixed;
            z-index: 1500;
            pointer-events: none;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
            transform: scale(1.03);
            opacity: 0.98;
        }
        .drop-insertion-line {
            height: 3px;
            background: var(--gold);
            border-radius: 2px;
            margin: 0 0 12px 0;
            box-shadow: 0 0 8px var(--gold);
        }
        .drag-position-bar {
            position: fixed;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 1600;
            pointer-events: none;
        }
        .drag-position-bar.active {
            display: flex;
        }
        .drag-position-track {
            width: 5px;
            height: 55vh;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            position: relative;
        }
        .drag-position-thumb {
            position: absolute;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 8px rgba(189, 139, 42, 0.8);
            top: 0%;
        }
        .drag-position-label {
            font-size: 12px;
            color: var(--gold);
            background: var(--ink-2);
            border: 1px solid var(--gold-dim);
            padding: 3px 9px;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 50;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }
        .overlay.open {
            display: flex;
        }
        .sheet {
            background: var(--ink-2);
            width: 100%;
            max-width: 520px;
            border-radius: 20px 20px 0 0;
            padding: 18px 18px calc(18px + env(safe-area-inset-bottom)) 18px;
            border-top: 1px solid var(--gold-dim);
            border-left: 1px solid var(--gold-dim);
            border-right: 1px solid var(--gold-dim);
            max-height: 88vh;
            overflow-y: auto;
        }
        .sheet h2 {
            margin: 0 0 14px 0;
            font-size: var(--fs-h1);
            color: var(--gold);
            text-align: center;
        }
        .field {
            margin-bottom: 14px;
        }
        .field label {
            display: block;
            font-size: var(--fs-trans);
            color: var(--gold);
            margin-bottom: 6px;
        }
        .field textarea,
        .field input[type="text"],
        .field select {
            width: 100%;
            background: var(--ink-3);
            border: 1px solid var(--gold-dim);
            color: var(--jade);
            border-radius: 12px;
            padding: 11px 12px;
            font-size: var(--fs-btn);
            font-family: 'Noto Serif TC', serif;
            resize: vertical;
        }
        .field textarea:focus,
        .field input:focus,
        .field select:focus {
            outline: none;
            border-color: var(--gold);
        }
        .chapter-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .chapter-row select {
            flex: 1;
        }
        .chapter-row input {
            flex: 1;
        }
        .chapter-row button {
            flex: 0 0 auto;
            background: var(--gold);
            color: var(--ink);
            border: none;
            border-radius: 12px;
            padding: 11px 16px;
            font-size: var(--fs-btn);
            font-weight: 700;
            cursor: pointer;
            font-family: 'Noto Serif TC', serif;
        }
        .chapter-row button:active {
            transform: scale(0.95);
        }
        .chapter-row button.gh-clear-btn {
            background: var(--ink-3);
            color: var(--vermilion);
            border: 1px solid var(--gold-dim);
            padding: 11px 14px;
        }

        .lang-row {
            display: flex;
            gap: 10px;
        }
        .lang-row .field {
            flex: 1;
            margin-bottom: 0;
        }

        .type-select {
            display: flex;
            gap: 8px;
        }
        .type-select button {
            flex: 1;
            padding: 10px 4px;
            border-radius: 10px;
            border: 1px solid var(--gold-dim);
            background: var(--ink-3);
            color: var(--jade);
            font-size: var(--fs-btn);
            font-family: 'Noto Serif TC', serif;
            cursor: pointer;
        }
        .type-select button.sel[data-t="word"] {
            background: var(--gold);
            color: var(--ink);
            border-color: var(--gold);
        }
        .type-select button.sel[data-t="phrase"] {
            background: var(--vermilion);
            color: var(--jade);
            border-color: var(--vermilion);
        }
        .type-select button.sel[data-t="sentence"] {
            background: var(--jade);
            color: var(--ink);
            border-color: var(--jade);
        }

        .sheet-actions {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }
        .btn {
            flex: 1;
            padding: 13px;
            border-radius: 12px;
            border: none;
            font-size: var(--fs-btn);
            font-weight: 700;
            font-family: 'Noto Serif TC', serif;
            cursor: pointer;
        }
        .btn.primary {
            background: var(--gold);
            color: var(--ink);
        }
        .btn.ghost {
            background: var(--ink-3);
            color: var(--jade);
            border: 1px solid var(--gold-dim);
        }
        .btn.danger {
            background: var(--vermilion);
            color: var(--jade);
        }
        .btn:active {
            transform: scale(0.97);
        }

        .export-checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin: 6px 0 12px 0;
        }
        .export-checkbox-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: var(--fs-btn);
            color: var(--jade);
            cursor: pointer;
        }
        .export-checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--gold);
        }

        /* ----- 测验 ----- */
        .quiz-wrap {
            display: none;
        }
        .quiz-wrap.open {
            display: block;
        }
        .quiz-filters {
            display: none;
            gap: 6px;
            width: 100%;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .quiz-filters.open {
            display: flex;
        }
        .quiz-filters select {
            flex: 1 1 0;
            min-width: 0;
            background: var(--ink-3);
            border: 1px solid var(--gold-dim);
            color: var(--jade);
            border-radius: 10px;
            padding: 8px 4px;
            font-size: var(--fs-btn);
            font-family: 'Noto Serif TC', serif;
            text-overflow: ellipsis;
        }
        .quiz-filters select option {
            background: var(--ink-2);
        }
        .quiz-mark-toggle {
            flex: 1 1 0;
            min-width: 0;
            background: var(--ink-3);
            border: 1px solid var(--gold-dim);
            color: var(--jade);
            border-radius: 10px;
            padding: 8px 4px;
            font-size: var(--fs-btn);
            font-family: 'Noto Serif TC', serif;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .quiz-mark-toggle.active {
            background: var(--gold);
            color: var(--ink);
            border-color: var(--gold);
            font-weight: 700;
        }

        .quiz-inner {
            max-width: 520px;
            margin: 0 auto;
            padding: 16px 12px 40px 12px;
        }
        .quiz-empty {
            text-align: center;
            margin-top: 60px;
            color: var(--gold-dim);
            font-size: var(--fs-card);
            line-height: 1.8;
        }
        .quiz-card {
            background: var(--ink-2);
            border: 1px solid var(--gold-dim);
            border-radius: 18px;
            padding: 18px 16px 16px;
            position: relative;
            min-height: 260px;
        }
        .quiz-card.correct {
            border-color: var(--green);
            box-shadow: 0 0 0 2px var(--green-dim);
        }
        .quiz-card.wrong {
            border-color: var(--vermilion);
            box-shadow: 0 0 0 2px var(--vermilion-dim);
        }
        .quiz-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 34px;
            margin-bottom: 6px;
            gap: 8px;
        }
        .quiz-progress {
            font-weight: 700;
            color: var(--jade);
            font-size: var(--fs-btn);
            font-family: 'Inter', sans-serif;
        }
        .quiz-correct-count {
            font-weight: 700;
            color: var(--green);
            font-size: calc(var(--fs-btn) * 1.15);
            font-family: 'Inter', sans-serif;
        }
        .quiz-timer {
            font-weight: 700;
            font-size: var(--fs-btn);
            color: var(--gold);
            font-variant-numeric: tabular-nums;
            font-family: 'Inter', sans-serif;
        }
        .quiz-timer.low {
            color: var(--vermilion);
        }
        .quiz-topbar-actions {
            display: flex;
            gap: 8px;
        }
        .quiz-topbar-actions button {
            border: none;
            border-radius: 8px;
            padding: 7px 12px;
            font-size: var(--fs-btn);
            font-weight: 700;
            font-family: 'Noto Serif TC', serif;
            cursor: pointer;
        }
        .quiz-topbar-actions .qa-translate {
            background: var(--gold);
            color: var(--ink);
        }
        .quiz-topbar-actions .qa-next {
            background: var(--vermilion);
            color: var(--jade);
        }
        .quiz-lang-tag {
            display: inline-block;
            margin-bottom: 8px;
        }
        .quiz-question {
            text-align: center;
            font-size: var(--fs-word-quiz);
            line-height: 1.35;
            margin: 14px 0 20px;
            min-height: 1.8em;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .quiz-question-inner {
            word-break: break-word;
            white-space: pre-wrap;
        }
        .quiz-question .speaker-icon-big {
            font-size: calc(var(--fs-word-quiz) * 1.15);
        }
        .quiz-cloze-hint {
            text-align: center;
            color: var(--gold-dim);
            font-size: var(--fs-word-sub);
            margin: -10px 0 16px;
        }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .quiz-opt {
            background: var(--ink-3);
            border: 1px solid var(--gold-dim);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: var(--fs-word-sub);
            text-align: left;
            color: var(--jade);
            display: flex;
            align-items: center;
            cursor: pointer;
            font-family: 'Noto Serif TC', serif;
        }
        .quiz-opt.opt-line-1 {
            min-height: 2.6em;
        }
        .quiz-opt.opt-line-2 {
            min-height: 4.2em;
        }
        .quiz-opt-inner {
            width: 100%;
            line-height: 1.3;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .quiz-opt:active {
            transform: scale(0.99);
        }
        .quiz-opt.selected {
            border-color: var(--gold);
            background: rgba(189, 139, 42, 0.18);
        }
        .quiz-opt.correct-answer {
            border-color: var(--green);
            background: rgba(76, 175, 109, 0.15);
        }
        .quiz-opt.correct-missed {
            border-color: var(--green);
            background: transparent;
            box-shadow: inset 0 0 0 1px var(--green);
        }
        .quiz-opt.wrong-answer {
            border-color: var(--vermilion);
            background: rgba(148, 37, 37, 0.15);
        }
        .qa-confirm {
            margin-top: 12px;
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: var(--fs-btn);
            font-weight: 700;
            font-family: 'Noto Serif TC', serif;
            cursor: pointer;
            background: var(--gold);
            color: var(--ink);
        }
        .qa-confirm:active {
            transform: scale(0.99);
        }

        .quiz-summary {
            background: var(--ink-2);
            border: 1px solid var(--gold-dim);
            border-radius: 18px;
            padding: 28px 20px;
            text-align: center;
        }
        .quiz-score {
            font-size: calc(var(--fs-quiz) * 1.3);
            font-weight: 900;
            color: var(--gold);
            font-family: 'Cormorant Garamond', serif;
        }
        .quiz-score-label {
            color: var(--gold-dim);
            font-size: var(--fs-trans);
            margin-bottom: 6px;
        }
        .all-clear {
            color: var(--green);
            font-weight: 700;
            font-size: var(--fs-btn);
            margin: 10px 0;
        }
        .wrong-list {
            text-align: left;
            margin: 18px 0;
            padding: 12px 14px;
            background: var(--ink-3);
            border-radius: 12px;
        }
        .wrong-list-item {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: var(--fs-word-sub);
        }
        .wrong-list-item:last-child {
            border-bottom: none;
        }
        .wrong-list-item .wsrc {
            font-size: calc(var(--fs-word-sub) * 1.1);
            cursor: pointer;
            color: var(--jade);
        }
        .wrong-list-item .wtgt {
            color: var(--gold);
            opacity: 0.9;
            font-size: calc(var(--fs-word-sub) * 0.9);
            margin-top: 2px;
        }
        .summary-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .summary-actions button {
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: var(--fs-btn);
            font-weight: 700;
            font-family: 'Noto Serif TC', serif;
            cursor: pointer;
        }
        .btn-retest {
            background: var(--vermilion);
            color: var(--jade);
        }
        .btn-next10 {
            background: var(--gold);
            color: var(--ink);
        }

        ::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        .manage-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .manage-row:last-child {
            border-bottom: none;
        }
        .manage-row-label {
            color: var(--jade);
            font-size: var(--fs-trans);
            flex: 1;
            word-break: break-word;
        }
        .manage-row-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .manage-row-actions button {
            border: none;
            border-radius: 8px;
            padding: 7px 10px;
            font-size: 13px;
            cursor: pointer;
            background: var(--ink-3);
            border: 1px solid var(--gold-dim);
            color: var(--jade);
        }
        .manage-row-actions button.manage-delete-btn {
            border-color: var(--vermilion);
            color: var(--vermilion);
        }

        #fileInput {
            display: none;
        }

        @media (max-width: 480px) {
            .header-left h1 {
                font-size: calc(var(--fs-h1) * 0.85 * var(--header-scale));
            }
            .card-count-badge {
                font-size: calc(11px * var(--header-scale));
                padding: 2px 10px;
            }
            .header-right .mode-toggle-inner button {
                font-size: calc(var(--fs-btn) * 0.8 * var(--header-scale));
                padding: 4px 12px;
            }
            .header-icon-btn {
                width: calc(32px * var(--header-scale));
                height: calc(32px * var(--header-scale));
                font-size: calc(15px * var(--header-scale));
            }
            .jump-dropdown-menu {
                top: calc(38px * var(--header-scale));
            }
            .settings-sheet {
                padding: 16px 14px;
                margin: 0 8px 12px 8px;
            }
        }
        @media (max-width: 400px) {
            .header-left h1 {
                font-size: calc(var(--fs-h1) * 0.75 * var(--header-scale));
            }
            .card-count-badge {
                font-size: calc(10px * var(--header-scale));
                padding: 1px 8px;
            }
            .header-right .mode-toggle-inner button {
                font-size: calc(var(--fs-btn) * 0.7 * var(--header-scale));
                padding: 3px 10px;
            }
            .header-icon-btn {
                width: calc(28px * var(--header-scale));
                height: calc(28px * var(--header-scale));
                font-size: calc(13px * var(--header-scale));
            }
            .jump-dropdown-menu {
                top: calc(34px * var(--header-scale));
            }
        }
    </style>
</head>
<body>

    <!-- ===== 顶部栏 ===== -->
    <header>
        <div class="header-top">
            <div class="header-left">
                <h1><span class="dot">●</span> 生字簿</h1>
                <span class="card-count-badge" id="cardCountBadge">0</span>
            </div>
            <div class="header-right">
                <div class="mode-toggle-inner">
                    <button id="modeBrowse" class="active">學習</button>
                    <button id="modeQuiz">測驗</button>
                </div>
                <button class="header-icon-btn" id="googleTranslateBtn" title="Google 翻譯">🌐</button>
                <div class="jump-dropdown-wrap">
                    <button class="header-icon-btn" id="jumpToggleBtn" title="跳转">⏭</button>
                    <div class="jump-dropdown-menu" id="jumpDropdown">
                        <button id="jumpMarkBtn">🔖 跳到标记处</button>
                        <button id="jumpFirstBtn">⏫ 跳到第一张</button>
                        <button id="jumpLastBtn">⏬ 跳到最后一张</button>
                    </div>
                </div>
                <button class="header-icon-btn" id="settingsToggleBtn" title="设定">⚙</button>
            </div>
        </div>
        <div class="quiz-filters" id="quizFilters">
            <select id="quizTypeSelect" title="出题类型">
                <option value="all">全部类型</option>
                <option value="word">单字</option>
                <option value="phrase">片语</option>
                <option value="sentence">例句</option>
            </select>
            <select id="quizQTypeSelect" title="出题方式">
                <option value="all">随机出题</option>
                <option value="src2tgt">原文→翻译</option>
                <option value="tgt2src">翻译→原文</option>
                <option value="listen">听力选字</option>
                <option value="listen_multi">听力多选</option>
                <option value="cloze">填空选字</option>
            </select>
            <select id="quizSpeedSelect" title="限时速度">
                <option value="unlimited">不限时</option>
                <option value="slow">慢速倒数</option>
                <option value="medium">中速倒数</option>
                <option value="fast">快速倒数</option>
            </select>
            <button type="button" id="quizBetweenMarksBtn" class="quiz-mark-toggle" title="只从两个标记字卡之间出题（需刚好标记两张）">标记间</button>
        </div>
    </header>

    <!-- ===== 主内容 ===== -->
    <main id="browseView">
        <div id="cardList"></div>
    </main>

    <div class="quiz-wrap" id="quizView">
        <div id="quizContent"></div>
    </div>

    <button class="fab" id="addFab" title="新增字卡">＋</button>

    <!-- ===== 设定面板 ===== -->
    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-sheet">
            <h2>⚙ 设定</h2>
            <div class="settings-group">
                <span class="settings-group-label">字体大小</span>
                <div class="settings-row">
                    <button class="icon-btn" id="fontMinus">A−</button>
                    <button class="icon-btn" id="fontPlus">A+</button>
                </div>
            </div>
            <div class="settings-group">
                <span class="settings-group-label">搜索</span>
                <div class="settings-row">
                    <input type="text" class="settings-search-input" id="searchInput" placeholder="搜索原文或翻译...">
                </div>
            </div>
            <div class="settings-group">
                <span class="settings-group-label">筛选</span>
                <div class="settings-row" style="margin-bottom:6px;">
                    <span class="filter-label">数据集</span>
                    <select id="datasetFilter"><option value="">全部</option></select>
                    <button class="manage-btn" id="deleteDatasetBtn" title="移除此数据集" style="display:none;">🗑</button>
                </div>
                <div class="settings-row">
                    <span class="filter-label">类别</span>
                    <select id="categoryFilter"><option value="">全部</option></select>
                    <button class="manage-btn" id="manageChaptersBtn" title="管理类别">⚙</button>
                </div>
            </div>
            <div class="settings-group" id="manageChaptersInline">
                <span class="settings-group-label">管理类别</span>
                <div id="manageChaptersList"></div>
            </div>
            <div class="settings-group">
                <span class="settings-group-label">数据</span>
                <div class="settings-row">
                    <button class="gt-btn" id="exportBtn">📤 汇出</button>
                    <button class="gt-btn" id="importBtn">📥 汇入</button>
                    <button class="gt-btn" id="statsBtn">📊 统计</button>
                    <input type="file" id="fileInput" accept=".json">
                </div>
            </div>
            <div class="settings-group">
                <span class="settings-group-label">工具</span>
                <div class="settings-row">
                    <button class="gt-btn" id="hideToggle">隐</button>
                    <button class="pos-btn" id="insertToggle">▼ 插最后</button>
                </div>
            </div>
            <button class="settings-close-btn" id="settingsCloseBtn">关闭设定</button>
        </div>
    </div>

    <!-- ===== 新增／编辑 表单 ===== -->
    <div class="overlay" id="editOverlay">
        <div class="sheet">
            <h2 id="sheetTitle">新增字卡</h2>
            <div class="field">
                <label>类型</label>
                <div class="type-select" id="typeSelect">
                    <button data-t="word" class="sel">单字</button>
                    <button data-t="phrase">片语</button>
                    <button data-t="sentence">例句</button>
                </div>
            </div>
            <div class="lang-row">
                <div class="field">
                    <label>原文语言</label>
                    <select id="sourceLangSelect">
                        <option value="zh">中文</option>
                        <option value="en">英文</option>
                        <option value="ja">日文</option>
                        <option value="fr" selected>法文</option>
                        <option value="ko">韩文</option>
                        <option value="es">西班牙文</option>
                        <option value="de">德文</option>
                    </select>
                </div>
                <div class="field">
                    <label>翻译语言</label>
                    <select id="targetLangSelect">
                        <option value="zh" selected>中文</option>
                        <option value="en">英文</option>
                        <option value="ja">日文</option>
                        <option value="fr">法文</option>
                        <option value="ko">韩文</option>
                        <option value="es">西班牙文</option>
                        <option value="de">德文</option>
                    </select>
                </div>
            </div>
            <div class="field">
                <label>数据集（文件夹）</label>
                <div class="chapter-row">
                    <select id="datasetSelect"></select>
                    <button type="button" id="addDatasetBtn">增数据集</button>
                </div>
            </div>
            <div class="field">
                <label>类别（章节）</label>
                <div class="chapter-row">
                    <select id="chapterSelect"></select>
                    <button type="button" id="addChapterBtn">增类别</button>
                </div>
            </div>
            <div class="field">
                <label id="sourceLabel">原文（法文）</label>
                <textarea id="sourceInput" rows="2" placeholder="输入原文内容..."></textarea>
            </div>
            <div class="field">
                <label id="targetLabel">翻译（中文）</label>
                <textarea id="targetInput" rows="2" placeholder="输入翻译内容..."></textarea>
            </div>
            <div class="sheet-actions">
                <button class="btn ghost" id="cancelBtn">取消</button>
                <button class="btn primary" id="saveBtn">储存</button>
            </div>
        </div>
    </div>

    <!-- ===== 汇出选项 ===== -->
    <div class="overlay" id="exportOverlay">
        <div class="sheet">
            <h2>选择汇出的类别</h2>
            <div class="field">
                <label>勾选要汇出的类别（可复选）</label>
                <div class="export-checkbox-group" id="exportCheckboxGroup"></div>
            </div>
            <div class="sheet-actions">
                <button class="btn ghost" id="exportCancelBtn">取消</button>
                <button class="btn primary" id="exportConfirmBtn">汇出</button>
            </div>
        </div>
    </div>

    <!-- ===== 汇入选项（重复处理） ===== -->
    <div class="overlay" id="importOverlay">
        <div class="sheet">
            <h2>此数据集已存在，如何处理？</h2>
            <div class="field">
                <label id="importSummary">侦测到 0 张字卡</label>
            </div>
            <div class="sheet-actions" style="flex-direction:column; gap:10px;">
                <button class="btn primary" id="importSkipDupBtn">合并：略过重复，只新增新字卡</button>
                <button class="btn danger" id="importReplaceBtn">完全刷新此数据集（清除旧的，改用新的）</button>
                <button class="btn ghost" id="importCancelBtn">取消</button>
            </div>
        </div>
    </div>

    <!-- ===== 汇入来源选择 ===== -->
    <div class="overlay" id="importSourceOverlay">
        <div class="sheet">
            <h2>从哪里汇入？</h2>
            <div class="sheet-actions" style="flex-direction:column; gap:10px;">
                <button class="btn primary" id="importFromLocalBtn">📁 从本机档案汇入</button>
                <button class="btn primary" id="importFromGithubFolderBtn">📂 浏览 GitHub 文件夹</button>
                <button class="btn primary" id="importFromUrlBtn">🔗 从单一 URL 汇入</button>
                <button class="btn ghost" id="importSourceCancelBtn">取消</button>
            </div>
        </div>
    </div>

    <!-- ===== 浏览 GitHub 文件夹 ===== -->
    <div class="overlay" id="githubBrowseOverlay">
        <div class="sheet">
            <h2>浏览 GitHub 文件夹</h2>
            <div class="field">
                <label>拥有者 (owner)</label>
                <div class="chapter-row">
                    <input type="text" id="ghOwnerInput" placeholder="例如 chi12357">
                    <button type="button" class="gh-clear-btn" data-target="ghOwnerInput">✕</button>
                </div>
            </div>
            <div class="field">
                <label>仓库 (repo)</label>
                <div class="chapter-row">
                    <input type="text" id="ghRepoInput" placeholder="例如 Learning-App">
                    <button type="button" class="gh-clear-btn" data-target="ghRepoInput">✕</button>
                </div>
            </div>
            <div class="field">
                <label>分支 (branch)</label>
                <div class="chapter-row">
                    <input type="text" id="ghBranchInput" placeholder="main">
                    <button type="button" class="gh-clear-btn" data-target="ghBranchInput">✕</button>
                </div>
            </div>
            <div class="field">
                <label>文件夹路径 (path)</label>
                <div class="chapter-row">
                    <input type="text" id="ghPathInput" placeholder="例如 Data/生字簿">
                    <button type="button" class="gh-clear-btn" data-target="ghPathInput">✕</button>
                </div>
            </div>
            <div class="sheet-actions">
                <button class="btn ghost" id="ghBrowseCancelBtn">取消</button>
                <button class="btn primary" id="ghBrowseListBtn">浏览档案</button>
            </div>
            <div class="field" id="ghFileListWrap" style="display:none;">
                <label>选择要汇入的 JSON 档案</label>
                <div id="ghFileList"></div>
            </div>
        </div>
    </div>

    <!-- ===== 从 URL 汇入 ===== -->
    <div class="overlay" id="urlImportOverlay">
        <div class="sheet">
            <h2>从 URL 汇入</h2>
            <div class="field">
                <label>贴上 JSON 档案的公开网址（例如 GitHub raw URL）</label>
                <input type="text" id="urlImportInput" placeholder="https://raw.githubusercontent.com/.../file.json">
            </div>
            <div class="sheet-actions">
                <button class="btn ghost" id="urlImportCancelBtn">取消</button>
                <button class="btn primary" id="urlImportConfirmBtn">汇入</button>
            </div>
        </div>
    </div>

    <!-- ===== 移除确认 ===== -->
    <div class="overlay" id="removeConfirmOverlay">
        <div class="sheet">
            <h2 id="removeConfirmTitle">移除确认</h2>
            <div class="field"><label id="removeConfirmSummary"></label></div>
            <div class="sheet-actions" style="flex-direction:column; gap:10px;">
                <button class="btn primary" id="removeExportThenDeleteBtn">先汇出，再移除</button>
                <button class="btn danger" id="removeDirectBtn">直接移除（不汇出）</button>
                <button class="btn ghost" id="removeCancelBtn">取消</button>
            </div>
        </div>
    </div>

    <!-- ===== 拖曳排序侧边指示 ===== -->
    <div class="drag-position-bar" id="dragPositionBar">
        <div class="drag-position-track">
            <div class="drag-position-thumb" id="dragPositionThumb"></div>
        </div>
        <div class="drag-position-label" id="dragPositionLabel"></div>
    </div>

    <script>
        (function() {
            "use strict";
            const STORAGE_KEY = "語言筆記_cards_v4";
            const FONT_KEY = "語言筆記_fontscale_v1";
            const MODE_KEY = "語言筆記_mode_v1";
            const LAST_KEY = "語言筆記_last_v4";
            const INSERT_KEY = "語言筆記_insert_pos";
            const QUIZ_PREFS_KEY = "語言筆記_quiz_prefs_v1";

            let cards = [];
            let editingId = null;
            let currentMode = "browse";
            let searchQuery = "";
            let selectedCategory = "";
            let selectedDataset = "";

            let insertPosition = localStorage.getItem(INSERT_KEY) || 'end';

            let hideSource = false;
            let revealedCards = new Set();

            let quizRound = null;
            let quizTimerHandle = null;
            let quizPrefs = { type: "all", qtype: "all", speed: "unlimited", betweenMarks: false };
            try {
                const rawPrefs = localStorage.getItem(QUIZ_PREFS_KEY);
                if (rawPrefs) quizPrefs = Object.assign(quizPrefs, JSON.parse(rawPrefs));
            } catch (e) {}

            const $ = (sel) => document.querySelector(sel);
            const cardList = $("#cardList");
            const dragPositionBar = $("#dragPositionBar");
            const dragPositionThumb = $("#dragPositionThumb");
            const dragPositionLabel = $("#dragPositionLabel");
            const browseView = $("#browseView");
            const quizView = $("#quizView");
            const quizContent = $("#quizContent");
            const quizFilters = $("#quizFilters");
            const categoryFilter = $("#categoryFilter");
            const datasetFilter = $("#datasetFilter");
            const chapterSelect = $("#chapterSelect");
            const datasetSelect = $("#datasetSelect");

            const langLabels = {
                "zh": "中文",
                "en": "英文",
                "ja": "日文",
                "fr": "法文",
                "ko": "韩文",
                "es": "西班牙文",
                "de": "德文"
            };
            const typeLabels = { word: "单字", phrase: "片语", sentence: "例句" };

            // ---------- 持久化 ----------
            function loadCards() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        cards = JSON.parse(raw);
                        let changed = false;
                        cards.forEach(c => {
                            if (!c.sourceLang || !c.targetLang) {
                                const langKeys = Object.keys(c).filter(k => k.length === 2 && k !== 'id' && k !==
                                    'type' && k !== 'chapter' && k !== 'createdAt' && k !== 'sourceLang' && k !==
                                    'targetLang');
                                if (langKeys.length >= 2) {
                                    c.sourceLang = langKeys[0];
                                    c.targetLang = langKeys[1];
                                } else if (c.fr !== undefined && c.zh !== undefined) {
                                    c.sourceLang = "fr";
                                    c.targetLang = "zh";
                                    c[c.sourceLang] = c.fr;
                                    c[c.targetLang] = c.zh;
                                    delete c.fr;
                                    delete c.zh;
                                } else {
                                    c.sourceLang = "fr";
                                    c.targetLang = "zh";
                                    if (c.fr !== undefined) c[c.sourceLang] = c.fr;
                                    if (c.zh !== undefined) c[c.targetLang] = c.zh;
                                    delete c.fr;
                                    delete c.zh;
                                }
                                changed = true;
                            }
                            if (!c[c.sourceLang]) c[c.sourceLang] = "";
                            if (!c[c.targetLang]) c[c.targetLang] = "";
                            if (!c.chapter) { c.chapter = "一般";
                                changed = true; }
                            if (!c.type) { c.type = "sentence";
                                changed = true; }
                            if (!c.dataset) { c.dataset = "預設";
                                changed = true; }
                            if (typeof c.marked !== "boolean") { c.marked = false;
                                changed = true; }
                        });
                        if (changed) saveCards();
                    } else {
                        cards = sampleCards();
                        saveCards();
                    }
                } catch (e) { cards = sampleCards();
                    saveCards(); }
            }

            function saveCards() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
            }

            function sampleCards() {
                return [
                    { id: uid(), type: "word", sourceLang: "fr", targetLang: "zh", fr: "serendipité",
                        zh: "意外发现美好事物的能力", chapter: "范例", dataset: "预设", createdAt: Date.now() },
                    { id: uid(), type: "phrase", sourceLang: "fr", targetLang: "zh", fr: "ça va sans dire",
                        zh: "这是不言而喻的", chapter: "范例", dataset: "预设", createdAt: Date.now() },
                    { id: uid(), type: "sentence", sourceLang: "ja", targetLang: "zh", ja: "雨が降っても、試合は続きます。",
                        zh: "就算下雨，比赛仍会继续。", chapter: "范例", dataset: "预设", createdAt: Date.now() }
                ];
            }

            function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

            // ---------- 上次使用的设定 ----------
            function getLast() {
                try {
                    const data = JSON.parse(localStorage.getItem(LAST_KEY)) || {};
                    if (!data.type) data.type = "word";
                    return data;
                } catch (e) { return { sourceLang: "fr", targetLang: "zh", chapter: "", type: "word" }; }
            }

            function setLast(sourceLang, targetLang, chapter, type) {
                localStorage.setItem(LAST_KEY, JSON.stringify({ sourceLang, targetLang, chapter, type }));
            }

            // ---------- 字体大小 ----------
            const scales = [0.85, 1, 1.15, 1.3, 1.45];

            function loadFontScale() {
                let idx = parseInt(localStorage.getItem(FONT_KEY));
                if (isNaN(idx) || idx < 0 || idx >= scales.length) idx = 1;
                applyFontScale(idx);
            }

            function applyFontScale(idx) {
                document.documentElement.style.setProperty("--fs-scale", scales[idx]);
                localStorage.setItem(FONT_KEY, idx);
            }

            function currentScaleIdx() {
                let idx = parseInt(localStorage.getItem(FONT_KEY));
                if (isNaN(idx)) idx = 1;
                return idx;
            }
            document.getElementById("fontPlus").addEventListener("click", () => {
                let idx = Math.min(scales.length - 1, currentScaleIdx() + 1);
                applyFontScale(idx);
            });
            document.getElementById("fontMinus").addEventListener("click", () => {
                let idx = Math.max(0, currentScaleIdx() - 1);
                applyFontScale(idx);
            });

            // ---------- 类别辅助 ----------
            function getChapterList() {
                const ch = new Set();
                cards.forEach(c => { if (c.chapter) ch.add(c.chapter); });
                return [...ch].sort();
            }

            function getChapterListForDataset(datasetName) {
                const ch = new Set();
                cards.forEach(c => {
                    if (datasetName && c.dataset !== datasetName) return;
                    if (c.chapter) ch.add(c.chapter);
                });
                return [...ch].sort();
            }

            function getDatasetList() {
                const ds = new Set();
                cards.forEach(c => { if (c.dataset) ds.add(c.dataset); });
                return [...ds].sort();
            }

            function updateAllChapterSelects() {
                const datasets = getDatasetList();
                const currentDatasetVal = datasetFilter.value;
                let datasetHtml = `<option value="">全部</option>`;
                datasets.forEach(ds => {
                    datasetHtml += `<option value="${escapeHtml(ds)}">${escapeHtml(ds)}</option>`;
                });
                datasetFilter.innerHTML = datasetHtml;
                if (currentDatasetVal && datasets.includes(currentDatasetVal)) {
                    datasetFilter.value = currentDatasetVal;
                } else {
                    datasetFilter.value = "";
                }
                selectedDataset = datasetFilter.value;
                updateDeleteDatasetBtnVisibility();

                const chaptersInDataset = getChapterListForDataset(selectedDataset);
                const currentFilterVal = categoryFilter.value;
                let filterHtml = `<option value="">全部</option>`;
                chaptersInDataset.forEach(ch => {
                    filterHtml += `<option value="${escapeHtml(ch)}">${escapeHtml(ch)}</option>`;
                });
                categoryFilter.innerHTML = filterHtml;
                if (currentFilterVal && chaptersInDataset.includes(currentFilterVal)) {
                    categoryFilter.value = currentFilterVal;
                } else {
                    categoryFilter.value = "";
                }
                selectedCategory = categoryFilter.value;

                const currentFormDatasetVal = datasetSelect.value;
                let formDatasetHtml = "";
                datasets.forEach(ds => {
                    formDatasetHtml += `<option value="${escapeHtml(ds)}">${escapeHtml(ds)}</option>`;
                });
                if (datasets.length === 0) {
                    formDatasetHtml = `<option value="预设">预设</option>`;
                }
                datasetSelect.innerHTML = formDatasetHtml;
                if (currentFormDatasetVal && datasets.includes(currentFormDatasetVal)) {
                    datasetSelect.value = currentFormDatasetVal;
                } else if (datasets.includes(selectedDataset)) {
                    datasetSelect.value = selectedDataset;
                } else if (datasets.includes("预设")) {
                    datasetSelect.value = "预设";
                }
                refreshFormChapterSelect();
                renderManageChaptersList();
            }

            function refreshFormChapterSelect() {
                const chaptersForForm = getChapterListForDataset(datasetSelect.value);
                const currentChapterVal = chapterSelect.value;
                let selectHtml = `<option value="">请选择</option>`;
                chaptersForForm.forEach(ch => {
                    selectHtml += `<option value="${escapeHtml(ch)}">${escapeHtml(ch)}</option>`;
                });
                chapterSelect.innerHTML = selectHtml;
                if (currentChapterVal && chaptersForForm.includes(currentChapterVal)) {
                    chapterSelect.value = currentChapterVal;
                } else {
                    chapterSelect.value = "";
                }
            }
            datasetSelect.addEventListener("change", refreshFormChapterSelect);

            // ---------- 新增类别 ----------
            function addNewChapter() {
                const name = prompt("请输入新类别名称：");
                if (!name || name.trim() === "") return;
                const trimmed = name.trim();
                const existing = getChapterList();
                if (existing.includes(trimmed)) {
                    alert("该类别已存在！");
                    return;
                }
                const chapters = getChapterList().concat(trimmed).sort();
                let filterHtml = `<option value="">全部</option>`;
                chapters.forEach(ch => {
                    filterHtml += `<option value="${escapeHtml(ch)}">${escapeHtml(ch)}</option>`;
                });
                categoryFilter.innerHTML = filterHtml;
                let selectHtml = `<option value="">请选择</option>`;
                chapters.forEach(ch => {
                    selectHtml += `<option value="${escapeHtml(ch)}">${escapeHtml(ch)}</option>`;
                });
                chapterSelect.innerHTML = selectHtml;
                chapterSelect.value = trimmed;
                alert("类别已新增！");
                renderManageChaptersList();
            }

            // ---------- 新增数据集 ----------
            function addNewDataset() {
                const name = prompt("请输入新数据集（文件夹）名称：");
                if (!name || name.trim() === "") return;
                const trimmed = name.trim();
                const existing = getDatasetList();
                if (existing.includes(trimmed)) {
                    alert("该数据集已存在！");
                    datasetSelect.value = trimmed;
                    refreshFormChapterSelect();
                    return;
                }
                const datasets = existing.concat(trimmed).sort();
                let optHtml = "";
                datasets.forEach(ds => {
                    optHtml += `<option value="${escapeHtml(ds)}">${escapeHtml(ds)}</option>`;
                });
                datasetSelect.innerHTML = optHtml;
                datasetSelect.value = trimmed;
                refreshFormChapterSelect();
                alert("数据集已新增！新增的字卡会存到这个新数据集。");
            }

            // ---------- 管理类别（内嵌于设定面板） ----------
            const manageChaptersList = document.getElementById("manageChaptersList");

            function renderManageChaptersList() {
                const chapters = getChapterList();
                if (chapters.length === 0) {
                    manageChaptersList.innerHTML = `<div class="manage-row-label">目前没有任何类别</div>`;
                    return;
                }
                manageChaptersList.innerHTML = chapters.map(ch => {
                    const count = cards.filter(c => c.chapter === ch).length;
                    return `<div class="manage-row">
                <span class="manage-row-label">${escapeHtml(ch)}（${count} 张）</span>
                <div class="manage-row-actions">
                  <button class="manage-rename-btn" data-chapter="${escapeHtml(ch)}">✏️</button>
                  <button class="manage-delete-btn" data-chapter="${escapeHtml(ch)}">🗑</button>
                </div>
              </div>`;
                }).join("");
                manageChaptersList.querySelectorAll(".manage-rename-btn").forEach(btn => {
                    btn.addEventListener("click", () => renameChapter(btn.dataset.chapter));
                });
                manageChaptersList.querySelectorAll(".manage-delete-btn").forEach(btn => {
                    btn.addEventListener("click", () => deleteChapter(btn.dataset.chapter));
                });
            }

            function renameChapter(oldName) {
                const input = prompt(`将类别「${oldName}」重新命名为：`, oldName);
                if (input === null) return;
                const trimmed = input.trim();
                if (!trimmed || trimmed === oldName) return;
                const chapters = getChapterList();
                if (chapters.includes(trimmed)) {
                    if (!confirm(`类别「${trimmed}」已存在，是否要将「${oldName}」的字卡合并进去？`)) return;
                }
                cards.forEach(c => { if (c.chapter === oldName) c.chapter = trimmed; });
                saveCards();
                if (selectedCategory === oldName) selectedCategory = trimmed;
                render();
                resetQuizRound();
                if (currentMode === "quiz") renderQuiz();
                renderManageChaptersList();
            }

            function deleteChapter(name) {
                const toRemove = cards.filter(c => c.chapter === name);
                if (toRemove.length === 0) return;
                openRemoveConfirm({
                    title: `移除类别「${name}」`,
                    summary: `此类别共有 ${toRemove.length} 张字卡，移除类别会一并删除这些字卡，此操作无法复原。`,
                    cardsToRemove: toRemove,
                    suggestedName: `${name}_${new Date().toISOString().slice(0, 10)}.json`,
                    onRemoved: () => {
                        cards = cards.filter(c => c.chapter !== name);
                        saveCards();
                        if (selectedCategory === name) selectedCategory = "";
                        render();
                        resetQuizRound();
                        if (currentMode === "quiz") renderQuiz();
                        renderManageChaptersList();
                    }
                });
            }

            document.getElementById("manageChaptersBtn").addEventListener("click", () => {
                renderManageChaptersList();
                document.getElementById("settingsOverlay").classList.add("open");
            });

            // ---------- 移除确认 ----------
            const removeConfirmOverlay = document.getElementById("removeConfirmOverlay");
            let pendingRemoval = null;

            function openRemoveConfirm(opts) {
                pendingRemoval = opts;
                document.getElementById("removeConfirmTitle").textContent = opts.title;
                document.getElementById("removeConfirmSummary").textContent = opts.summary;
                removeConfirmOverlay.classList.add("open");
            }

            function closeRemoveConfirm() {
                removeConfirmOverlay.classList.remove("open");
                pendingRemoval = null;
            }
            document.getElementById("removeCancelBtn").addEventListener("click", closeRemoveConfirm);
            removeConfirmOverlay.addEventListener("click", (e) => { if (e.target === removeConfirmOverlay)
                    closeRemoveConfirm(); });

            document.getElementById("removeExportThenDeleteBtn").addEventListener("click", async () => {
                if (!pendingRemoval) return;
                const { cardsToRemove, suggestedName, onRemoved } = pendingRemoval;
                closeRemoveConfirm();
                const jsonObj = buildExportJsonFromCards(cardsToRemove);
                const saved = await downloadJsonFile(jsonObj, suggestedName);
                if (!saved) return;
                onRemoved();
            });
            document.getElementById("removeDirectBtn").addEventListener("click", () => {
                if (!pendingRemoval) return;
                const { onRemoved } = pendingRemoval;
                closeRemoveConfirm();
                onRemoved();
            });

            // ---------- 统计 ----------
            function showStats() {
                const datasetsToShow = selectedDataset ? [selectedDataset] : getDatasetList();
                if (datasetsToShow.length === 0) {
                    alert("目前没有任何字卡");
                    return;
                }
                let msg = "📊 各类别字卡数量统计";
                msg += selectedDataset ? `（数据集：${selectedDataset}）` : "（全部数据集）";
                msg += "：\n\n";
                let hasAny = false;
                datasetsToShow.forEach(ds => {
                    const chaptersInDs = getChapterListForDataset(ds);
                    if (chaptersInDs.length === 0) return;
                    hasAny = true;
                    if (!selectedDataset) msg += `【${ds}】\n`;
                    chaptersInDs.forEach(ch => {
                        const count = cards.filter(c => c.dataset === ds && c.chapter === ch).length;
                        msg += `${ch}：${count} 张\n`;
                    });
                    msg += "\n";
                });
                if (!hasAny) {
                    alert("目前没有任何类别");
                    return;
                }
                alert(msg.trim());
            }

            // ---------- Google 翻译 ----------
            function openGoogleTranslate() {
                window.open('https://translate.google.com', '_blank');
            }

            // ---------- 跳到标记处 ----------
            let markJumpCursor = -1;

            function jumpToNextMark() {
                const filtered = getFilteredCards();
                const markedCards = filtered.filter(c => c.marked);
                if (markedCards.length === 0) {
                    alert("目前没有标记的字卡");
                    return;
                }
                markJumpCursor = (markJumpCursor + 1) % markedCards.length;
                const target = markedCards[markJumpCursor];
                const el = cardList.querySelector(`.card[data-id="${target.id}"]`);
                if (el) {
                    el.scrollIntoView({ behavior: "smooth", block: "center" });
                    el.classList.remove("jump-highlight");
                    void el.offsetWidth;
                    el.classList.add("jump-highlight");
                    setTimeout(() => el.classList.remove("jump-highlight"), 1500);
                }
            }

            function jumpToCard(index) {
                const filtered = getFilteredCards();
                if (filtered.length === 0) {
                    alert("目前没有符合条件的字卡");
                    return;
                }
                const target = filtered[index];
                const el = cardList.querySelector(`.card[data-id="${target.id}"]`);
                if (el) {
                    el.scrollIntoView({ behavior: "smooth", block: "center" });
                    el.classList.remove("jump-highlight");
                    void el.offsetWidth;
                    el.classList.add("jump-highlight");
                    setTimeout(() => el.classList.remove("jump-highlight"), 1500);
                }
            }

            // ---------- 跳转下拉选单 ----------
            const jumpDropdown = document.getElementById("jumpDropdown");
            document.getElementById("jumpToggleBtn").addEventListener("click", (e) => {
                e.stopPropagation();
                jumpDropdown.classList.toggle("open");
            });
            document.addEventListener("click", () => { jumpDropdown.classList.remove("open"); });
            document.getElementById("jumpMarkBtn").addEventListener("click", (e) => { e.stopPropagation();
                jumpDropdown.classList.remove("open");
                jumpToNextMark(); });
            document.getElementById("jumpFirstBtn").addEventListener("click", (e) => { e.stopPropagation();
                jumpDropdown.classList.remove("open");
                jumpToCard(0); });
            document.getElementById("jumpLastBtn").addEventListener("click", (e) => { e.stopPropagation();
                jumpDropdown.classList.remove("open");
                jumpToCard(getFilteredCards().length - 1); });

            // ---------- 隐藏原文 ----------
            function toggleHide() {
                hideSource = !hideSource;
                revealedCards.clear();
                document.getElementById('hideToggle').textContent = hideSource ? '显' : '隐';
                render();
            }

            // ---------- 插入位置 ----------
            function toggleInsertPosition() {
                insertPosition = (insertPosition === 'start') ? 'end' : 'start';
                localStorage.setItem(INSERT_KEY, insertPosition);
                document.getElementById('insertToggle').textContent = (insertPosition === 'start') ? '▲ 插最前' : '▼ 插最后';
            }

            // ---------- 设定面板 ----------
            const settingsOverlay = document.getElementById("settingsOverlay");

            function openSettings() {
                settingsOverlay.classList.add("open");
                renderManageChaptersList();
            }

            function closeSettings() {
                settingsOverlay.classList.remove("open");
            }
            document.getElementById("settingsToggleBtn").addEventListener("click", openSettings);
            document.getElementById("settingsCloseBtn").addEventListener("click", closeSettings);
            settingsOverlay.addEventListener("click", (e) => { if (e.target === settingsOverlay) closeSettings(); });

            // ---------- 筛选 ----------
            function getDatasetCategoryCards() {
                return cards.filter(c => {
                    if (selectedDataset && c.dataset !== selectedDataset) return false;
                    if (selectedCategory && c.chapter !== selectedCategory) return false;
                    return true;
                });
            }

            function getFilteredCards() {
                const q = searchQuery.trim().toLowerCase();
                return cards.filter(c => {
                    if (selectedDataset && c.dataset !== selectedDataset) return false;
                    if (selectedCategory && c.chapter !== selectedCategory) return false;
                    if (q) {
                        const sourceText = c[c.sourceLang] || "";
                        const targetText = c[c.targetLang] || "";
                        const match = sourceText.toLowerCase().includes(q) ||
                            targetText.toLowerCase().includes(q) ||
                            (c.chapter && c.chapter.toLowerCase().includes(q));
                        if (!match) return false;
                    }
                    return true;
                });
            }

            // ---------- 渲染 ----------
            function render() {
                updateAllChapterSelects();
                const filtered = getFilteredCards();
                const cardCountEl = document.getElementById("cardCountBadge");
                if (cardCountEl) cardCountEl.textContent = getDatasetCategoryCards().length;
                if (filtered.length === 0) {
                    cardList.innerHTML = `<div class="empty-state">${cards.length === 0
                ? "还没有字卡<br>点右下角「＋」开始新增吧"
                : "找不到符合条件的字卡"}</div>`;
                    return;
                }
                cardList.innerHTML = filtered.map((c, displayIdx) => {
                    const realIdx = cards.indexOf(c);
                    const sourceText = c[c.sourceLang] || "";
                    const targetText = c[c.targetLang] || "";
                    const targetHtml = targetText ? `<div class="target-text">${escapeHtml(targetText)}</div>` :
                        "";

                    let displaySource;
                    if (!hideSource) {
                        displaySource = escapeHtml(sourceText);
                    } else {
                        if (revealedCards.has(c.id)) {
                            displaySource = escapeHtml(sourceText);
                        } else {
                            displaySource = `<span class="hidden-placeholder">点击显示原文</span>`;
                        }
                    }

                    return `
                <div class="card${c.marked ? ' marked' : ''}" data-id="${c.id}">
                  <span class="source-text type-${c.type}" data-lang="${c.sourceLang}">${displaySource}</span>
                  ${targetHtml}
                  <div class="meta-row">
                    <span class="drag-handle" title="按住拖曳排序">⠿</span>
                    <div style="flex:1;"></div>
                    <div class="card-actions">
                      <button data-action="mark" title="标记" class="mark-btn${c.marked ? ' active' : ''}">🔖</button>
                      <button data-action="up" title="上移" ${realIdx===0?"disabled style=opacity:0.25":""}>↑</button>
                      <button data-action="down" title="下移" ${realIdx===cards.length-1?"disabled style=opacity:0.25":""}>↓</button>
                      <button data-action="copy" title="复制">⧉</button>
                      <button data-action="edit" title="编辑">✎</button>
                      <button data-action="delete" title="删除">🗑</button>
                    </div>
                  </div>
                </div>`;
                }).join("");
            }

            function escapeHtml(s) {
                return String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;",
                    "'": "&#39;" }[m]));
            }

            // ---------- 卡片点击事件 ----------
            cardList.addEventListener("click", (e) => {
                const sourceEl = e.target.closest(".source-text");
                if (sourceEl) {
                    const cardEl = sourceEl.closest(".card");
                    if (!cardEl) return;
                    const id = cardEl.dataset.id;
                    const c = cards.find(c => c.id === id);
                    if (!c) return;
                    if (hideSource) {
                        if (revealedCards.has(id)) {
                            revealedCards.delete(id);
                        } else {
                            revealedCards.add(id);
                            const text = c[c.sourceLang] || "";
                            speak(text, c.sourceLang);
                            copyToClipboard(text, false);
                        }
                        render();
                        return;
                    } else {
                        const text = c[c.sourceLang] || "";
                        speak(text, c.sourceLang);
                        copyToClipboard(text, false);
                        return;
                    }
                }

                const btn = e.target.closest("[data-action]");
                if (!btn) return;
                const cardEl = e.target.closest(".card");
                if (!cardEl) return;
                const id = cardEl.dataset.id;
                const idx = cards.findIndex(c => c.id === id);
                if (idx === -1) return;
                const action = btn.dataset.action;

                if (action === "copy") {
                    copyToClipboard(cards[idx][cards[idx].sourceLang], true);
                } else if (action === "mark") {
