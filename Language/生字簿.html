  $("#addChapterBtn").addEventListener("click", addNewChapter);
  $("#addDatasetBtn").addEventListener("click", addNewDataset);

  function isDuplicate(sourceText, targetText, sourceLang, targetLang, excludeId) {
    return cards.some(c => {
      if(excludeId && c.id === excludeId) return false;
      return c[c.sourceLang] === sourceText && c[c.targetLang] === targetText;
    });
  }

  $("#saveBtn").addEventListener("click", ()=>{
    const sourceLang = $("#sourceLangSelect").value;
    const targetLang = $("#targetLangSelect").value;
    const sourceText = $("#sourceInput").value.trim();
    if(!sourceText){ $("#sourceInput").focus(); return; }
    const targetText = $("#targetInput").value.trim();
    let chapter = chapterSelect.value;
    if(!chapter) {
      alert("請選擇或新增一個類別");
      chapterSelect.focus();
      return;
    }
    const dataset = datasetSelect.value.trim() || "預設";

    if(!editingId ||
       cards.find(c=>c.id===editingId)[sourceLang] !== sourceText ||
       cards.find(c=>c.id===editingId)[targetLang] !== targetText) {
      if(isDuplicate(sourceText, targetText, sourceLang, targetLang, editingId)) {
        if(!confirm("已存在相同原文與翻譯的字卡，是否仍要儲存？")) {
          return;
        }
      }
    }

    if(editingId){
      const c = cards.find(c=>c.id===editingId);
      if(c){
        if(c.sourceLang !== sourceLang) {
          delete c[c.sourceLang];
        }
        if(c.targetLang !== targetLang) {
          delete c[c.targetLang];
        }
        c.sourceLang = sourceLang;
        c.targetLang = targetLang;
        c[sourceLang] = sourceText;
        c[targetLang] = targetText;
        c.type = selectedType;
        c.chapter = chapter;
        c.dataset = dataset;
      }
    } else {
      const newCard = {
        id: uid(),
        type: selectedType,
        sourceLang: sourceLang,
        targetLang: targetLang,
        chapter: chapter,
        dataset: dataset,
        createdAt: Date.now()
      };
      newCard[sourceLang] = sourceText;
      newCard[targetLang] = targetText;
      if (insertPosition === 'start') {
        cards.unshift(newCard);
      } else {
        cards.push(newCard);
      }
    }
    setLast(sourceLang, targetLang, chapter, selectedType);
    saveCards();
    closeEditSheet();
    render();
  });

  // ---------- 模式切換 ----------
  const modeBrowseBtn = $("#modeBrowse");
  const modeQuizBtn = $("#modeQuiz");
  const addFab = $("#addFab");

  function setMode(mode){
    currentMode = mode;
    localStorage.setItem(MODE_KEY, mode);
    modeBrowseBtn.classList.toggle("active", mode==="browse");
    modeQuizBtn.classList.toggle("active", mode==="quiz");
    browseView.style.display = mode==="browse" ? "block" : "none";
    quizView.classList.toggle("open", mode==="quiz");
    quizFilters.classList.toggle("open", mode==="quiz");
    addFab.style.display = mode==="browse" ? "flex" : "none";
    if(mode==="quiz"){ resetQuizRound(); renderQuiz(); }
    updateAllChapterSelects();
  }
  modeBrowseBtn.addEventListener("click", ()=>setMode("browse"));
  modeQuizBtn.addEventListener("click", ()=>setMode("quiz"));

  // ---------- 測驗模式（選擇題） ----------
  const ROUND_SIZE = 10;
  const SPEED_RATES_CPS = { slow: 100/60, medium: 150/60, fast: (150*1.5)/60 };
  const QUIZ_TIME_MIN = 4, QUIZ_TIME_MAX = 60;
  const LATIN_LANGS = ["en","fr","es","de"];

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }
  function sample(arr, n){
    if(arr.length <= n){
      if(arr.length === 0) return [];
      const out = [];
      while(out.length < n){ out.push(arr[Math.floor(Math.random()*arr.length)]); }
      return out;
    }
    return shuffle(arr).slice(0, n);
  }
  function langFontClass(lang){ return LATIN_LANGS.includes(lang) ? "en" : ""; }

  function getQuizPool(){
    let pool = cards.filter(c => {
      if(selectedDataset && c.dataset !== selectedDataset) return false;
      if(selectedCategory && c.chapter !== selectedCategory) return false;
      if(quizPrefs.type !== "all" && c.type !== quizPrefs.type) return false;
      if(!c[c.sourceLang]) return false;
      return true;
    });
    if(quizPrefs.betweenMarks){
      const markIdxs = [];
      pool.forEach((c, i) => { if(c.marked) markIdxs.push(i); });
      if(markIdxs.length !== 2) return [];
      pool = pool.slice(markIdxs[0] + 1, markIdxs[1]);
    }
    return pool;
  }

  function poolForOptionLang(type, lang, excludeId, pool){
    return pool.filter(c => c.id !== excludeId && c.type === type && c[lang] && String(c[lang]).trim() !== "");
  }

  function tokenizeWords(text){
    return (text||"").split(/\s+/).filter(Boolean);
  }
  function uniqueMeaningfulTokens(tokens){
    const seen = new Set();
    const out = [];
    tokens.forEach(t => {
      const stripped = t.replace(/[^\p{L}\p{N}]/gu, "");
      if(stripped.length < 2) return;
      const key = t.toLowerCase();
      if(seen.has(key)) return;
      seen.add(key);
      out.push(t);
    });
    return out;
  }
  function buildClozePool(card, pool){
    const words = new Set();
    pool.forEach(c => {
      if(c.type !== card.type) return;
      tokenizeWords(c[c.sourceLang]).forEach(w => words.add(w));
    });
    return Array.from(words);
  }
  function clozeEligible(card, pool){
    const tokens = tokenizeWords(card[card.sourceLang]);
    if(tokens.length < 2) return false;
    return buildClozePool(card, pool).length >= 5;
  }
  function listenMultiEligible(card, pool){
    const tokens = tokenizeWords(card[card.sourceLang]);
    const meaningful = uniqueMeaningfulTokens(tokens);
    if(meaningful.length < 2) return false;
    const ownLower = new Set(tokens.map(t => t.toLowerCase()));
    const distractorPool = buildClozePool(card, pool).filter(w => !ownLower.has(w.toLowerCase()));
    return distractorPool.length >= 2;
  }

  function pickQType(card, pool){
    let f = quizPrefs.qtype;
    if(f === "all"){
      const opts = card[card.targetLang] ? ["src2tgt","tgt2src","listen"] : ["src2tgt","listen"];
      if(clozeEligible(card, pool)) opts.push("cloze");
      if(listenMultiEligible(card, pool)) opts.push("listen_multi");
      f = opts[Math.floor(Math.random()*opts.length)];
    } else if(f === "tgt2src" && !card[card.targetLang]){
      f = "src2tgt";
    } else if(f === "cloze" && !clozeEligible(card, pool)){
      f = "src2tgt";
    } else if(f === "listen_multi" && !listenMultiEligible(card, pool)){
      f = "listen";
    }
    return f;
  }

  function buildOptions(correctCard, optionLang, pool){
    const candidatePool = poolForOptionLang(correctCard.type, optionLang, correctCard.id, pool);
    const distractors = sample(candidatePool, Math.min(3, candidatePool.length));
    const items = shuffle([correctCard].concat(distractors));
    return items.map(it => ({ text: it[optionLang], cardId: it.id }));
  }

  function buildQuestion(card, pool){
    const qtype = pickQType(card, pool);
    const q = { card, qtype, userAnswerIndex:null, answered:false };
    if(qtype === "src2tgt"){
      q.promptType = "text";
      q.promptLang = card.sourceLang;
      q.promptText = card[card.sourceLang];
      q.optionLang = card.targetLang;
      q.options = buildOptions(card, card.targetLang, pool);
    } else if(qtype === "tgt2src"){
      q.promptType = "text";
      q.promptLang = card.targetLang;
      q.promptText = card[card.targetLang];
      q.optionLang = card.sourceLang;
      q.options = buildOptions(card, card.sourceLang, pool);
    } else if(qtype === "cloze"){
      const tokens = tokenizeWords(card[card.sourceLang]);
      const candidateIdxs = tokens
        .map((t,i)=>({t,i}))
        .filter(o => o.t.replace(/[^\p{L}\p{N}]/gu,"").length >= 2);
      const chosen = candidateIdxs.length > 0
        ? candidateIdxs[Math.floor(Math.random()*candidateIdxs.length)]
        : { t: tokens[0], i: 0 };
      const blankWord = chosen.t;
      const blankIndex = chosen.i;
      q.promptType = "cloze";
      q.promptLang = card.sourceLang;
      q.clozeTokens = tokens;
      q.blankIndex = blankIndex;
      q.blankWord = blankWord;
      const displayTokens = tokens.slice();
      displayTokens[blankIndex] = "＿＿＿＿";
      q.promptText = displayTokens.join(" ");
      q.hintText = card[card.targetLang] || "";
      q.optionLang = card.sourceLang;
      const wordPool = buildClozePool(card, pool).filter(w => w.toLowerCase() !== blankWord.toLowerCase());
      const distractorWords = sample(wordPool, Math.min(3, wordPool.length));
      const optionTexts = shuffle([blankWord].concat(distractorWords));
      q.options = optionTexts.map((w, i) => ({ text: w, cardId: card.id + "__cloze__" + i }));
      q.correctIndex = optionTexts.indexOf(blankWord);
      return q;
    } else if(qtype === "listen_multi"){
      const tokens = tokenizeWords(card[card.sourceLang]);
      const meaningful = uniqueMeaningfulTokens(tokens);
      const correctCount = Math.min(4, meaningful.length);
      const correctWords = shuffle(meaningful).slice(0, correctCount);
      const ownLower = new Set(tokens.map(t => t.toLowerCase()));
      const distractorPoolAll = buildClozePool(card, pool).filter(w => !ownLower.has(w.toLowerCase()));
      const totalOptions = 6;
      const distractorCount = Math.min(Math.max(totalOptions - correctWords.length, 2), distractorPoolAll.length);
      const distractorWords = shuffle(distractorPoolAll).slice(0, distractorCount);
      const allOptions = shuffle(
        correctWords.map(w => ({ text: w, isCorrect: true }))
          .concat(distractorWords.map(w => ({ text: w, isCorrect: false })))
      );
      q.promptType = "listen_multi";
      q.promptLang = card.sourceLang;
      q.optionLang = card.sourceLang;
      q.correctWords = correctWords;
      q.options = allOptions;
      q.promptText = card[card.sourceLang];
      q._selectedIdx = new Set();
      return q;
    } else { // listen
      q.promptType = "speaker";
      const canUseTarget = !!card[card.targetLang];
      q.optionLang = (canUseTarget && Math.random() < 0.5) ? card.targetLang : card.sourceLang;
      q.options = buildOptions(card, q.optionLang, pool);
    }
    q.correctIndex = q.options.findIndex(o => o.cardId === card.id);
    return q;
  }

  function startNewRound(specificCards, isRetest){
    const pool = getQuizPool();
    let items;
    if(specificCards){
      items = specificCards;
    } else {
      items = sample(pool, Math.min(ROUND_SIZE, pool.length));
      if(pool.length > 0 && pool.length < ROUND_SIZE){
        items = sample(pool, ROUND_SIZE);
      }
    }
    const questions = items.map(c => buildQuestion(c, pool));
    quizRound = {
      questions, currentIndex:0, correctCount:0, answeredCount:0,
      finished:false, isRetest: !!isRetest
    };
  }

  function resetQuizRound(){ quizRound = null; clearQuizTimer(); }

  function computeTimeLimit(text){
    const cps = SPEED_RATES_CPS[quizPrefs.speed];
    if(!cps) return null;
    const seconds = (text||"").length / cps;
    return Math.min(QUIZ_TIME_MAX, Math.max(QUIZ_TIME_MIN, Math.round(seconds)));
  }
  function clearQuizTimer(){
    if(quizTimerHandle){ clearInterval(quizTimerHandle); quizTimerHandle = null; }
  }

  function renderQuiz(){
    quizContent.innerHTML = "";
    const pool = getQuizPool();
    if(pool.length === 0){
      let msg;
      if(quizPrefs.betweenMarks){
        const basePool = cards.filter(c => {
          if(selectedDataset && c.dataset !== selectedDataset) return false;
          if(selectedCategory && c.chapter !== selectedCategory) return false;
          if(quizPrefs.type !== "all" && c.type !== quizPrefs.type) return false;
          if(!c[c.sourceLang]) return false;
          return true;
        });
        const markCount = basePool.filter(c => c.marked).length;
        if(markCount !== 2){
          msg = `「標記間」需要剛好標記兩張字卡作為起訖點<br>目前篩選範圍內標記了 ${markCount} 張，請調整為剛好 2 張`;
        } else {
          msg = "兩個標記字卡之間沒有其他字卡<br>請標記距離更遠的兩張字卡";
        }
      } else {
        msg = "沒有符合篩選條件的字卡<br>請調整類別或新增字卡";
      }
      quizContent.innerHTML = `<div class="quiz-empty">${msg}</div>`;
      return;
    }
    if(!quizRound){ startNewRound(); }
    if(quizRound.finished){ renderQuizSummary(); }
    else { renderQuizQuestion(); }
  }

  function renderQuizQuestion(){
    clearQuizTimer();
    const q = quizRound.questions[quizRound.currentIndex];
    const c = q.card;
    const langLabel = `${langLabels[c.sourceLang]||c.sourceLang} → ${langLabels[c.targetLang]||c.targetLang}`;

    let topActionsHtml, timerHtml = "";
    if(q.answered){
      topActionsHtml = `
        <div class="quiz-topbar-actions">
          <button class="qa-translate" id="qaTranslate">🌐 翻譯</button>
          <button class="qa-next" id="qaNext">下一題</button>
        </div>`;
    } else {
      const timeLimit = computeTimeLimit((q.promptType === "speaker" || q.promptType === "listen_multi") ? c[c.sourceLang] : q.promptText);
      if(timeLimit !== null){
        if(q._timeRemaining === undefined) q._timeRemaining = timeLimit;
        timerHtml = `<div class="quiz-timer${q._timeRemaining<=3?' low':''}" id="quizTimerDisplay">⏱ ${q._timeRemaining}s</div>`;
      }
      topActionsHtml = timerHtml;
    }

    const pct = quizRound.answeredCount > 0 ? Math.round((quizRound.correctCount/quizRound.answeredCount)*100) : 0;
    const progressText = q.answered ? `${quizRound.answeredCount}　${pct}%` : `第 ${quizRound.currentIndex+1} / ${quizRound.questions.length} 題`;

    let qInnerHtml;
    let showBoth = false;
    if(!q.answered){
      if(q.promptType === "speaker" || q.promptType === "listen_multi"){
        qInnerHtml = `<span class="speaker-icon-big">🔊</span>`;
      } else {
        qInnerHtml = `<span class="${langFontClass(q.promptLang)}">${escapeHtml(q.promptText||"")}</span>`;
      }
    } else {
      showBoth = (q.promptType === "listen_multi") || (q.optionLang === c.sourceLang);
      if(q.promptType === "cloze"){
        const revealed = q.clozeTokens.map((t,i)=> i===q.blankIndex
          ? `<span style="color:var(--gold); font-weight:700;">${escapeHtml(t)}</span>`
          : escapeHtml(t)
        ).join(" ");
        qInnerHtml = `<span class="${langFontClass(c.sourceLang)}">${revealed}</span>`;
      } else if(q.promptType === "listen_multi"){
        const correctLower = new Set(q.correctWords.map(w => w.toLowerCase()));
        const revealed = tokenizeWords(c[c.sourceLang]).map(t => correctLower.has(t.toLowerCase())
          ? `<span style="color:var(--gold); font-weight:700;">${escapeHtml(t)}</span>`
          : escapeHtml(t)
        ).join(" ");
        qInnerHtml = `<span class="${langFontClass(c.sourceLang)}">${revealed}</span>`;
      } else if(q.promptType === "speaker" || showBoth){
        qInnerHtml = `<span class="${langFontClass(c.sourceLang)}">${escapeHtml(c[c.sourceLang]||"")}</span>`;
      } else {
        qInnerHtml = `<span class="${langFontClass(q.promptLang)}">${escapeHtml(q.promptText||"")}</span>`;
      }
    }
    const translationHtml = (q.answered && showBoth && c[c.targetLang])
      ? `<div class="quiz-cloze-hint">${escapeHtml(c[c.targetLang])}</div>` : "";

    const lineClass = (q.promptType !== "cloze" && q.promptType !== "listen_multi" && (c.type === "sentence" || c.type === "phrase")) ? "opt-line-2" : "opt-line-1";
    const optionsHtml = q.options.map((opt, idx)=>{
      let cls = "quiz-opt " + lineClass;
      if(q.promptType === "listen_multi"){
        if(q.answered){
          if(opt.isCorrect && q._selectedIdx.has(idx)) cls += " correct-answer";
          else if(opt.isCorrect && !q._selectedIdx.has(idx)) cls += " correct-missed";
          else if(!opt.isCorrect && q._selectedIdx.has(idx)) cls += " wrong-answer";
        } else if(q._selectedIdx.has(idx)){
          cls += " selected";
        }
      } else if(q.answered){
        if(idx === q.correctIndex) cls += " correct-answer";
        else if(idx === q.userAnswerIndex) cls += " wrong-answer";
      }
      return `<button class="${cls}" data-idx="${idx}"><span class="quiz-opt-inner ${langFontClass(q.optionLang)}">${escapeHtml(opt.text||"")}</span></button>`;
    }).join("");
    const confirmBtnHtml = (q.promptType === "listen_multi" && !q.answered)
      ? `<button class="qa-confirm" id="quizConfirmMulti">✅ 確認答案</button>` : "";

    quizContent.innerHTML = `
      <div class="quiz-inner">
        <div class="quiz-card${q.answered ? (isQuestionCorrect(q)?' correct':' wrong') : ''}" id="quizCard">
          <div class="quiz-topbar">
            <div class="quiz-progress">${progressText}</div>
            ${topActionsHtml}
            <div class="quiz-correct-count">${quizRound.correctCount}</div>
          </div>
          <span class="lang-tag quiz-lang-tag">${langLabel} · ${typeLabels[c.type]}</span>
          <div class="quiz-question" id="quizQuestion">
            <span class="quiz-question-inner">${qInnerHtml}</span>
          </div>
          ${translationHtml}
          <div class="quiz-options" id="quizOptions">${optionsHtml}</div>
          ${confirmBtnHtml}
        </div>
      </div>`;

    $("#quizQuestion").addEventListener("click", ()=>{
      if(q.promptType === "cloze" && !q.answered) return;
      speak(c[c.sourceLang], c.sourceLang);
    });

    if(!q.answered && !q._played && (q.promptType === "speaker" || q.promptType === "listen_multi" || q.qtype === "src2tgt")){
      q._played = true;
      setTimeout(()=> speak(c[c.sourceLang], c.sourceLang), 200);
    }

    $("#quizOptions").querySelectorAll(".quiz-opt").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const idx = parseInt(btn.dataset.idx, 10);
        if(q.promptType === "listen_multi"){
          if(q.answered){ speak(c[c.sourceLang], c.sourceLang); return; }
          if(q._selectedIdx.has(idx)) q._selectedIdx.delete(idx); else q._selectedIdx.add(idx);
          btn.classList.toggle("selected");
          return;
        }
        if(q.answered){ speak(c[c.sourceLang], c.sourceLang); return; }
        submitAnswer(idx);
      });
    });

    const confirmBtn = document.getElementById("quizConfirmMulti");
    if(confirmBtn){
      confirmBtn.addEventListener("click", ()=> submitMultiAnswer());
    }

    if(q.answered){
      $("#qaTranslate").addEventListener("click", ()=> translateAndOpen(q));
      $("#qaNext").addEventListener("click", nextQuestion);
    } else {
      const timeLimit = computeTimeLimit((q.promptType === "speaker" || q.promptType === "listen_multi") ? c[c.sourceLang] : q.promptText);
      if(timeLimit !== null){
        quizTimerHandle = setInterval(()=>{
          q._timeRemaining--;
          const el = document.getElementById("quizTimerDisplay");
          if(el){
            el.textContent = "⏱ " + Math.max(0, q._timeRemaining) + "s";
            el.classList.toggle("low", q._timeRemaining <= 3);
          }
          if(q._timeRemaining <= 0){
            clearQuizTimer();
            timeUpAnswer();
          }
        }, 1000);
      }
    }
  }

  function isQuestionCorrect(q){
    if(q.promptType === "listen_multi") return !!q.isFullyCorrect;
    return q.userAnswerIndex === q.correctIndex;
  }

  function submitAnswer(idx){
    clearQuizTimer();
    const q = quizRound.questions[quizRound.currentIndex];
    q.userAnswerIndex = idx;
    q.answered = true;
    quizRound.answeredCount++;
    if(idx === q.correctIndex) quizRound.correctCount++;
    const c = q.card;
    speak(c[c.sourceLang], c.sourceLang);
    copyToClipboard(c[c.sourceLang]);
    renderQuiz();
  }

  function submitMultiAnswer(){
    clearQuizTimer();
    const q = quizRound.questions[quizRound.currentIndex];
    if(q.answered) return;
    const selectedTexts = Array.from(q._selectedIdx).map(i => q.options[i].text);
    const correctSet = new Set(q.correctWords.map(w => w.toLowerCase()));
    const selSet = new Set(selectedTexts.map(w => w.toLowerCase()));
    let fullyCorrect = correctSet.size === selSet.size;
    if(fullyCorrect){
      for(const w of correctSet){ if(!selSet.has(w)){ fullyCorrect = false; break; } }
    }
    q.isFullyCorrect = fullyCorrect;
    q.answered = true;
    quizRound.answeredCount++;
    if(fullyCorrect) quizRound.correctCount++;
    const c = q.card;
    speak(c[c.sourceLang], c.sourceLang);
    copyToClipboard(c[c.sourceLang]);
    renderQuiz();
  }

  function timeUpAnswer(){
    const q = quizRound.questions[quizRound.currentIndex];
    if(q.answered) return;
    if(q.promptType === "listen_multi"){
      submitMultiAnswer();
      return;
    }
    q.userAnswerIndex = -1;
    q.answered = true;
    quizRound.answeredCount++;
    const c = q.card;
    speak(c[c.sourceLang], c.sourceLang);
    copyToClipboard(c[c.sourceLang]);
    renderQuiz();
  }

  function nextQuestion(){
    if(quizRound.currentIndex < quizRound.questions.length - 1){
      quizRound.currentIndex++;
    } else {
      quizRound.finished = true;
    }
    renderQuiz();
  }

  function translateAndOpen(q){
    const c = q.card;
    const text = c[c.sourceLang];
    if(!text) return;
    try{
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }catch(e){ /* copy not supported, fall through */ }
    copyToClipboard(text);
    const sl = c.sourceLang || "auto";
    const tl = c.targetLang || "zh-TW";
    const encoded = encodeURIComponent(text);
    window.open(`https://translate.google.com/?sl=${sl}&tl=${tl}&text=${encoded}&op=translate`, "_blank");
  }

  function renderQuizSummary(){
    const wrong = quizRound.questions.filter(q => !isQuestionCorrect(q));
    const score = Math.round((quizRound.correctCount / quizRound.questions.length) * 100);

    let wrongHtml;
    if(wrong.length === 0){
      wrongHtml = `<div class="all-clear">🎉 全數答對，太厲害了！</div>`;
    } else {
      wrongHtml = `<div class="wrong-list">${wrong.map(q=>{
        const c = q.card;
        return `<div class="wrong-list-item">
          <div class="wsrc ${langFontClass(c.sourceLang)}" data-src="${c.id}">${escapeHtml(c[c.sourceLang]||"")}</div>
          <div class="wtgt">${escapeHtml(c[c.targetLang]||"")}</div>
        </div>`;
      }).join("")}</div>`;
    }

    quizContent.innerHTML = `
      <div class="quiz-inner">
        <div class="quiz-summary">
          <div class="quiz-score-label">${quizRound.isRetest ? "重測結果" : "本次測驗得分"}</div>
          <div class="quiz-score">${score}</div>
          ${wrongHtml}
          <div class="summary-actions">
            ${wrong.length>0 ? `<button class="btn-retest" id="btnRetest">重測錯題（${wrong.length}）</button>` : ""}
            <button class="btn-next10" id="btnNext10">下 ${ROUND_SIZE} 題</button>
          </div>
        </div>
      </div>`;

    quizContent.querySelectorAll(".wsrc").forEach(el=>{
      el.addEventListener("click", ()=>{
        const cd = cards.find(c=>c.id===el.dataset.src);
        if(cd) speak(cd[cd.sourceLang], cd.sourceLang);
      });
    });
    const retestBtn = $("#btnRetest");
    if(retestBtn){
      retestBtn.addEventListener("click", ()=>{
        const wrongCards = wrong.map(q=>q.card);
        startNewRound(wrongCards, true);
        renderQuiz();
      });
    }
    $("#btnNext10").addEventListener("click", ()=>{
      startNewRound();
      renderQuiz();
    });
  }

  // ---------- 匯出（保留卡片順序） ----------
  const exportOverlay = $("#exportOverlay");
  const exportCheckboxGroup = $("#exportCheckboxGroup");

  async function saveFileWithPicker(data, suggestedName) {
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: suggestedName || '語言筆記.json',
          types: [{
            description: 'JSON 檔案',
            accept: {'application/json': ['.json']},
          }],
        });
        const writable = await handle.createWritable();
        await writable.write(data);
        await writable.close();
        return true;
      } catch (err) {
        if (err.name === 'AbortError') {
          return null;
        }
        console.error('儲存失敗', err);
        alert('無法儲存檔案：' + err.message);
        return null;
      }
    } else {
      return false;
    }
  }

  function buildExportJsonFromCards(toExport){
    const orderIndex = new Map();
    toExport.forEach((c, i) => orderIndex.set(c.id, i));

    const chapterOrder = [];
    const seen = new Set();
    toExport.forEach(c => {
      if (!seen.has(c.chapter)) {
        seen.add(c.chapter);
        chapterOrder.push(c.chapter);
      }
    });

    const groups = {};
    toExport.forEach(c => {
      if (!groups[c.chapter]) groups[c.chapter] = [];
      groups[c.chapter].push(c);
    });

    const chaptersObj = chapterOrder.map(ch => {
      const chapterCards = groups[ch];
      const typeGroups = {};
      chapterCards.forEach(c => {
        if (!typeGroups[c.type]) typeGroups[c.type] = [];
        typeGroups[c.type].push(c);
      });
      const sections = Object.keys(typeGroups).map(type => {
        const cardsOfType = typeGroups[type];
        const sentences = cardsOfType.map(c => {
          const obj = { id: c.id };
          obj[c.sourceLang] = c[c.sourceLang];
          obj[c.targetLang] = c[c.targetLang];
          obj.segments = [];
          obj.syntax = "";
          obj.grammar = "";
          obj.culture = "";
          obj.questions = [];
          obj.vocab = [];
          obj.order = orderIndex.get(c.id);
          return obj;
        });
        return {
          id: ch + "-" + type,
          title: type,
          sentences: sentences
        };
      });
      return {
        id: ch,
        title: ch,
        sections: sections
      };
    });

    return { chapters: chaptersObj };
  }

  async function downloadJsonFile(jsonObj, suggestedName){
    const data = JSON.stringify(jsonObj, null, 2);
    const result = await saveFileWithPicker(data, suggestedName);
    if(result === true) return true;
    if(result === null) return false;
    const blob = new Blob([data], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = suggestedName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 3000);
    return true;
  }

  function openExportSheet(){
    const chapters = getChapterList();
    if(chapters.length === 0){
      alert("沒有任何字卡可匯出");
      return;
    }
    exportCheckboxGroup.innerHTML = chapters.map(ch => `
      <label>
        <input type="checkbox" value="${escapeHtml(ch)}" checked> ${escapeHtml(ch)}
      </label>
    `).join('');
    exportOverlay.classList.add("open");
  }

  function closeExportSheet(){
    exportOverlay.classList.remove("open");
  }

  $("#exportBtn").addEventListener("click", openExportSheet);
  $("#exportCancelBtn").addEventListener("click", closeExportSheet);
  exportOverlay.addEventListener("click", (e)=>{ if(e.target===exportOverlay) closeExportSheet(); });

  $("#exportConfirmBtn").addEventListener("click", async ()=>{
    const checkedBoxes = exportCheckboxGroup.querySelectorAll('input[type="checkbox"]:checked');
    const selectedChapters = Array.from(checkedBoxes).map(cb => cb.value);
    if(selectedChapters.length === 0){
      alert("請至少選一個類別");
      return;
    }
    const toExport = cards.filter(c => selectedChapters.includes(c.chapter));
    if(toExport.length === 0){
      alert("所選類別沒有卡片");
      return;
    }

    const jsonObj = buildExportJsonFromCards(toExport);
    const suggestedName = `語言筆記_${new Date().toISOString().slice(0,10)}.json`;
    closeExportSheet();
    await downloadJsonFile(jsonObj, suggestedName);
  });

  // ---------- 匯入 ----------
  let pendingImportCards = null;
  let pendingImportDatasetName = "";
  let pendingImportExistingCount = 0;

  function isDuplicateCard(c, existingArr){
    return existingArr.some(ex => ex[ex.sourceLang] === c[c.sourceLang] && ex[ex.targetLang] === c[c.targetLang]);
  }

  function importCards(file){
    const reader = new FileReader();
    reader.onload = (e)=>{
      const datasetNameHint = (file.name || "匯入資料").replace(/\.json$/i, "").trim() || "匯入資料";
      processImportedText(e.target.result, datasetNameHint);
    };
    reader.onerror = ()=>{
      alert("匯入失敗：無法讀取檔案");
    };
    reader.readAsText(file);
  }

  function deriveDatasetNameFromUrl(url){
    try{
      const u = new URL(url);
      const parts = u.pathname.split('/').filter(Boolean);
      let last = parts[parts.length - 1] || "匯入資料";
      last = decodeURIComponent(last).replace(/\.json$/i, "").trim();
      return last || "匯入資料";
    }catch(e){
      return "匯入資料";
    }
  }

  async function importFromUrl(url){
    let text;
    try{
      const resp = await fetch(url);
      if(!resp.ok){
        alert(`匯入失敗：無法取得檔案（HTTP ${resp.status}）`);
        return;
      }
      text = await resp.text();
    }catch(err){
      alert("匯入失敗：無法連線到此網址，請確認網址正確且為公開連結（例如 GitHub 的 raw 網址）。\n" + err.message);
      return;
    }
    const datasetNameHint = deriveDatasetNameFromUrl(url);
    processImportedText(text, datasetNameHint);
  }

  function processImportedText(text, datasetNameHint){
    try{
      const data = JSON.parse(text);
      let importedCards = [];
      if (data.chapters && Array.isArray(data.chapters)) {
        data.chapters.forEach(ch => {
          const chapterTitle = ch.title || "一般";
          if (ch.sections) {
            ch.sections.forEach(sec => {
              if (sec.sentences) {
                sec.sentences.forEach(s => {
                  const langKeys = Object.keys(s).filter(k => k.length===2 && /^[a-z]{2}$/.test(k) && k!=='id');
                  if(langKeys.length >= 2) {
                    const sourceLang = langKeys[0];
                    const targetLang = langKeys[1];
                    const sourceText = s[sourceLang] || "";
                    const targetText = s[targetLang] || "";
                    if(sourceText) {
                      importedCards.push({
                        id: uid(),
                        type: sec.title || "sentence",
                        sourceLang: sourceLang,
                        targetLang: targetLang,
                        [sourceLang]: sourceText,
                        [targetLang]: targetText,
                        chapter: chapterTitle,
                        createdAt: s.createdAt || Date.now(),
                        _order: (typeof s.order === "number") ? s.order : null
                      });
                    }
                  } else {
                    const possible = ['fr','en','zh','ja','ko','es','de'];
                    let found = [];
                    possible.forEach(lang => {
                      if(s[lang]) found.push({lang, text: s[lang]});
                    });
                    if(found.length >= 2) {
                      const sourceLang = found[0].lang;
                      const targetLang = found[1].lang;
                      importedCards.push({
                        id: uid(),
                        type: sec.title || "sentence",
                        sourceLang: sourceLang,
                        targetLang: targetLang,
                        [sourceLang]: found[0].text,
                        [targetLang]: found[1].text,
                        chapter: chapterTitle,
                        createdAt: s.createdAt || Date.now(),
                        _order: (typeof s.order === "number") ? s.order : null
                      });
                    }
                  }
                });
              }
            });
          }
        });
      } else if (Array.isArray(data)) {
        data.forEach(s => {
          const langKeys = Object.keys(s).filter(k => k.length===2 && /^[a-z]{2}$/.test(k) && k!=='id');
          if(langKeys.length >= 2) {
            const sourceLang = langKeys[0];
            const targetLang = langKeys[1];
            const sourceText = s[sourceLang] || "";
            const targetText = s[targetLang] || "";
            if(sourceText) {
              importedCards.push({
                id: uid(),
                type: s.type || "sentence",
                sourceLang: sourceLang,
                targetLang: targetLang,
                [sourceLang]: sourceText,
                [targetLang]: targetText,
                chapter: s.chapter || "一般",
                createdAt: s.createdAt || Date.now(),
                _order: (typeof s.order === "number") ? s.order : null
              });
            }
          }
        });
      } else {
        throw new Error("不支援的格式");
      }

      importedCards = importedCards.filter(c => !!c[c.sourceLang]);
      if(importedCards.length === 0){
        alert("匯入失敗：檔案中沒有可用的字卡");
        return;
      }

      if(importedCards.some(c => c._order !== null)){
        importedCards = importedCards
          .map((c, i) => ({ c, i }))
          .sort((a, b) => {
            const oa = a.c._order === null ? a.i : a.c._order;
            const ob = b.c._order === null ? b.i : b.c._order;
            return oa - ob;
          })
          .map(x => x.c);
      }
      importedCards.forEach(c => { delete c._order; });

      const datasetName = datasetNameHint || "匯入資料";
      importedCards.forEach(c => { c.dataset = datasetName; });

      const existingInDataset = cards.filter(c => c.dataset === datasetName);

      if(existingInDataset.length === 0){
        cards = cards.concat(importedCards);
        saveCards();
        render();
        resetQuizRound();
        if(currentMode === "quiz") renderQuiz();
        alert(`已建立新資料集「${datasetName}」，共 ${importedCards.length} 張字卡。`);
        return;
      }

      pendingImportCards = importedCards;
      pendingImportDatasetName = datasetName;
      pendingImportExistingCount = existingInDataset.length;
      const dupCount = importedCards.filter(c => isDuplicateCard(c, existingInDataset)).length;
      $("#importSummary").textContent = `資料集「${datasetName}」已存在（原有 ${existingInDataset.length} 張），這次匯入 ${importedCards.length} 張，其中 ${dupCount} 張內容重複。請選擇處理方式：`;
      openImportOverlay();
    }catch(err){
      alert("匯入失敗：檔案格式錯誤\n" + err.message);
    }
  }

  // ---------- 匯入方式選擇 sheet ----------
  const importOverlay = $("#importOverlay");
  function openImportOverlay(){ importOverlay.classList.add("open"); }
  function closeImportOverlay(){
    importOverlay.classList.remove("open");
    pendingImportCards = null;
    pendingImportDatasetName = "";
    pendingImportExistingCount = 0;
  }

  $("#importCancelBtn").addEventListener("click", closeImportOverlay);
  importOverlay.addEventListener("click", (e)=>{ if(e.target===importOverlay) closeImportOverlay(); });

  $("#importSkipDupBtn").addEventListener("click", ()=>{
    if(!pendingImportCards) return;
    const datasetName = pendingImportDatasetName;
    const existingInDataset = cards.filter(c => c.dataset === datasetName);
    let added = 0, skipped = 0;
    pendingImportCards.forEach(c => {
      if(isDuplicateCard(c, existingInDataset)){
        skipped++;
      } else {
        cards.push(c);
        added++;
      }
    });
    saveCards();
    render();
    resetQuizRound();
    if(currentMode === "quiz") renderQuiz();
    closeImportOverlay();
    alert(`已合併到資料集「${datasetName}」！新增 ${added} 張，跳過 ${skipped} 張重複。`);
  });

  $("#importReplaceBtn").addEventListener("click", ()=>{
    if(!pendingImportCards) return;
    const datasetName = pendingImportDatasetName;
    const existingCount = pendingImportExistingCount;
    const importCount = pendingImportCards.length;
    if(!confirm(`此操作只會清除資料集「${datasetName}」原有的 ${existingCount} 張字卡（其他資料集不受影響），改為這次匯入的 ${importCount} 張，確定要完全刷新嗎？`)) return;
    cards = cards.filter(c => c.dataset !== datasetName).concat(pendingImportCards);
    saveCards();
    render();
    resetQuizRound();
    if(currentMode === "quiz") renderQuiz();
    closeImportOverlay();
    alert(`資料集「${datasetName}」已刷新，共 ${importCount} 張字卡。`);
  });

  // ---------- 匯入來源選擇 ----------
  const importSourceOverlay = $("#importSourceOverlay");
  const urlImportOverlay = $("#urlImportOverlay");

  function openImportSourceSheet(){ importSourceOverlay.classList.add("open"); }
  function closeImportSourceSheet(){ importSourceOverlay.classList.remove("open"); }

  $("#importBtn").addEventListener("click", openImportSourceSheet);
  $("#importSourceCancelBtn").addEventListener("click", closeImportSourceSheet);
  importSourceOverlay.addEventListener("click", (e)=>{ if(e.target===importSourceOverlay) closeImportSourceSheet(); });

  $("#importFromLocalBtn").addEventListener("click", ()=>{
    closeImportSourceSheet();
    document.getElementById("fileInput").click();
  });
  document.getElementById("fileInput").addEventListener("change", (e)=>{
    if(e.target.files.length>0){
      importCards(e.target.files[0]);
      e.target.value = "";
    }
  });

  $("#importFromUrlBtn").addEventListener("click", ()=>{
    closeImportSourceSheet();
    $("#urlImportInput").value = "";
    urlImportOverlay.classList.add("open");
    setTimeout(()=> $("#urlImportInput").focus(), 50);
  });
  function closeUrlImportSheet(){ urlImportOverlay.classList.remove("open"); }
  $("#urlImportCancelBtn").addEventListener("click", closeUrlImportSheet);
  urlImportOverlay.addEventListener("click", (e)=>{ if(e.target===urlImportOverlay) closeUrlImportSheet(); });
  $("#urlImportConfirmBtn").addEventListener("click", async ()=>{
    const url = $("#urlImportInput").value.trim();
    if(!url){ alert("請輸入網址"); return; }
    closeUrlImportSheet();
    await importFromUrl(url);
  });

  // ---------- 瀏覽 GitHub 資料夾 ----------
  const GH_BROWSE_KEY = "生字簿_gh_browse_v1";
  const githubBrowseOverlay = $("#githubBrowseOverlay");

  function loadGhBrowsePrefs(){
    let prefs = { owner:"chi12357", repo:"Learning-App", branch:"main", path:"Data/生字簿" };
    try{
      const raw = localStorage.getItem(GH_BROWSE_KEY);
      if(raw) prefs = Object.assign(prefs, JSON.parse(raw));
    }catch(e){}
    return prefs;
  }
  function saveGhBrowsePrefs(prefs){
    try{ localStorage.setItem(GH_BROWSE_KEY, JSON.stringify(prefs)); }catch(e){}
  }

  function openGithubBrowseSheet(){
    const prefs = loadGhBrowsePrefs();
    $("#ghOwnerInput").value = prefs.owner;
    $("#ghRepoInput").value = prefs.repo;
    $("#ghBranchInput").value = prefs.branch || "main";
    $("#ghPathInput").value = prefs.path;
    $("#ghFileListWrap").style.display = "none";
    $("#ghFileList").innerHTML = "";
    githubBrowseOverlay.classList.add("open");
  }
  function closeGithubBrowseSheet(){ githubBrowseOverlay.classList.remove("open"); }

  $("#importFromGithubFolderBtn").addEventListener("click", ()=>{
    closeImportSourceSheet();
    openGithubBrowseSheet();
  });
  $("#ghBrowseCancelBtn").addEventListener("click", closeGithubBrowseSheet);
  githubBrowseOverlay.querySelectorAll(".gh-clear-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const target = document.getElementById(btn.dataset.target);
      if(target){ target.value = ""; target.focus(); }
    });
  });
  githubBrowseOverlay.addEventListener("click", (e)=>{ if(e.target===githubBrowseOverlay) closeGithubBrowseSheet(); });

  $("#ghBrowseListBtn").addEventListener("click", async ()=>{
    const owner = $("#ghOwnerInput").value.trim();
    const repo = $("#ghRepoInput").value.trim();
    const branch = $("#ghBranchInput").value.trim() || "main";
    const path = $("#ghPathInput").value.trim();
    if(!owner || !repo){
      alert("請輸入擁有者 (owner) 與倉庫 (repo) 名稱");
      return;
    }
    saveGhBrowsePrefs({ owner, repo, branch, path });

    const encodedPath = path.split('/').filter(Boolean).map(encodeURIComponent).join('/');
    const apiUrl = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${encodedPath}?ref=${encodeURIComponent(branch)}`;

    $("#ghFileListWrap").style.display = "block";
    $("#ghFileList").innerHTML = `<div class="manage-row-label">載入中...</div>`;

    let items;
    try{
      const resp = await fetch(apiUrl);
      if(!resp.ok){
        $("#ghFileList").innerHTML = `<div class="manage-row-label">無法取得清單（HTTP ${resp.status}），請確認 owner／repo／分支／路徑是否正確，以及倉庫是否為公開。</div>`;
        return;
      }
      items = await resp.json();
    }catch(err){
      $("#ghFileList").innerHTML = `<div class="manage-row-label">連線失敗：${escapeHtml(err.message)}</div>`;
      return;
    }

    if(!Array.isArray(items)){
      $("#ghFileList").innerHTML = `<div class="manage-row-label">這個路徑不是資料夾，請確認路徑是否正確。</div>`;
      return;
    }
    const jsonFiles = items.filter(it => it.type === "file" && /\.json$/i.test(it.name));
    if(jsonFiles.length === 0){
      $("#ghFileList").innerHTML = `<div class="manage-row-label">這個資料夾裡沒有找到 JSON 檔案。</div>`;
      return;
    }
    $("#ghFileList").innerHTML = jsonFiles.map((f, i) => `
      <div class="manage-row">
        <span class="manage-row-label">${escapeHtml(f.name)}</span>
        <div class="manage-row-actions">
          <button class="gh-file-pick-btn" data-idx="${i}">匯入</button>
        </div>
      </div>
    `).join("");
    $("#ghFileList").querySelectorAll(".gh-file-pick-btn").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const f = jsonFiles[parseInt(btn.dataset.idx, 10)];
        if(!f || !f.download_url) return;
        closeGithubBrowseSheet();
        await importFromUrl(f.download_url);
      });
    });
  });

  // ---------- PWA ----------
  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    });
  }

  // ---------- 初始化 ----------
  loadCards();
  loadFontScale();
  document.getElementById('insertToggle').textContent = (insertPosition === 'start') ? '▲ 插最前' : '▼ 插最後';
  updateAllChapterSelects();
  selectedCategory = categoryFilter.value;
  render();
  const savedMode = localStorage.getItem(MODE_KEY) || "browse";
  setMode(savedMode);
})();
</script>
