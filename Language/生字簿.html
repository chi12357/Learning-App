<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>生字簿</title>
<meta name="theme-color" content="#121315">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#121315;
    --vermilion:#942525;
    --gold:#bd8b2a;
    --jade:#fcfbfa;
    --ink-2:#1c1e21;
    --ink-3:#26282c;
    --gold-dim:rgba(189,139,42,0.35);
    --vermilion-dim:rgba(148,37,37,0.35);
    --green:#4caf6d;
    --green-dim:rgba(76,175,109,0.35);

    --fs-scale: 1;
    --fs-base: 17px;
    --fs-card: 24px;
    --fs-trans: 16px;
    --fs-h1: 22px;
    --fs-btn: 16px;
    --fs-quiz: 34px;
    --fs-word: calc(24px * var(--fs-scale));
    --fs-word-sub: calc(16px * var(--fs-scale));
    --fs-word-quiz: calc(34px * var(--fs-scale));
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--ink);
    color:var(--jade);
    font-family:'Noto Serif TC', serif;
    font-size:var(--fs-base);
    overscroll-behavior:none;
  }
  body{
    display:flex; flex-direction:column;
    height:100dvh;
  }
  .en{ font-family:'Cormorant Garamond','Inter',serif; }

  header{
    flex:0 0 auto;
    padding: max(10px, env(safe-area-inset-top)) 14px 10px 10px;
    background:linear-gradient(180deg, var(--ink-2), var(--ink));
    border-bottom:1px solid var(--gold-dim);
    display:flex; flex-direction:column; gap:8px;
    position:relative;
  }
  .title-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .title-row h1{
    margin:0; font-size:var(--fs-h1); font-weight:700; letter-spacing:0.08em;
    color:var(--jade);
    display:flex; align-items:center; gap:8px;
  }
  .title-row h1 .dot{ color:var(--gold); }
  .card-count-badge{
    font-size:13px; font-weight:600; color:var(--gold); background:rgba(189,139,42,0.18);
    border:1px solid var(--gold-dim); border-radius:20px; padding:2px 10px;
    letter-spacing:normal; font-family:'Inter',sans-serif;
  }
  .icon-btn{
    background:var(--ink-3); border:1px solid var(--gold-dim); color:var(--jade);
    border-radius:12px; width:42px; height:42px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    font-size:19px; cursor:pointer;
  }
  .icon-btn:active{ background:var(--gold-dim); }
  .icon-btn.active{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
  .header-controls{ display:flex; align-items:center; gap:8px; flex-wrap:nowrap; }

  .mode-toggle-fixed{ display:flex; justify-content:flex-end; }
  .mode-toggle-fixed-inner{
    display:flex; background:var(--ink-3); border-radius:12px; padding:3px; border:1px solid var(--gold-dim);
  }
  .mode-toggle-fixed-inner button{
    border:none; background:transparent; color:var(--jade); padding:8px 16px;
    font-size:var(--fs-btn); font-family:'Noto Serif TC',serif; font-weight:600;
    border-radius:9px; cursor:pointer; white-space:nowrap;
  }
  .mode-toggle-fixed-inner button.active{ background:var(--gold); color:var(--ink); }

  .fontsize-group{ display:flex; align-items:center; gap:4px; background:var(--ink-3); border:1px solid var(--gold-dim); border-radius:12px; padding:3px; }
  .fontsize-group button{
    width:32px; height:32px; border:none; background:transparent; color:var(--jade); border-radius:8px;
    font-size:15px; cursor:pointer; font-weight:700;
  }
  .fontsize-group button:active{ background:var(--gold-dim); }

  .search-bar{ display:none; }
  .search-bar.open{ display:flex; gap:8px; }
  .search-bar input{
    flex:1; background:var(--ink-3); border:1px solid var(--gold-dim); color:var(--jade);
    border-radius:12px; padding:10px 12px; font-size:var(--fs-btn); font-family:inherit;
  }
  .search-bar input:focus{ outline:none; border-color:var(--gold); }

  .filter-group{
    display:flex; align-items:center; gap:6px; flex:1 1 0; min-width:0;
    background:var(--ink-3); padding:4px 8px; border-radius:12px; border:1px solid var(--gold-dim);
  }
  .filter-group label{ font-size:var(--fs-trans); color:var(--gold); flex:0 0 auto; white-space:nowrap; }
  .filter-group select{
    background:transparent; border:none; color:var(--jade); font-size:var(--fs-btn);
    padding:4px 0; font-family:inherit; outline:none; cursor:pointer;
    flex:1 1 0; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .filter-group select option{ background:var(--ink-2); }
  .manage-btn{
    background:var(--ink-3); border:1px solid var(--gold-dim); color:var(--jade);
    border-radius:8px; width:30px; height:30px; flex-shrink:0; font-size:14px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .manage-btn:active{ transform:scale(0.95); }
  .manage-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 4px; border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .manage-row:last-child{ border-bottom:none; }
  .manage-row-label{ color:var(--jade); font-size:var(--fs-trans); flex:1; word-break:break-word; }
  .manage-row-actions{ display:flex; gap:6px; flex-shrink:0; }
  .manage-row-actions button{
    border:none; border-radius:8px; padding:7px 10px; font-size:13px; cursor:pointer;
    background:var(--ink-3); border:1px solid var(--gold-dim); color:var(--jade);
  }
  .manage-row-actions button.manage-delete-btn{ border-color:var(--vermilion); color:var(--vermilion); }

  main{
    flex:1 1 auto; overflow-y:auto; padding:12px 12px 100px 12px;
    -webkit-overflow-scrolling:touch;
  }
  .empty-state{
    text-align:center; margin-top:60px; color:var(--gold-dim); font-size:var(--fs-card);
    line-height:1.8;
  }
  .empty-state .en{ font-size:0.55em; opacity:0.8; }

  .card{
    background:var(--ink-2); border:1px solid var(--gold-dim); border-radius:16px;
    padding:14px 14px 10px 14px; margin-bottom:12px;
    position:relative;
  }
  .card.marked{ border-color:var(--gold); border-width:2px; padding:13px 13px 9px 13px; }
  .card.jump-highlight{ animation:jump-flash 1.4s ease-out; }
  @keyframes jump-flash{
    0%{ box-shadow:0 0 0 3px var(--gold); }
    100%{ box-shadow:0 0 0 0 rgba(189,139,42,0); }
  }
  .card .source-text{
    font-size:var(--fs-word); line-height:1.5; word-break:break-word;
    display:inline;
    padding-bottom:3px;
    cursor:pointer;
  }
  .source-text.type-word{ border-bottom:3px solid var(--gold); }
  .source-text.type-phrase{ border-bottom:3px solid var(--vermilion); }
  .source-text.type-sentence{ border-bottom:none; }
  .source-text.hidden-placeholder{
    color:var(--gold-dim);
    font-style:italic;
    border-bottom:1px dashed var(--gold-dim);
  }

  .card .target-text{
    margin-top:8px; color:var(--gold); opacity:0.92; font-size:var(--fs-word-sub);
    line-height:1.5; word-break:break-word;
  }
  .card .meta-row{
    display:flex; align-items:center; justify-content:space-between; margin-top:10px;
    border-top:1px solid rgba(255,255,255,0.06); padding-top:8px;
    flex-wrap:wrap; gap:6px;
  }
  /* 移除原有的 .lang-tag 與 .chapter-tag 樣式，因為已不用，但保留以防其他用途 */
  .lang-tag{
    font-size:var(--fs-btn); color:var(--ink); background:var(--gold-dim);
    background:rgba(189,139,42,0.22); color:var(--gold); padding:3px 9px; border-radius:20px;
    font-family:'Inter',sans-serif; letter-spacing:0.03em;
  }
  .chapter-tag{
    font-size:var(--fs-btn);
    background:rgba(148,37,37,0.2); color:var(--vermilion);
    padding:2px 8px; border-radius:20px;
    font-family:'Inter',sans-serif;
  }

  .card-actions{ display:flex; gap:4px; flex-shrink:0; }
  .card-actions button{
    background:transparent; border:none; color:var(--jade); opacity:0.85;
    width:34px; height:34px; border-radius:9px; font-size:16px; cursor:pointer;
  }
  .card-actions button:active{ background:var(--ink-3); }
  .card-actions button.mark-btn{ opacity:0.4; }
  .card-actions button.mark-btn.active{ opacity:1; filter:drop-shadow(0 0 2px var(--gold)); }

  /* 拖曳把手放在左側 */
  .drag-handle{
    width:34px; height:34px; border-radius:9px;
    display:inline-flex; align-items:center; justify-content:center;
    color:var(--gold); font-size:21px; font-weight:700; cursor:grab; user-select:none;
    background:rgba(189,139,42,0.18); border:1px solid var(--gold-dim);
    touch-action:none;
    flex-shrink:0;
  }
  .drag-handle:active{ background:var(--gold-dim); color:var(--ink); }

  .fab{
    position:fixed; right:20px; bottom:calc(24px + env(safe-area-inset-bottom));
    width:58px; height:58px; border-radius:50%;
    background:var(--gold); color:var(--ink); border:none;
    font-size:28px; font-weight:700; box-shadow:0 4px 16px rgba(0,0,0,0.5);
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:20;
  }
  .fab:active{ transform:scale(0.94); }

  /* ---- 長按拖曳排序 ---- */
  .card.dragging-source{ opacity:0.3; }
  .card-drag-clone{
    position:fixed; z-index:1500; pointer-events:none;
    box-shadow:0 10px 28px rgba(0,0,0,0.55);
    transform:scale(1.03);
    opacity:0.98;
  }
  .drop-insertion-line{
    height:3px; background:var(--gold); border-radius:2px; margin:0 0 12px 0;
    box-shadow:0 0 8px var(--gold);
  }
  .drag-position-bar{
    position:fixed; right:8px; top:50%; transform:translateY(-50%);
    display:none; flex-direction:column; align-items:center; gap:8px;
    z-index:1600; pointer-events:none;
  }
  .drag-position-bar.active{ display:flex; }
  .drag-position-track{
    width:5px; height:55vh; background:rgba(255,255,255,0.1); border-radius:4px; position:relative;
  }
  .drag-position-thumb{
    position:absolute; left:50%; transform:translate(-50%,-50%);
    width:16px; height:16px; border-radius:50%; background:var(--gold);
    box-shadow:0 0 8px rgba(189,139,42,0.8); top:0%;
  }
  .drag-position-label{
    font-size:12px; color:var(--gold); background:var(--ink-2); border:1px solid var(--gold-dim);
    padding:3px 9px; border-radius:10px; font-family:'Inter',sans-serif; white-space:nowrap;
  }

  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:50;
    display:none; align-items:flex-end; justify-content:center;
  }
  .overlay.open{ display:flex; }
  .sheet{
    background:var(--ink-2); width:100%; max-width:520px; border-radius:20px 20px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom)) 18px;
    border-top:1px solid var(--gold-dim); border-left:1px solid var(--gold-dim); border-right:1px solid var(--gold-dim);
    max-height:88vh; overflow-y:auto;
  }
  .sheet h2{ margin:0 0 14px 0; font-size:var(--fs-h1); color:var(--gold); text-align:center; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:var(--fs-trans); color:var(--gold); margin-bottom:6px; }
  .field textarea, .field input[type=text], .field select{
    width:100%; background:var(--ink-3); border:1px solid var(--gold-dim); color:var(--jade);
    border-radius:12px; padding:11px 12px; font-size:var(--fs-btn); font-family:'Noto Serif TC',serif;
    resize:vertical;
  }
  .field textarea:focus, .field input:focus, .field select:focus{ outline:none; border-color:var(--gold); }

  .chapter-row{ display:flex; gap:8px; align-items:center; }
  .chapter-row select{ flex:1; }
  .chapter-row input{ flex:1; }
  .chapter-row button{
    flex:0 0 auto;
    background:var(--gold); color:var(--ink); border:none;
    border-radius:12px; padding:11px 16px; font-size:var(--fs-btn);
    font-weight:700; cursor:pointer; font-family:'Noto Serif TC',serif;
  }
  .chapter-row button:active{ transform:scale(0.95); }
  .chapter-row button.gh-clear-btn{
    background:var(--ink-3); color:var(--vermilion); border:1px solid var(--gold-dim);
    padding:11px 14px;
  }

  .lang-row{ display:flex; gap:10px; }
  .lang-row .field{ flex:1; margin-bottom:0; }

  .type-select{ display:flex; gap:8px; }
  .type-select button{
    flex:1; padding:10px 4px; border-radius:10px; border:1px solid var(--gold-dim);
    background:var(--ink-3); color:var(--jade); font-size:var(--fs-btn); font-family:'Noto Serif TC',serif; cursor:pointer;
  }
  .type-select button.sel[data-t="word"]{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
  .type-select button.sel[data-t="phrase"]{ background:var(--vermilion); color:var(--jade); border-color:var(--vermilion); }
  .type-select button.sel[data-t="sentence"]{ background:var(--jade); color:var(--ink); border-color:var(--jade); }

  .sheet-actions{ display:flex; gap:10px; margin-top:6px; }
  .btn{
    flex:1; padding:13px; border-radius:12px; border:none; font-size:var(--fs-btn); font-weight:700;
    font-family:'Noto Serif TC',serif; cursor:pointer;
  }
  .btn.primary{ background:var(--gold); color:var(--ink); }
  .btn.ghost{ background:var(--ink-3); color:var(--jade); border:1px solid var(--gold-dim); }
  .btn.danger{ background:var(--vermilion); color:var(--jade); }
  .btn:active{ transform:scale(0.97); }

  .export-checkbox-group{
    display:grid; grid-template-columns:1fr 1fr; gap:6px;
    margin:6px 0 12px 0;
  }
  .export-checkbox-group label{
    display:flex; align-items:center; gap:6px; font-size:var(--fs-btn);
    color:var(--jade); cursor:pointer;
  }
  .export-checkbox-group input[type="checkbox"]{
    width:18px; height:18px; accent-color:var(--gold);
  }

  .quiz-wrap{ display:none; }
  .quiz-wrap.open{ display:block; }
  .quiz-filters{ display:none; gap:6px; width:100%; }
  .quiz-filters.open{ display:flex; }
  .quiz-filters select{
    flex:1 1 0; min-width:0; background:var(--ink-3); border:1px solid var(--gold-dim); color:var(--jade);
    border-radius:10px; padding:8px 4px; font-size:var(--fs-btn); font-family:'Noto Serif TC',serif;
    text-overflow:ellipsis;
  }
  .quiz-filters select option{ background:var(--ink-2); }
  .quiz-mark-toggle{
    flex:1 1 0; min-width:0; background:var(--ink-3); border:1px solid var(--gold-dim); color:var(--jade);
    border-radius:10px; padding:8px 4px; font-size:var(--fs-btn); font-family:'Noto Serif TC',serif;
    cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .quiz-mark-toggle.active{ background:var(--gold); color:var(--ink); border-color:var(--gold); font-weight:700; }

  .quiz-inner{ max-width:520px; margin:0 auto; padding:16px 12px 40px 12px; }
  .quiz-empty{ text-align:center; margin-top:60px; color:var(--gold-dim); font-size:var(--fs-card); line-height:1.8; }

  .quiz-card{
    background:var(--ink-2); border:1px solid var(--gold-dim);
    border-radius:18px; padding:18px 16px 16px; position:relative; min-height:260px;
  }
  .quiz-card.correct{ border-color:var(--green); box-shadow:0 0 0 2px var(--green-dim); }
  .quiz-card.wrong{ border-color:var(--vermilion); box-shadow:0 0 0 2px var(--vermilion-dim); }
  .quiz-topbar{ display:flex; align-items:center; justify-content:space-between; min-height:34px; margin-bottom:6px; gap:8px; }
  .quiz-progress{ font-weight:700; color:var(--jade); font-size:var(--fs-btn); font-family:'Inter',sans-serif; }
  .quiz-correct-count{ font-weight:700; color:var(--green); font-size:calc(var(--fs-btn) * 1.15); font-family:'Inter',sans-serif; }
  .quiz-timer{ font-weight:700; font-size:var(--fs-btn); color:var(--gold); font-variant-numeric:tabular-nums; font-family:'Inter',sans-serif; }
  .quiz-timer.low{ color:var(--vermilion); }
  .quiz-topbar-actions{ display:flex; gap:8px; }
  .quiz-topbar-actions button{
    border:none; border-radius:8px; padding:7px 12px; font-size:var(--fs-btn); font-weight:700;
    font-family:'Noto Serif TC',serif; cursor:pointer;
  }
  .quiz-topbar-actions .qa-translate{ background:var(--gold); color:var(--ink); }
  .quiz-topbar-actions .qa-next{ background:var(--vermilion); color:var(--jade); }

  .quiz-lang-tag{ display:inline-block; margin-bottom:8px; }
  .quiz-question{
    text-align:center; font-size:var(--fs-word-quiz); line-height:1.35; margin:14px 0 20px;
    min-height:1.8em; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .quiz-question-inner{ word-break:break-word; white-space:pre-wrap; }
  .quiz-question .speaker-icon-big{ font-size:calc(var(--fs-word-quiz) * 1.15); }
  .quiz-cloze-hint{ text-align:center; color:var(--gold-dim); font-size:var(--fs-word-sub); margin:-10px 0 16px; }
  .quiz-options{ display:flex; flex-direction:column; gap:10px; }
  .quiz-opt{
    background:var(--ink-3); border:1px solid var(--gold-dim); border-radius:12px;
    padding:12px 14px; font-size:var(--fs-word-sub); text-align:left; color:var(--jade);
    display:flex; align-items:center; cursor:pointer; font-family:'Noto Serif TC',serif;
  }
  .quiz-opt.opt-line-1{ min-height:2.6em; }
  .quiz-opt.opt-line-2{ min-height:4.2em; }
  .quiz-opt-inner{ width:100%; line-height:1.3; word-break:break-word; white-space:pre-wrap; }
  .quiz-opt:active{ transform:scale(0.99); }
  .quiz-opt.selected{ border-color:var(--gold); background:rgba(189,139,42,0.18); }
  .quiz-opt.correct-answer{ border-color:var(--green); background:rgba(76,175,109,0.15); }
  .quiz-opt.correct-missed{ border-color:var(--green); background:transparent; box-shadow:inset 0 0 0 1px var(--green); }
  .quiz-opt.wrong-answer{ border-color:var(--vermilion); background:rgba(148,37,37,0.15); }
  .qa-confirm{
    margin-top:12px; width:100%; border:none; border-radius:12px; padding:12px; font-size:var(--fs-btn);
    font-weight:700; font-family:'Noto Serif TC',serif; cursor:pointer; background:var(--gold); color:var(--ink);
  }
  .qa-confirm:active{ transform:scale(0.99); }

  .quiz-summary{ background:var(--ink-2); border:1px solid var(--gold-dim); border-radius:18px; padding:28px 20px; text-align:center; }
  .quiz-score{ font-size:calc(var(--fs-quiz) * 1.3); font-weight:900; color:var(--gold); font-family:'Cormorant Garamond',serif; }
  .quiz-score-label{ color:var(--gold-dim); font-size:var(--fs-trans); margin-bottom:6px; }
  .all-clear{ color:var(--green); font-weight:700; font-size:var(--fs-btn); margin:10px 0; }
  .wrong-list{ text-align:left; margin:18px 0; padding:12px 14px; background:var(--ink-3); border-radius:12px; }
  .wrong-list-item{ padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.06); font-size:var(--fs-word-sub); }
  .wrong-list-item:last-child{ border-bottom:none; }
  .wrong-list-item .wsrc{ font-size:calc(var(--fs-word-sub) * 1.1); cursor:pointer; color:var(--jade); }
  .wrong-list-item .wtgt{ color:var(--gold); opacity:0.9; font-size:calc(var(--fs-word-sub) * 0.9); margin-top:2px; }
  .summary-actions{ display:flex; gap:10px; justify-content:center; margin-top:8px; flex-wrap:wrap; }
  .summary-actions button{
    border:none; border-radius:12px; padding:12px 20px; font-size:var(--fs-btn); font-weight:700;
    font-family:'Noto Serif TC',serif; cursor:pointer;
  }
  .btn-retest{ background:var(--vermilion); color:var(--jade); }
  .btn-next10{ background:var(--gold); color:var(--ink); }

  ::-webkit-scrollbar{ width:0; height:0; }

  .io-group{ display:flex; gap:4px; flex-wrap:wrap; align-items:center; }
  .io-group button{
    background:var(--ink-3); border:1px solid var(--gold-dim); color:var(--jade);
    border-radius:10px; padding:0 10px; font-size:var(--fs-btn);
    cursor:pointer; font-family:inherit;
    height:40px; box-sizing:border-box;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .io-group button:active{ background:var(--gold-dim); }
  .io-group .gt-btn{
    background:var(--ink-3); border:1px solid var(--gold-dim); color:var(--jade);
    border-radius:10px; padding:0 10px; font-size:var(--fs-btn);
    cursor:pointer; font-family:inherit;
    height:40px; box-sizing:border-box;
    display:inline-flex; align-items:center; justify-content:center;
    line-height:1;
  }
  .io-group .gt-btn:active{ background:var(--gold-dim); }
  .io-group .pos-btn{
    background:var(--gold); color:var(--ink); border:1px solid var(--gold);
    border-radius:10px; padding:0 10px; font-size:var(--fs-btn);
    cursor:pointer; font-family:inherit;
    height:40px; box-sizing:border-box;
    display:inline-flex; align-items:center; justify-content:center;
    font-weight:600;
  }
  .io-group .pos-btn:active{ transform:scale(0.95); }
  .io-group .icon-btn{ width:40px; height:40px; padding:0; font-size:19px; box-sizing:border-box; }
  #fileInput{ display:none; }
</style>
</head>
<body>

<header>

<script>
(function(){
  "use strict";
  const STORAGE_KEY = "語言筆記_cards_v4";
  const FONT_KEY = "語言筆記_fontscale_v1";
  const MODE_KEY = "語言筆記_mode_v1";
  const LAST_KEY = "語言筆記_last_v4";
  const INSERT_KEY = "語言筆記_insert_pos";
  const QUIZ_PREFS_KEY = "語言筆記_quiz_prefs_v1";

  let cards = [];
  let editingId = null;
  let currentMode = "browse";
  let searchQuery = "";
  let selectedCategory = "";
  let selectedDataset = "";

  let insertPosition = localStorage.getItem(INSERT_KEY) || 'end';

  let hideSource = false;
  let revealedCards = new Set();

  let quizRound = null;
  let quizTimerHandle = null;
  let quizPrefs = { type:"all", qtype:"all", speed:"unlimited", betweenMarks:false };
  try{
    const rawPrefs = localStorage.getItem(QUIZ_PREFS_KEY);
    if(rawPrefs) quizPrefs = Object.assign(quizPrefs, JSON.parse(rawPrefs));
  }catch(e){}

  const $ = (sel) => document.querySelector(sel);
  const cardList = $("#cardList");
  const dragPositionBar = $("#dragPositionBar");
  const dragPositionThumb = $("#dragPositionThumb");
  const dragPositionLabel = $("#dragPositionLabel");
  const browseView = $("#browseView");
  const quizView = $("#quizView");
  const quizContent = $("#quizContent");
  const quizFilters = $("#quizFilters");
  const categoryFilter = $("#categoryFilter");
  const datasetFilter = $("#datasetFilter");
  const chapterSelect = $("#chapterSelect");
  const datasetSelect = $("#datasetSelect");

  const langLabels = {
    "zh":"中文", "en":"英文", "ja":"日文", "fr":"法文",
    "ko":"韓文", "es":"西班牙文", "de":"德文"
  };
  const typeLabels = {word:"單字", phrase:"片語", sentence:"例句"};

  // ---------- 持久化 ----------
  function loadCards(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) {
        cards = JSON.parse(raw);
        let changed = false;
        cards.forEach(c => {
          if(!c.sourceLang || !c.targetLang) {
            const langKeys = Object.keys(c).filter(k => k.length===2 && k!=='id' && k!=='type' && k!=='chapter' && k!=='createdAt' && k!=='sourceLang' && k!=='targetLang');
            if(langKeys.length >= 2) {
              c.sourceLang = langKeys[0];
              c.targetLang = langKeys[1];
            } else if(c.fr !== undefined && c.zh !== undefined) {
              c.sourceLang = "fr";
              c.targetLang = "zh";
              c[c.sourceLang] = c.fr;
              c[c.targetLang] = c.zh;
              delete c.fr;
              delete c.zh;
            } else {
              c.sourceLang = "fr";
              c.targetLang = "zh";
              if(c.fr !== undefined) c[c.sourceLang] = c.fr;
              if(c.zh !== undefined) c[c.targetLang] = c.zh;
              delete c.fr;
              delete c.zh;
            }
            changed = true;
          }
          if(!c[c.sourceLang]) c[c.sourceLang] = "";
          if(!c[c.targetLang]) c[c.targetLang] = "";
          if(!c.chapter) { c.chapter = "一般"; changed = true; }
          if(!c.type) { c.type = "sentence"; changed = true; }
          if(!c.dataset) { c.dataset = "預設"; changed = true; }
          if(typeof c.marked !== "boolean") { c.marked = false; changed = true; }
        });
        if(changed) saveCards();
      } else {
        cards = sampleCards();
        saveCards();
      }
    }catch(e){ cards = sampleCards(); saveCards(); }
  }
  function saveCards(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
  }
  function sampleCards(){
    return [
      {id: uid(), type:"word", sourceLang:"fr", targetLang:"zh", fr:"serendipité", zh:"意外發現美好事物的能力", chapter:"範例", dataset:"預設", createdAt: Date.now()},
      {id: uid(), type:"phrase", sourceLang:"fr", targetLang:"zh", fr:"ça va sans dire", zh:"這是不言而喻的", chapter:"範例", dataset:"預設", createdAt: Date.now()},
      {id: uid(), type:"sentence", sourceLang:"ja", targetLang:"zh", ja:"雨が降っても、試合は続きます。", zh:"就算下雨，比賽仍會繼續。", chapter:"範例", dataset:"預設", createdAt: Date.now()}
    ];
  }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

  // ---------- 上次使用的設定 ----------
  function getLast(){
    try{
      const data = JSON.parse(localStorage.getItem(LAST_KEY)) || {};
      if(!data.type) data.type = "word";
      return data;
    }catch(e){ return { sourceLang:"fr", targetLang:"zh", chapter:"", type:"word" }; }
  }
  function setLast(sourceLang, targetLang, chapter, type){
    localStorage.setItem(LAST_KEY, JSON.stringify({sourceLang, targetLang, chapter, type}));
  }

  // ---------- 字體大小 ----------
  const scales = [0.85, 1, 1.15, 1.3, 1.45];
  function loadFontScale(){
    let idx = parseInt(localStorage.getItem(FONT_KEY));
    if(isNaN(idx) || idx<0 || idx>=scales.length) idx = 1;
    applyFontScale(idx);
  }
  function applyFontScale(idx){
    document.documentElement.style.setProperty("--fs-scale", scales[idx]);
    localStorage.setItem(FONT_KEY, idx);
  }
  function currentScaleIdx(){
    let idx = parseInt(localStorage.getItem(FONT_KEY));
    if(isNaN(idx)) idx = 1;
    return idx;
  }
  $("#fontPlus").addEventListener("click", ()=>{
    let idx = Math.min(scales.length-1, currentScaleIdx()+1);
    applyFontScale(idx);
  });
  $("#fontMinus").addEventListener("click", ()=>{
    let idx = Math.max(0, currentScaleIdx()-1);
    applyFontScale(idx);
  });

  // ---------- 類別輔助 ----------
  function getChapterList(){
    const ch = new Set();
    cards.forEach(c => { if(c.chapter) ch.add(c.chapter); });
    return [...ch].sort();
  }
  function getChapterListForDataset(datasetName){
    const ch = new Set();
    cards.forEach(c => {
      if(datasetName && c.dataset !== datasetName) return;
      if(c.chapter) ch.add(c.chapter);
    });
    return [...ch].sort();
  }
  function getDatasetList(){
    const ds = new Set();
    cards.forEach(c => { if(c.dataset) ds.add(c.dataset); });
    return [...ds].sort();
  }

  function updateAllChapterSelects(){
    const datasets = getDatasetList();
    const currentDatasetVal = datasetFilter.value;
    let datasetHtml = `<option value="">全部</option>`;
    datasets.forEach(ds => {
      datasetHtml += `<option value="${escapeHtml(ds)}">${escapeHtml(ds)}</option>`;
    });
    datasetFilter.innerHTML = datasetHtml;
    if(currentDatasetVal && datasets.includes(currentDatasetVal)) {
      datasetFilter.value = currentDatasetVal;
    } else {
      datasetFilter.value = "";
    }
    selectedDataset = datasetFilter.value;
    updateDeleteDatasetBtnVisibility();

    const chaptersInDataset = getChapterListForDataset(selectedDataset);
    const currentFilterVal = categoryFilter.value;
    let filterHtml = `<option value="">全部</option>`;
    chaptersInDataset.forEach(ch => {
      filterHtml += `<option value="${escapeHtml(ch)}">${escapeHtml(ch)}</option>`;
    });
    categoryFilter.innerHTML = filterHtml;
    if(currentFilterVal && chaptersInDataset.includes(currentFilterVal)) {
      categoryFilter.value = currentFilterVal;
    } else {
      categoryFilter.value = "";
    }
    selectedCategory = categoryFilter.value;

    const currentFormDatasetVal = datasetSelect.value;
    let formDatasetHtml = "";
    datasets.forEach(ds => {
      formDatasetHtml += `<option value="${escapeHtml(ds)}">${escapeHtml(ds)}</option>`;
    });
    if(datasets.length === 0){
      formDatasetHtml = `<option value="預設">預設</option>`;
    }
    datasetSelect.innerHTML = formDatasetHtml;
    if(currentFormDatasetVal && datasets.includes(currentFormDatasetVal)) {
      datasetSelect.value = currentFormDatasetVal;
    } else if(datasets.includes(selectedDataset)) {
      datasetSelect.value = selectedDataset;
    } else if(datasets.includes("預設")) {
      datasetSelect.value = "預設";
    }

    refreshFormChapterSelect();
  }

  function refreshFormChapterSelect(){
    const chaptersForForm = getChapterListForDataset(datasetSelect.value);
    const currentChapterVal = chapterSelect.value;
    let selectHtml = `<option value="">請選擇</option>`;
    chaptersForForm.forEach(ch => {
      selectHtml += `<option value="${escapeHtml(ch)}">${escapeHtml(ch)}</option>`;
    });
    chapterSelect.innerHTML = selectHtml;
    if(currentChapterVal && chaptersForForm.includes(currentChapterVal)) {
      chapterSelect.value = currentChapterVal;
    } else {
      chapterSelect.value = "";
    }
  }
  datasetSelect.addEventListener("change", refreshFormChapterSelect);

  // ---------- 新增類別 ----------
  function addNewChapter(){
    const name = prompt("請輸入新類別名稱：");
    if(!name || name.trim() === "") return;
    const trimmed = name.trim();
    const existing = getChapterList();
    if(existing.includes(trimmed)){
      alert("該類別已存在！");
      return;
    }
    const chapters = getChapterList().concat(trimmed).sort();
    let filterHtml = `<option value="">全部</option>`;
    chapters.forEach(ch => {
      filterHtml += `<option value="${escapeHtml(ch)}">${escapeHtml(ch)}</option>`;
    });
    categoryFilter.innerHTML = filterHtml;
    let selectHtml = `<option value="">請選擇</option>`;
    chapters.forEach(ch => {
      selectHtml += `<option value="${escapeHtml(ch)}">${escapeHtml(ch)}</option>`;
    });
    chapterSelect.innerHTML = selectHtml;
    chapterSelect.value = trimmed;
    alert("類別已新增！");
  }

  // ---------- 新增資料集（表單內） ----------
  function addNewDataset(){
    const name = prompt("請輸入新資料集（資料夾）名稱：");
    if(!name || name.trim() === "") return;
    const trimmed = name.trim();
    const existing = getDatasetList();
    if(existing.includes(trimmed)){
      alert("該資料集已存在！");
      datasetSelect.value = trimmed;
      refreshFormChapterSelect();
      return;
    }
    const datasets = existing.concat(trimmed).sort();
    let optHtml = "";
    datasets.forEach(ds => {
      optHtml += `<option value="${escapeHtml(ds)}">${escapeHtml(ds)}</option>`;
    });
    datasetSelect.innerHTML = optHtml;
    datasetSelect.value = trimmed;
    refreshFormChapterSelect();
    alert("資料集已新增！新增的字卡會存到這個新資料集。");
  }

  // ---------- 管理類別（重新命名／刪除） ----------
  const manageChaptersOverlay = $("#manageChaptersOverlay");
  const manageChaptersList = $("#manageChaptersList");

  function openManageChaptersSheet(){
    renderManageChaptersList();

  function renameChapter(oldName){
    const input = prompt(`將類別「${oldName}」重新命名為：`, oldName);

    const trimmed = input.trim();
    if(!trimmed || trimmed === oldName) return;
    const chapters = getChapterList();
    if(chapters.includes(trimmed)){
      if(!confirm(`類別「${trimmed}」已存在，是否要將「${oldName}」的字卡合併進去？`)) return;
    }
    cards.forEach(c => { if(c.chapter === oldName) c.chapter = trimmed; });
    saveCards();
    if(selectedCategory === oldName) selectedCategory = trimmed;
    render();
    resetQuizRound();
    if(currentMode === "quiz") renderQuiz();
    renderManageChaptersList();

  function getFilteredCards(){
    const q = searchQuery.trim().toLowerCase();
    return cards.filter(c => {
      if(selectedDataset && c.dataset !== selectedDataset) return false;
      if(selectedCategory && c.chapter !== selectedCategory) return false;
      if(q){
        const sourceText = c[c.sourceLang] || "";
        const targetText = c[c.targetLang] || "";
        const match = sourceText.toLowerCase().includes(q) ||
                      targetText.toLowerCase().includes(q) ||
                      (c.chapter && c.chapter.toLowerCase().includes(q));
        if(!match) return false;
      }
      return true;
    });
  }

  // ---------- 渲染 ----------
  function render(){
    updateAllChapterSelects();
    const filtered = getFilteredCards();
    const cardCountEl = document.getElementById("cardCountBadge");
    if(cardCountEl) cardCountEl.textContent = getDatasetCategoryCards().length;
    if(filtered.length===0){
      cardList.innerHTML = `<div class="empty-state">${cards.length===0
        ? "還沒有字卡<br>點右下角「＋」開始新增吧"
        : "找不到符合的字卡"}</div>`;
      return;
    }
    cardList.innerHTML = filtered.map((c, displayIdx)=>{
      const realIdx = cards.indexOf(c);
      const sourceText = c[c.sourceLang] || "";
      const targetText = c[c.targetLang] || "";
      const targetHtml = targetText ? `<div class="target-text">${escapeHtml(targetText)}</div>` : "";

      let displaySource;
      if (!hideSource) {
        displaySource = escapeHtml(sourceText);
      } else {
        if (revealedCards.has(c.id)) {
          displaySource = escapeHtml(sourceText);
        } else {
          displaySource = `<span class="hidden-placeholder">點擊顯示原文</span>`;
        }
      }

      return `
      <div class="card${c.marked ? ' marked' : ''}" data-id="${c.id}">
        <span class="source-text type-${c.type}" data-lang="${c.sourceLang}">${displaySource}</span>
        ${targetHtml}
        <div class="meta-row">
          <span class="drag-handle" title="按住拖曳排序">⠿</span>
          <div style="flex:1;"></div>
          <div class="card-actions">
            <button data-action="mark" title="標記" class="mark-btn${c.marked ? ' active' : ''}">🔖</button>
            <button data-action="up" title="上移" ${realIdx===0?"disabled style=opacity:0.25":""}>↑</button>
            <button data-action="down" title="下移" ${realIdx===cards.length-1?"disabled style=opacity:0.25":""}>↓</button>
            <button data-action="copy" title="複製">⧉</button>
            <button data-action="edit" title="編輯">✎</button>
            <button data-action="delete" title="刪除">🗑</button>
          </div>
        </div>
      </div>`;
    }).join("");
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }

  // ---------- 卡片點擊事件 ----------
  cardList.addEventListener("click", (e)=>{
    const sourceEl = e.target.closest(".source-text");
    if (sourceEl) {
      const cardEl = sourceEl.closest(".card");
      if (!cardEl) return;
      const id = cardEl.dataset.id;
      const c = cards.find(c => c.id === id);
      if (!c) return;

      if (hideSource) {
        if (revealedCards.has(id)) {
          revealedCards.delete(id);
        } else {
          revealedCards.add(id);
          const text = c[c.sourceLang] || "";
          speak(text, c.sourceLang);
          copyToClipboard(text, false);
        }
        render();
        return;
      } else {
        const text = c[c.sourceLang] || "";
        speak(text, c.sourceLang);
        copyToClipboard(text, false);
        return;
      }
    }

    const btn = e.target.closest("[data-action]");
    if(!btn) return;
    const cardEl = e.target.closest(".card");
    if(!cardEl) return;
    const id = cardEl.dataset.id;
    const idx = cards.findIndex(c=>c.id===id);
    if(idx===-1) return;
    const action = btn.dataset.action;

    if(action==="copy"){
      copyToClipboard(cards[idx][cards[idx].sourceLang], true);
    } else if(action==="mark"){
      cards[idx].marked = !cards[idx].marked;
      saveCards(); render();
    } else if(action==="up"){
      if(idx>0){ [cards[idx-1],cards[idx]]=[cards[idx],cards[idx-1]]; saveCards(); render(); }
    } else if(action==="down"){
      if(idx<cards.length-1){ [cards[idx+1],cards[idx]]=[cards[idx],cards[idx+1]]; saveCards(); render(); }
    } else if(action==="edit"){
      openEditSheet(cards[idx]);
    } else if(action==="delete"){
      if(confirm("確定要刪除這張字卡嗎？")){
        cards.splice(idx,1); saveCards(); render();
      }
    }
  });

  // ---------- 拖曳排序（按住把手圖示） ----------
  let dragState = null;

  function updateDragPosition(idx, total){
    const pct = total <= 1 ? 0 : Math.min(1, Math.max(0, idx/total));
    dragPositionThumb.style.top = (pct*100) + "%";
    dragPositionLabel.textContent = `${Math.min(idx+1, total)} / ${total}`;
  }

  function onDragMove(e){
    if(!dragState) return;
    e.preventDefault();
    const x = e.clientX - dragState.offsetX;
    const y = e.clientY - dragState.offsetY;
    dragState.clone.style.left = x + "px";
    dragState.clone.style.top = y + "px";

    const cardEls = Array.from(cardList.querySelectorAll(".card")).filter(el => el !== dragState.originEl);
    const pointerY = e.clientY;
    let insertBeforeEl = null;
    for(const el of cardEls){
      const r = el.getBoundingClientRect();
      if(pointerY < r.top + r.height/2){ insertBeforeEl = el; break; }
    }
    if(insertBeforeEl){
      cardList.insertBefore(dragState.insertionLine, insertBeforeEl);
    } else {
      cardList.appendChild(dragState.insertionLine);
    }

    const filtered = getFilteredCards();
    let targetRealIdx;
    if(insertBeforeEl){
      const beforeId = insertBeforeEl.dataset.id;
      targetRealIdx = cards.findIndex(c => c.id === beforeId);
    } else if(filtered.length > 0){
      const lastId = filtered[filtered.length-1].id;
      targetRealIdx = cards.findIndex(c => c.id === lastId) + 1;
    } else {
      targetRealIdx = cards.length;
    }
    dragState.targetRealIdx = targetRealIdx;

    const countCards = getDatasetCategoryCards();
    const displayIdx = countCards.filter(c => cards.indexOf(c) < targetRealIdx).length;
    updateDragPosition(displayIdx, countCards.length);

    const margin = 60;
    if(e.clientY < margin) browseView.scrollTop -= 14;
    else if(e.clientY > window.innerHeight - margin) browseView.scrollTop += 14;
  }

  function onDragEnd(){
    document.removeEventListener("pointermove", onDragMove);
    if(!dragState) return;
    const { id, originEl, clone, insertionLine } = dragState;
    insertionLine.remove();
    clone.remove();
    originEl.classList.remove("dragging-source");
    dragPositionBar.classList.remove("active");

    const fromIdx = cards.findIndex(c => c.id === id);
    let toIdx = dragState.targetRealIdx;
    dragState = null;
    if(fromIdx === -1) return;

    if(toIdx > fromIdx) toIdx--;
    toIdx = Math.max(0, Math.min(cards.length - 1, toIdx));

    if(toIdx !== fromIdx){
      const [moved] = cards.splice(fromIdx, 1);
      cards.splice(toIdx, 0, moved);
      saveCards();
    }
    render();
  }

  function startDrag(cardEl, e){
    const id = cardEl.dataset.id;
    const realIdx = cards.findIndex(c => c.id === id);
    if(realIdx === -1) return;
    const rect = cardEl.getBoundingClientRect();

    const clone = cardEl.cloneNode(true);
    clone.classList.add("card-drag-clone");
    clone.style.width = rect.width + "px";
    clone.style.left = rect.left + "px";
    clone.style.top = rect.top + "px";
    clone.querySelectorAll("button").forEach(b => { b.style.pointerEvents = "none"; });
    document.body.appendChild(clone);

    cardEl.classList.add("dragging-source");

    const insertionLine = document.createElement("div");
    insertionLine.className = "drop-insertion-line";

    dragState = {
      id, originEl: cardEl, clone,
      offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top,
      insertionLine, targetRealIdx: realIdx
    };

    dragPositionBar.classList.add("active");
    const countCardsAtStart = getDatasetCategoryCards();
    const idxAtStart = countCardsAtStart.findIndex(c => c.id === id);
    updateDragPosition(idxAtStart === -1 ? 0 : idxAtStart, countCardsAtStart.length);

    try{ navigator.vibrate && navigator.vibrate(15); }catch(err){}

    document.addEventListener("pointermove", onDragMove, { passive:false });
    document.addEventListener("pointerup", onDragEnd, { once:true });
    document.addEventListener("pointercancel", onDragEnd, { once:true });

    onDragMove(e);
  }

  cardList.addEventListener("pointerdown", (e)=>{
    const handle = e.target.closest(".drag-handle");
    if(!handle) return;
    const cardEl = handle.closest(".card");
    if(!cardEl) return;
    e.preventDefault();
    startDrag(cardEl, e);
  });

  function speak(text, lang){
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang || "en";
      window.speechSynthesis.speak(u);
    }catch(e){ /* speech not supported */ }
  }

  function copyToClipboard(text, showToast){
    function fallbackCopy(){
      try{
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }catch(e){ /* copy not supported */ }
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }
  }
