html:fullscreen,html:fullscreen body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--system-ground,var(--ink))}html:fullscreen::backdrop{background:var(--system-ground,var(--ink))}html:fullscreen #stage,.stage:fullscreen{position:fixed;inset:0;width:100vw;height:100vh;min-width:100vw;min-height:100vh;margin:0;padding:0;overflow:hidden;background:var(--system-ground,var(--ink))}html:fullscreen #field,.stage:fullscreen #field{position:absolute;inset:0;display:block;width:100vw;height:100vh;min-width:100vw;min-height:100vh;margin:0;padding:0}.quickbar,.zoomdock{position:fixed;z-index:2;display:grid;gap:.45rem}.quickbar{right:clamp(1rem,3vw,2rem);top:clamp(1rem,3vw,2rem)}.zoomdock{right:clamp(1rem,3vw,2rem);bottom:clamp(1rem,3vw,2rem)}.quick{width:3.5rem;height:3.5rem;border:1px solid #fcfbfab0;border-radius:50%;background:#121315cc;color:var(--jade);font-size:1.25rem;box-shadow:0 .5rem 1.4rem #000a}.quick:hover{background:var(--red);border-color:var(--gold)}.quick[data-saved="true"]{background:var(--gold);border-color:var(--gold);color:var(--ink)}.quick[data-running="true"]{background:var(--red);border-color:var(--gold);color:var(--jade)}

<body><main id="stage" class="stage"><canvas id="field"></canvas></main><nav class="quickbar" aria-label="主畫面快捷功能"><button id="open" class="quick" title="開啟設定">⚙</button><button id="quick-run" class="quick" title="開始動畫" aria-label="開始動畫" data-running="false">▶</button><button id="quick-save" class="quick" title="記錄目前規則">＋</button><button id="fullscreen" class="quick" title="切換全螢幕">⛶</button></nav><nav class="zoomdock" aria-label="縮放"><button id="zoom-in" class="quick" title="放大">+</button><button id="zoom-out" class="quick" title="縮小">−</button></nav>
<dialog id="settings"><header><div><p class="eyebrow">FRACTAL FIELD STUDY</p><h1>雪花格紋設定</h1></div><button id="close" class="x">×</button></header><div class="body">
<section class="sec"><h2>疊代 <small id="order">第 0 階</small></h2><div class="step"><button id="less">−</button><input id="iter" type="range" min="0" max="10" value="0"><button id="more">＋</button></div><p class="hint">每條基礎邊理論上：<b id="segments">1</b> 段。高階細節依畫面像素自動合併，避免卡住。</p></section>
<section class="sec"><h2>邊生成器 <small>RULE</small></h2><div class="row"><label for="rule">構造方式</label><select id="rule"><option value="out">向外 Koch</option><option value="in">向內 Koch</option><option value="alt">交替 Koch</option><option value="sine">正弦波</option><option value="saw">鋸齒波</option><option value="square">方波</option><option value="bi">雙向脈衝</option><option value="arch">拱形波</option><option value="cos">餘弦脈衝</option><option value="mod">調幅波</option><option value="step">階梯波</option></select></div><div id="wave"><div class="row"><label for="amp">振幅</label><div><input id="amp" type="range" min="0.05" max="0.45" step="0.01" value="0.23"><output id="ampv">23%</output></div></div><div class="row"><label for="freq">頻率</label><div><input id="freq" type="range" min="1" max="6" step="1" value="2"><output id="freqv">2 cycles</output></div></div><div class="row"><label for="dir">方向</label><select id="dir"><option value="out">向外</option><option value="in">向內</option></select></div></div><div class="grid"><button class="preset" data-p="classic">經典 Koch</button><button class="preset" data-p="ripple">柔和波紋</button><button class="preset" data-p="serrate">鋒利鋸齒</button><button class="preset" data-p="reverse">反向波形</button><button class="preset" data-p="gate">方波閘門</button><button class="preset" data-p="twin">雙向脈衝</button><button class="preset" data-p="arches">拱形韻律</button><button class="preset" data-p="cosine">餘弦花瓣</button><button class="preset" data-p="modulated">調幅潮汐</button><button class="preset" data-p="stairs">階梯脈衝</button></div><button id="random" class="btn gold" style="width:100%;margin-top:.7rem">生成隨機波形</button></section>
<section class="sec"><h2>色彩 <small>COLOR</small></h2><div class="row"><label for="tile">雪花色</label><input id="tile" type="color" value="#942525"></div><div class="row"><label for="ground">底色</label><input id="ground" type="color" value="#121315"></div><label class="toggle"><span>隨疊代循環漸層色彩</span><input id="grad" type="checkbox" checked></label></section>
<section class="sec"><h2>動態與檢視 <small>MOTION</small></h2><div class="grid"><button id="run" class="btn primary">▶ 開始動畫</button><button id="fit" class="btn">重設平移與縮放</button></div><div class="row"><label for="speed">動畫速度</label><div><input id="speed" type="range" min="0.5" max="4" step="0.5" value="0.5"><output id="speedv">0.5 steps/s</output></div></div><label class="toggle"><span>每一步隨機變化規則</span><input id="randmode" type="checkbox" checked></label><label class="toggle"><span>每一步隨機色彩</span><input id="randcolor" type="checkbox" checked></label><label class="toggle"><span>每一步隨機振幅</span><input id="randamp" type="checkbox" checked></label><label class="toggle"><span>每一步隨機頻率</span><input id="randfreq" type="checkbox" checked></label></section>
<section class="sec"><h2>儲存規則 <small>PRESETS</small></h2><div class="row"><label for="name">名稱</label><input id="name" type="text" maxlength="36" placeholder="為目前規則命名"></div><div class="grid"><button id="add" class="btn primary">＋ 加入目前設定</button><button id="pexport" class="btn">匯出規則 JSON</button><label class="upload">匯入規則 JSON<input id="pimport" type="file" accept="application/json,.json"></label></div><div id="saved" class="grid"><p class="empty">尚未儲存個人規則。</p></div></section>
<section class="sec"><h2>輸出與 3D <small>OUTPUT</small></h2><div class="grid"><button id="png" class="btn">輸出 PNG</button><button id="svg" class="btn">輸出 SVG</button><button id="open3" class="btn gold">查看 3D 雪花</button><button id="resetcolor" class="btn">還原預設色彩</button></div></section>
</div></dialog>
<section id="viewer" class="viewer" hidden><div class="vhead"><div><p class="eyebrow">EXTRUDED ACTIVE RULE</p><h2>3D 雪花</h2></div><div class="views"><button id="iso">等角</button><button id="top">頂視</button><button id="side">側視</button><button id="zoom3-in">3D ＋</button><button id="zoom3-out">3D −</button><button id="vreset">重設</button><button id="vclose">返回作品</button></div></div><canvas id="three"></canvas><div class="note">拖曳旋轉 · 滾輪縮放</div></section>
<script>
(()=>{"use strict";
const $=x=>document.getElementById(x),cv=$('field'),cx=cv.getContext('2d'),d=$('settings'),tv=$('three'),tx=tv.getContext('2d'),R=Math.sqrt(3);let raf,drag,timer=null,traf,orbit,stored=[];const cache=new Map(),s={n:0,r:'out',a:.23,f:2,dir:'out',tile:'#942525',ground:'#121315',grad:true,zoom:1,px:0,py:0},cam={yaw:-.72,pitch:.58,z:1};
const preset={classic:{r:'out'},ripple:{r:'sine',a:.14,f:2},serrate:{r:'saw',a:.32,f:4},reverse:{r:'sine',a:.27,f:3,dir:'in'},gate:{r:'square',a:.19,f:3},twin:{r:'bi',a:.24,f:4},arches:{r:'arch',a:.22,f:3},cosine:{r:'cos',a:.18,f:2},modulated:{r:'mod',a:.28,f:4},stairs:{r:'step',a:.17,f:3}};
const wave=q=>['sine','saw','square','bi','arch','cos','mod','step'].includes(q.r);const smooth=q=>['sine','arch','cos','mod'].includes(q.r);const branches=q=>smooth(q)?Math.min(32,Math.max(8,q.f*6)):q.r==='step'?Math.min(20,Math.max(8,q.f*3)):wave(q)?Math.min(14,Math.max(4,q.f*2)):4;const depth=q=>Math.min(s.n,wave(q)?2:4);
function hex(c,r){return Array.from({length:6},(_,i)=>{const a=-Math.PI/2+i*Math.PI/3;return{x:c.x+r*Math.cos(a),y:c.y+r*Math.sin(a)}})}
function sign(k,q){return q.r==='in'?-1:q.r==='alt'?(k%2?1:-1):q.dir==='in'?-1:1}
function replacement(a,b,k,q){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(wave(q)){const n=branches(q),nrm={x:sign(k,q)*dy/len,y:-sign(k,q)*dx/len};return Array.from({length:n},(_,i)=>{const t=(i+1)/n,phase=q.f*t,f=phase-Math.floor(phase);let w;if(q.r==='sine')w=Math.sin(2*Math.PI*phase);else if(q.r==='saw')w=1-Math.abs(2*f-1);else if(q.r==='square')w=f<.5?1:-1;else if(q.r==='bi')w=(Math.floor(phase)%2?-1:1)*(1-Math.abs(2*f-1));else if(q.r==='arch')w=Math.sin(Math.PI*phase);else if(q.r==='cos')w=.5-.5*Math.cos(2*Math.PI*phase);else if(q.r==='mod')w=Math.sin(2*Math.PI*phase)*(.35+.65*Math.sin(Math.PI*t));else w=Math.floor(f*4)/3*2-1;return{x:a.x+dx*t+nrm.x*q.a*len*w,y:a.y+dy*t+nrm.y*q.a*len*w}})}const t={x:dx/3,y:dy/3},p={x:a.x+t.x,y:a.y+t.y},u={x:a.x+2*t.x,y:a.y+2*t.y},z=sign(k,q),v={x:p.x+t.x/2+z*t.y*R/2,y:p.y-z*t.x*R/2+t.y/2};return[p,v,u,b]}
function walk(a,b,k,q,out){if(k===0){out.push(b);return}let last=a;for(const p of replacement(a,b,k,q)){walk(last,p,k-1,q,out);last=p}}
function geometry(q){const id=[q.r,q.a,q.f,q.dir,depth(q)].join('|');if(cache.has(id))return cache.get(id);const v=hex({x:0,y:0},1),points=[v[0]];for(let i=0;i<6;i++)walk(v[i],v[(i+1)%6],depth(q),q,points);points.pop();const path=new Path2D();path.moveTo(points[0].x,points[0].y);for(const p of points.slice(1))path.lineTo(p.x,p.y);path.closePath();const g={points,path};cache.set(id,g);return g}
function mix(a,b,t){const A=a.slice(1).match(/../g).map(x=>parseInt(x,16)),B=b.slice(1).match(/../g).map(x=>parseInt(x,16));return'#'+A.map((x,i)=>Math.round(x+(B[i]-x)*t).toString(16).padStart(2,'0')).join('')}
function systemSurface(ground){document.documentElement.style.setProperty('--system-ground',ground);document.body.style.backgroundColor=ground;const theme=$('theme-color');if(theme)theme.content=ground}function palette(){return s.grad?{tile:mix(s.tile,'#bd8b2a',s.n/14),ground:mix(s.ground,'#25191a',s.n/18)}:{tile:s.tile,ground:s.ground}}
function layout(w,h){const r=Math.max(58,Math.min(165,Math.min(w/4.2,h/3.1)));return{r,hx:3*R*r/2,dx:3*R*r/4,dy:9*r/4}}
function draw(){const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;const pr=Math.min(devicePixelRatio||1,2),p=palette(),l=layout(w,h),cols=Math.ceil(w/l.hx/s.zoom)+4,rows=Math.ceil(h/l.dy/s.zoom)+4,g=geometry(s);systemSurface(p.ground);cv.width=w*pr;cv.height=h*pr;cx.setTransform(pr,0,0,pr,0,0);cx.fillStyle=p.ground;cx.fillRect(0,0,w,h);cx.save();cx.translate(s.px,s.py);cx.scale(s.zoom,s.zoom);cx.fillStyle=p.tile;for(let row=-rows;row<=rows;row++)for(let col=-cols;col<=cols;col++){cx.save();cx.translate(w/2+col*l.hx+row*l.dx,h/2+row*l.dy);cx.scale(l.r,l.r);cx.fill(g.path);cx.restore()}cx.restore()}
function schedule(){cancelAnimationFrame(raf);raf=requestAnimationFrame(draw)}
function sync(){const full=(branches(s)**s.n).toLocaleString();$('iter').value=s.n;$('order').textContent=`第 ${s.n} 階`;$('segments').textContent=full;$('less').disabled=s.n===0;$('more').disabled=s.n===10;$('rule').value=s.r;$('amp').value=s.a;$('freq').value=s.f;$('dir').value=s.dir;$('tile').value=s.tile;$('ground').value=s.ground;$('grad').checked=s.grad;$('wave').hidden=!wave(s);$('ampv').textContent=Math.round(s.a*100)+'%';$('freqv').textContent=s.f+' cycles'}
function setOrder(n){s.n=Math.max(0,Math.min(10,+n));sync();schedule()}
function apply(q){Object.assign(s,{r:q.r||s.r,a:+q.a||s.a,f:+q.f||s.f,dir:q.dir||s.dir,tile:q.tile||s.tile,ground:q.ground||s.ground,grad:typeof q.grad==='boolean'?q.grad:s.grad,n:Number.isInteger(q.n)?q.n:s.n});sync();schedule()}
function randomRule(){s.r=['sine','saw','square','bi','arch','cos','mod','step'][Math.floor(Math.random()*8)];s.dir=Math.random()<.5?'out':'in'}function randomAmplitude(){s.a=+(.08+Math.random()*.32).toFixed(2)}function randomFrequency(){s.f=1+Math.floor(Math.random()*6)}function random(){randomRule();randomAmplitude();randomFrequency();sync();schedule()}
function randomColors(){const tiles=['#942525','#b85c38','#2d6f87','#6d487b','#806c28','#a43d4e'],grounds=['#121315','#17201a','#18202c','#241820','#1f1928'];s.tile=tiles[Math.floor(Math.random()*tiles.length)];s.ground=grounds[Math.floor(Math.random()*grounds.length)];}
function playbackUI(active){$('run').textContent=active?'Ⅱ 暫停動畫':'▶ 開始動畫';const quick=$('quick-run');quick.textContent=active?'Ⅱ':'▶';quick.title=active?'暫停動畫':'開始動畫';quick.setAttribute('aria-label',quick.title);quick.dataset.running=String(active)}function stop(){if(timer)clearInterval(timer);timer=null;playbackUI(false)}
function run(){if(timer){stop();return}playbackUI(true);timer=setInterval(()=>{if($('randcolor').checked)randomColors();if($('randmode').checked)randomRule();if($('randamp').checked)randomAmplitude();if($('randfreq').checked)randomFrequency();setOrder((s.n+1)%11)},1000/+$('speed').value)}
function fit(){s.px=s.py=0;s.zoom=1;schedule()}
function snapshot(name){return{name,r:s.r,a:s.a,f:s.f,dir:s.dir,tile:s.tile,ground:s.ground,grad:s.grad,n:s.n}}
function persist(){try{localStorage.setItem('fractal-fast-presets',JSON.stringify(stored))}catch(e){}}
function renderSaved(){const box=$('saved');box.replaceChildren();if(!stored.length){box.innerHTML='<p class="empty">尚未儲存個人規則。</p>';return}stored.forEach((p,i)=>{const row=document.createElement('div'),use=document.createElement('button'),edit=document.createElement('button'),del=document.createElement('button');row.className='saved';use.textContent=p.name;use.onclick=()=>{apply(p);d.close()};edit.textContent='✎';edit.onclick=()=>{const n=prompt('重新命名',p.name);if(n&&n.trim()){p.name=n.trim().slice(0,36);persist();renderSaved()}};del.textContent='×';del.className='del';del.onclick=()=>{stored.splice(i,1);persist();renderSaved()};row.append(use,edit,del);box.append(row)})}
